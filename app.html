<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041814">
<title>المشرف الميداني — النسخة العالمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #978d5b; --gold-light: #d4c896; --gold-bright: #f5e6b3;
  --teal: #0d4a42; --teal-dark: #082b26; --teal-deep: #041814;
  --green: #43a047; --green-light: #69f0ae;
  --red: #e53935; --red-light: #ff5252;
  --amber: #fb8c00; --amber-light: #ffa726;
  --blue: #29b6f6; --blue-light: #64b5f6;
  --border: rgba(151,141,91,0.3);
  --surface: rgba(13,74,66,0.55);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal',sans-serif; }
html, body { background: var(--teal-deep); color: #fff; font-weight: 600; overflow-x: hidden; }
body { min-height: 100vh; padding-bottom: calc(100px + var(--safe-bottom)); }
body::before { content: ''; position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), radial-gradient(circle at 85% 90%, rgba(13,74,66,0.6) 0%, transparent 50%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.1); opacity:0.7;} }

#loadingOverlay { position:fixed; inset:0; z-index:9999; background:var(--teal-deep); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.spinner { width:50px; height:50px; border:5px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 1s linear infinite; margin-bottom:16px; }
#mainApp { display: none; } #mainApp.ready { display: block; }

/* الشريط العلوي */
.topbar { position: sticky; top: 0; z-index: 100; padding: calc(12px + var(--safe-top)) 16px 12px; background: linear-gradient(135deg, rgba(4,24,20,0.98), rgba(13,74,66,0.95)); border-bottom: 2px solid var(--gold); display: flex; align-items: center; gap: 10px; backdrop-filter: blur(10px); }
.topbar-logo { width: 44px; height: 44px; border-radius: 12px; object-fit: contain; background: #fff; padding: 2px; box-shadow: 0 0 10px rgba(151,141,91,0.5); }
.topbar-info { flex: 1; }
.topbar-info h1 { font-size: 15px; color: var(--gold-light); font-weight: 900; }
.topbar-info p { font-size: 11px; color: rgba(255,255,255,0.7); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-light); box-shadow: 0 0 10px var(--green-light); }
.status-dot.offline { background: var(--red-light); box-shadow: 0 0 10px var(--red-light); }
.clock { font-size: 11px; font-family: monospace; color: var(--gold-light); background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 6px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
.icon-btn:active { transform: scale(0.9); }

/* الشريط السفلي */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: linear-gradient(180deg, rgba(13,74,66,0.98), rgba(4,24,20,0.98)); border-top: 2px solid var(--gold); padding: 8px 8px calc(8px + var(--safe-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; backdrop-filter: blur(20px); }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; cursor: pointer; background: transparent; border: none; color: rgba(255,255,255,0.6); font-family: inherit; font-weight: 700; font-size: 10px; transition: 0.3s; }
.nav-btn .nav-icon { font-size: 22px; transition: 0.3s; }
.nav-btn.active { background: linear-gradient(135deg, rgba(151,141,91,0.3), rgba(151,141,91,0.1)); color: var(--gold-light); }
.nav-btn.active .nav-icon { transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(151,141,91,0.8)); }

/* الصفحات */
.page { display: none; padding: 16px; max-width: 800px; margin: 0 auto; animation: fadeIn 0.4s ease-out; }
.page.active { display: block; }

/* البطاقات */
.card { background: linear-gradient(145deg, var(--surface), rgba(4,24,20,0.9)); border: 1px solid var(--border); border-radius: 20px; padding: 18px; margin-bottom: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
.card-title { font-size: 15px; color: var(--gold-light); font-weight: 900; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid rgba(151,141,91,0.2); display: flex; align-items: center; gap: 8px; }

/* ترحيب */
.welcome-card { background: linear-gradient(135deg, rgba(151,141,91,0.2), rgba(13,74,66,0.6)); border: 2px solid var(--gold); border-radius: 20px; padding: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; box-shadow: 0 0 20px rgba(151,141,91,0.15); }
.welcome-text h1 { font-size: 20px; color: #fff; font-weight: 900; margin-bottom: 4px; }
.welcome-text p { font-size: 12px; color: var(--gold-light); }
.mil-badge { background: rgba(0,0,0,0.5); border: 1px solid var(--gold); color: var(--gold-light); padding: 6px 12px; border-radius: 8px; font-family: monospace; font-size: 14px; font-weight: 900; }

/* الأزرار الرئيسية */
.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.action-btn { padding: 20px 14px; border-radius: 18px; border: none; font-family: inherit; font-weight: 900; font-size: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
.action-btn:active { transform: scale(0.95); }
.action-btn.danger { background: linear-gradient(135deg, #e53935, #ff5252); }
.action-btn.success { background: linear-gradient(135deg, #43a047, #69f0ae); color: #041814; }
.action-btn.info { background: linear-gradient(135deg, #29b6f6, #64b5f6); color: #fff; grid-column: span 2; }

/* البطاقات */
.item-card { background: rgba(4,24,20,0.8); border: 1px solid var(--border); border-right: 4px solid var(--gold); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.item-card.green { border-right-color: var(--green-light); }
.item-card.red { border-right-color: var(--red-light); }
.item-info h4 { font-size: 14px; font-weight: 900; color: var(--gold-light); margin-bottom: 4px; }
.item-info p { font-size: 11px; color: rgba(255,255,255,0.6); }

/* المدخلات */
input, select, textarea { width: 100%; padding: 14px; background: rgba(4,24,20,0.8); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 14px; font-family: inherit; font-weight: 600; outline: none; margin-bottom: 14px; transition: 0.3s; }
input:focus, select:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(151,141,91,0.2); }
label { display: block; font-size: 13px; color: var(--gold-light); font-weight: 700; margin-bottom: 8px; }

/* شبكة الأيقونات */
.icon-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
@media (max-width: 400px) { .icon-grid { grid-template-columns: repeat(3, 1fr); } }
.select-icon { background: rgba(4,24,20,0.8); border: 2px solid var(--border); border-radius: 14px; padding: 14px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
.select-icon .icon { font-size: 26px; margin-bottom: 6px; }
.select-icon .label { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.7); }
.select-icon.active { border-color: var(--gold); background: rgba(151,141,91,0.2); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(151,141,91,0.3); }
.select-icon.active .label { color: var(--gold-light); }

/* الرقائق */
.chips-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip-sel { padding: 10px 16px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); font-size: 12px; cursor: pointer; transition: 0.2s; font-weight: 700; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 6px; }
.chip-sel:active { transform: scale(0.95); }
.chip-sel.selected { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--teal-deep); border-color: var(--gold-light); font-weight: 900; box-shadow: 0 4px 12px rgba(151,141,91,0.4); }
.chip-sel.selected::before { content: '✓'; font-weight: 900; }

/* الأزرار */
.btn { padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--teal-deep); font-size: 15px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: 0.2s; }
.btn:active { transform: scale(0.97); }
.btn.danger { background: linear-gradient(135deg, var(--red), var(--red-light)); color: #fff; }
.btn.success { background: linear-gradient(135deg, var(--green), var(--green-light)); color: #041814; }
.btn.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border); }

/* المايك */
.input-with-btn { position: relative; margin-bottom: 14px; }
.input-with-btn textarea { margin-bottom: 0; padding-left: 50px; }
.mic-btn { position: absolute; bottom: 10px; left: 10px; width: 38px; height: 38px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--blue), var(--blue-light)); color: var(--teal-deep); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(41,182,246,0.4); }
.mic-btn.recording { background: linear-gradient(135deg, var(--red), var(--red-light)); color: #fff; animation: pulse 1s infinite; }

/* المودال */
.modal-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.85); display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(5px); }
.modal-overlay.show { display: flex; }
.modal-sheet { background: linear-gradient(145deg, var(--teal), var(--teal-dark)); border-top-left-radius: 26px; border-top-right-radius: 26px; border-top: 3px solid var(--gold); width: 100%; max-width: 800px; max-height: 92vh; padding: 24px 18px calc(24px + var(--safe-bottom)); overflow-y: auto; animation: fadeIn 0.35s; }
.modal-sheet h3 { color: var(--gold-light); font-size: 18px; font-weight: 900; text-align: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }

/* التنبيهات */
.toast-container { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 3000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: calc(100% - 32px); max-width: 420px; }
.toast { background: linear-gradient(135deg, var(--teal), var(--teal-dark)); color: #fff; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--gold); font-size: 14px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 10px; animation: fadeIn 0.3s; }
.toast.success { border-color: var(--green-light); }
.toast.danger { border-color: var(--red-light); }

/* الدردشة */
.chat-container { display: flex; flex-direction: column; height: 60vh; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.message { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; }
.message.mine { align-self: flex-end; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--teal-deep); border-bottom-left-radius: 2px; }
.message.theirs { align-self: flex-start; background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-bottom-right-radius: 2px; }
.message .time { font-size: 9px; opacity: 0.6; margin-top: 4px; display: block; text-align: left; }
.chat-input-box { display: flex; padding: 10px; background: rgba(4,24,20,0.8); border-top: 1px solid var(--border); }
.chat-input-box input { flex: 1; margin: 0; border-radius: 10px 0 0 10px; border-left: none; background: #000; }
.chat-input-box button { padding: 0 20px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--teal-deep); border: none; border-radius: 0 10px 10px 0; font-weight: 900; cursor: pointer; }

/* أزرار الحفظ */
.modal-actions { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 10px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="color:var(--gold-light); font-weight:900;">جاري تحميل النظام العالمي...</div>
</div>

<div id="mainApp">
  <!-- الشريط العلوي -->
  <div class="topbar">
    <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="topbar-logo" alt="الشعار">
    <div class="topbar-info">
      <h1>المشرف الميداني</h1>
      <p><span class="status-dot" id="statusDot"></span><span id="currentUser">—</span></p>
    </div>
    <div class="clock" id="clockDisplay">00:00</div>
    <button class="icon-btn" onclick="toggleSOS()" style="border-color:var(--red); color:var(--red);">🚨</button>
  </div>

  <!-- 1. الرئيسية -->
  <div class="page active" id="page-home">
    <div class="welcome-card">
      <div class="welcome-text">
        <h1 id="welcomeName">مرحباً</h1>
        <p id="welcomeSector">القطاع</p>
      </div>
      <div class="mil-badge" id="heroAvatar">#0000</div>
    </div>

    <button class="btn warning" onclick="openShiftHandover()" style="margin-bottom: 16px; font-size: 15px; background:linear-gradient(135deg, #fb8c00, #ffa726); color:#041814;">🔄 استلام / تسليم الدوام</button>

    <div class="quick-actions">
      <button class="action-btn danger" onclick="startEntry('complaint')"><span style="font-size:32px;">🚩</span><span>تسجيل إشكالية</span></button>
      <button class="action-btn success" onclick="startEntry('praise')"><span style="font-size:32px;">⭐</span><span>تسجيل إشادة</span></button>
      <button class="action-btn info" onclick="startVisit()"><span style="font-size:28px;">📋</span><span>تسجيل زيارة مركز</span></button>
    </div>

    <div class="card">
      <div class="card-title">📢 التعاميم الأخيرة</div>
      <div id="broadcastsList">جاري التحميل...</div>
    </div>
  </div>

  <!-- 2. السجلات -->
  <div class="page" id="page-issues">
    <div class="card">
      <div class="card-title">📋 سجلاتي</div>
      <div id="issuesList">جاري التحميل...</div>
    </div>
  </div>

  <!-- 3. الدردشة -->
  <div class="page" id="page-chat">
    <div class="card" style="padding:10px;">
      <div class="card-title" style="margin-bottom:5px;">💬 غرفة عمليات المشرفين</div>
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-box">
          <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key === 'Enter') sendMessage()">
          <button onclick="sendMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. الملف الشخصي -->
  <div class="page" id="page-profile">
     <div class="card" style="text-align:center;">
        <h2 style="color:var(--gold-light); font-size:20px;" id="profName">—</h2>
        <p style="color:#ccc; font-size:12px; margin-top:5px;" id="profSector">—</p>
        <div class="mil-badge" style="display:inline-block; margin-top:10px;" id="profAvatar">#0000</div>
     </div>
     <div class="card">
        <div class="card-title">📊 إحصائياتي</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:center;">
            <div style="background:rgba(229,57,53,0.2); padding:15px; border-radius:12px;"><h3 style="font-size:24px; color:var(--red-light);" id="statIssues">0</h3><p style="font-size:11px;">إشكالات</p></div>
            <div style="background:rgba(67,160,71,0.2); padding:15px; border-radius:12px;"><h3 style="font-size:24px; color:var(--green-light);" id="statPraises">0</h3><p style="font-size:11px;">إشادات</p></div>
        </div>
     </div>
     <button class="btn secondary" onclick="logout()" style="margin-top:20px;">🚪 تسجيل الخروج</button>
  </div>

  <!-- الشريط السفلي -->
  <div class="bottom-nav">
    <button class="nav-btn active" data-page="home" onclick="switchPage('home')"><span class="nav-icon">🏠</span><span>الرئيسية</span></button>
    <button class="nav-btn" data-page="issues" onclick="switchPage('issues')"><span class="nav-icon">📋</span><span>سجلاتي</span></button>
    <button class="nav-btn" data-page="new" onclick="switchPage('new')"><span class="nav-icon" style="font-size:28px; color:var(--gold-light);">➕</span><span>إضافة</span></button>
    <button class="nav-btn" data-page="chat" onclick="switchPage('chat')"><span class="nav-icon">💬</span><span>التواصل</span></button>
    <button class="nav-btn" data-page="profile" onclick="switchPage('profile')"><span class="nav-icon">👤</span><span>حسابي</span></button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet"><h3 id="modalTitle">تفاصيل</h3><div id="modalBody"></div></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyC3m9o6Qx7m6r1b08DZIkyttArIihZL8n8",
      authDomain: "ems-supervisor.firebaseapp.com",
      projectId: "ems-supervisor",
      storageBucket: "ems-supervisor.firebasestorage.app",
      messagingSenderId: "230655268524",
      appId: "1:230655268524:web:5043a458af3d79989ff109"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const session = localStorage.getItem("ems_session");
    if (!session) { window.location.href = "./index.html"; }
    const user = JSON.parse(session);
    if (user.type === "admin" || user.type === "ops") { window.location.href = "./index.html"; }

    // إخفاء التحميل
    document.getElementById("loadingOverlay").style.display = "none";
    document.getElementById("mainApp").classList.add("ready");
    document.getElementById("currentUser").innerText = user.name;
    document.getElementById("welcomeName").innerText = user.name;
    document.getElementById("welcomeSector").innerText = user.sector || "قطاع غير محدد";
    document.getElementById("heroAvatar").innerText = user.code || "—";
    document.getElementById("profName").innerText = user.name;
    document.getElementById("profSector").innerText = user.sector || "غير محدد";
    document.getElementById("profAvatar").innerText = user.code || "—";

    let cachedParamedics = [], cachedVehicles = [], cachedMaster = [];
    let currentLocation = { lat: null, lng: null };

    // الساعة
    setInterval(() => {
        const d = new Date();
        document.getElementById("clockDisplay").innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }, 1000);

    // مؤشر الاتصال
    window.addEventListener('online', () => document.getElementById("statusDot").className = "status-dot");
    window.addEventListener('offline', () => document.getElementById("statusDot").className = "status-dot offline");
    if(!navigator.onLine) document.getElementById("statusDot").className = "status-dot offline";

    // جلب الموقع في الخلفية
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition((pos) => {
            currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        }, null, { enableHighAccuracy: true });
    }

    function showToast(msg, type="success") {
        const c = document.getElementById("toastContainer");
        const t = document.createElement("div");
        t.className = "toast " + type;
        t.innerHTML = `<span>${type==='success'?'✅':'⚠️'}</span> <span>${msg}</span>`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function switchPage(id) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        let targetId = id === "new" ? "home" : id;
        document.getElementById("page-" + targetId).classList.add("active");
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        const btn = document.querySelector(`.nav-btn[data-page="${id}"]`);
        if(btn) btn.classList.add("active");
        if(id === "new") startEntry('complaint');
        window.scrollTo({top:0,behavior:"smooth"});
    }

    // 1. جلب البيانات
    async function loadData() {
        try {
            const [broadcasts, issues, params, vehicles, master] = await Promise.all([
                db.collection("broadcasts").get(),
                db.collection("issues").where("supervisor", "==", user.name).get(),
                db.collection("paramedics").get(),
                db.collection("vehicles").get(),
                db.collection("issue_types").get()
            ]);

            let bcHtml = "";
            broadcasts.forEach(d => { const data = d.data(); bcHtml += `<div class="item-card" style="border-right-color:var(--blue);"><div class="item-info"><h4>📢 ${data.title}</h4><p>${data.description}</p></div></div>`; });
            document.getElementById("broadcastsList").innerHTML = bcHtml || "لا تعاميم";

            cachedParamedics = []; params.forEach(d => cachedParamedics.push(d.data()));
            cachedVehicles = []; vehicles.forEach(d => cachedVehicles.push(d.data()));
            cachedMaster = []; master.forEach(d => cachedMaster.push(d.data().name));

            let issHtml = ""; let ic = 0, pc = 0;
            issues.forEach(d => {
                const data = d.data();
                const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString('ar-OM') : '';
                if (data.isPraise) pc++; else ic++;
                issHtml += `<div class="item-card ${data.isPraise ? 'green' : 'red'}">
                    <div class="item-info">
                        <h4>${data.type === 'visit' ? '📋 زيارة' : data.isPraise ? '⭐ إشادة' : '🚩 إشكالية'}</h4>
                        <p>${data.title || data.issueType || data.praiseType} | ${time}</p>
                    </div>
                </div>`;
            });
            document.getElementById("issuesList").innerHTML = issHtml || "لا سجلات";
            document.getElementById("statIssues").innerText = ic;
            document.getElementById("statPraises").innerText = pc;
            
            loadChat();
        } catch(e) { console.warn(e); }
    }

    // 2. الإدخال الذكي (Multistep)
    function startEntry(type) {
        const isComplaint = type === 'complaint';
        const title = isComplaint ? "🚩 تسجيل إشكالية" : "⭐ تسجيل إشادة";
        
        document.getElementById("modalTitle").innerText = title;
        document.getElementById("modalBody").innerHTML = `
            <label>🎯 ما هو هدف التقييم؟ (اضغط للاختيار)</label>
            <div class="icon-grid">
                <div class="select-icon active" id="icon-paramedic" onclick="selectTarget('paramedic')"><span class="icon">👨‍🚒</span><span class="label">مسعف</span></div>
                <div class="select-icon" id="icon-center" onclick="selectTarget('center')"><span class="icon">🏥</span><span class="label">مركز</span></div>
                <div class="select-icon" id="icon-vehicle" onclick="selectTarget('vehicle')"><span class="icon">🚑</span><span class="label">مركبة</span></div>
                <div class="select-icon" id="icon-stock" onclick="selectTarget('stock')"><span class="icon">💊</span><span class="label">مخزن</span></div>
                <div class="select-icon" id="icon-equip" onclick="selectTarget('equip')"><span class="icon">🧰</span><span class="label">معدات</span></div>
            </div>

            <div id="targetSelectionArea"></div>

            <label>نوع الإجراء</label>
            <select id="entryMasterType">${cachedMaster.map(m => `<option value="${m}">${m}</option>`).join("") || '<option>عام</option>'}</select>

            <label>الوصف (مع إمكانية الكتابة بالصوت)</label>
            <div class="input-with-btn">
                <textarea id="entryDesc" rows="3" placeholder="اكتب التفاصيل..."></textarea>
                <button class="mic-btn" id="micBtn" onclick="toggleVoice('entryDesc', this)">🎤</button>
            </div>

            ${isComplaint ? `
            <label>التوصيات والمقترحات</label>
            <textarea id="entryRecommendation" rows="2" placeholder="كيف يمكن حل هذه المشكلة؟"></textarea>
            ` : ''}

            <div class="modal-actions">
                <button class="btn ${isComplaint ? 'danger' : 'success'}" onclick="submitEntry('${type}')">💾 حفظ</button>
                <button class="btn secondary" onclick="closeModal()">إغلاق</button>
            </div>
        `;
        document.getElementById("modalOverlay").classList.add("show");
        selectTarget('paramedic');
    }

    let currentTargetType = 'paramedic';
    function selectTarget(targetType) {
        currentTargetType = targetType;
        ['paramedic', 'center', 'vehicle', 'stock', 'equip'].forEach(t => document.getElementById('icon-' + t).classList.remove('active'));
        document.getElementById('icon-' + targetType).classList.add('active');

        let html = "";
        if (targetType === 'paramedic') {
            html = `
            <label>🏥 اختر المركز أولاً</label>
            <select id="entryCenter" onchange="updateParamedicDropdown(this.value)">
                <option value="">-- اختر المركز --</option>
                <option>مركز إسعاف دارسيت</option><option>مركز إسعاف بوشر</option>
                <option>مركز إسعاف العامرات</option><option>مركز إسعاف قريات</option>
            </select>
            <label>👨‍🚒 اختر المسعف</label>
            <select id="entryTargetName"><option value="">-- اختر المركز أولاً --</option></select>
            `;
        } else if (targetType === 'center') {
            html = `
            <label>اختر المركز</label>
            <select id="entryTargetName"><option>مركز إسعاف دارسيت</option><option>مركز إسعاف بوشر</option><option>مركز إسعاف العامرات</option><option>مركز إسعاف قريات</option></select>
            <label>تقييم المركز</label>
            <select id="centerRating"><option>ممتاز</option><option>جيد جداً</option><option>جيد</option><option>يحتاج تحسين</option></select>
            `;
        } else if (targetType === 'vehicle') {
            html = `
            <label>اختر المركبة</label>
            <select id="entryTargetName">${cachedVehicles.map(v => `<option value="${v.plateNumber}">${v.plateNumber}</option>`).join("") || '<option>لا يوجد</option>'}</select>
            <label>حالة المركبة</label>
            <select id="vehStatus"><option>تعمل بشكل جيد</option><option>تحتاج صيانة</option><option>معطلة</option></select>
            `;
        } else if (targetType === 'stock') {
            html = `
            <label>اختر المخزن</label>
            <select id="entryTargetName"><option>المخزن الطبي الرئيسي</option></select>
            <label>حالة المخزن</label>
            <select id="stockStatus"><option>مخزون كافٍ</option><option>نقص في الأدوية</option><option>نقص في الأكسجين</option><option>مخزون منتهي الصلاحية</option></select>
            `;
        } else {
            html = `
            <label>اختر المعدة</label>
            <select id="entryTargetName"><option>جهاز تنفس</option><option>جهاز صدمات</option><option>نقالة</option></select>
            <label>حالة المعدة</label>
            <select id="equipStatus"><option>تعمل</option><option>معطلة</option><option>تحتاج صيانة</option></select>
            `;
        }
        document.getElementById("targetSelectionArea").innerHTML = html;
    }

    function updateParamedicDropdown(centerName) {
        const select = document.getElementById("entryTargetName");
        if (!centerName) { select.innerHTML = '<option value="">-- اختر المركز أولاً --</option>'; return; }
        const filtered = cachedParamedics.filter(p => p.centerName === centerName);
        select.innerHTML = filtered.map(p => `<option value="${p.name}">${p.name} (${p.rank})</option>`).join("") || '<option>لا يوجد مسعفون</option>';
    }

    // 3. الزيارات
    function startVisit() {
        document.getElementById("modalTitle").innerText = "📋 تسجيل زيارة مركز";
        document.getElementById("modalBody").innerHTML = `
            <label>المركز الذي تمت زيارته</label>
            <select id="visitCenter">
                <option>مركز إسعاف دارسيت</option><option>مركز إسعاف بوشر</option>
                <option>مركز إسعاف العامرات</option><option>مركز إسعاف قريات</option>
            </select>
            
            <label>ملاحظات الزيارة (كتابي أو صوتي)</label>
            <div class="input-with-btn">
                <textarea id="visitNotes" rows="4" placeholder="اكتب ملاحظاتك الميدانية هنا..."></textarea>
                <button class="mic-btn" onclick="toggleVoice('visitNotes', this)">🎤</button>
            </div>

            <div class="modal-actions">
                <button class="btn success" onclick="submitVisit()">💾 حفظ</button>
                <button class="btn secondary" onclick="closeModal()">إغلاق</button>
            </div>
        `;
        document.getElementById("modalOverlay").classList.add("show");
    }

    // 4. حفظ البيانات
    function submitEntry(type) {
        const targetName = document.getElementById("entryTargetName").value;
        const desc = document.getElementById("entryDesc").value.trim();
        const recommendation = document.getElementById("entryRecommendation") ? document.getElementById("entryRecommendation").value.trim() : "";
        const masterType = document.getElementById("entryMasterType").value;
        const center = document.getElementById("entryCenter") ? document.getElementById("entryCenter").value : "";

        if (!targetName) return showToast("اختر الهدف", "danger");
        if (!desc) return showToast("الوصف مطلوب", "danger");

        db.collection("issues").add({
            type: type, isPraise: type === 'praise',
            targetType: currentTargetType, targetName: targetName, centerName: center,
            issueType: type === 'complaint' ? masterType : null,
            praiseType: type === 'praise' ? masterType : null,
            description: desc, recommendation: recommendation,
            supervisor: user.name, sector: user.sector, status: 'new', timestamp: new Date(),
            location: currentLocation.lat ? new firebase.firestore.GeoPoint(currentLocation.lat, currentLocation.lng) : null
        }).then(() => {
            showToast("تم الحفظ بنجاح"); closeModal(); loadData();
        }).catch(err => showToast("خطأ: " + err.message, "danger"));
    }

    function submitVisit() {
        const center = document.getElementById("visitCenter").value;
        const notes = document.getElementById("visitNotes").value.trim();
        if (!notes) return showToast("الملاحظات مطلوبة", "danger");

        db.collection("issues").add({
            type: 'visit', isPraise: false, centerName: center, description: notes,
            supervisor: user.name, sector: user.sector, status: 'new', timestamp: new Date(),
            location: currentLocation.lat ? new firebase.firestore.GeoPoint(currentLocation.lat, currentLocation.lng) : null
        }).then(() => {
            showToast("تم حفظ الزيارة بنجاح"); closeModal(); loadData();
        }).catch(err => showToast("خطأ: " + err.message, "danger"));
    }

    // 5. الورديات
    function openShiftHandover() {
        document.getElementById("modalTitle").innerText = "🔄 استلام / تسليم الدوام";
        document.getElementById("modalBody").innerHTML = `
            <div style="background:rgba(151,141,91,0.15); padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid var(--gold);">
                <p style="font-size:13px; line-height:1.6;">أنت الآن تستلم الدوام. يرجى كتابة ملاحظاتك للمشرف القادم (نقص أدوية، حالة المركبات، أحداث هامة).</p>
            </div>
            <label>ملاحظات التسليم</label>
            <div class="input-with-btn">
                <textarea id="handoverNotes" rows="4" placeholder="المركز جاهز، يوجد نقص في..."></textarea>
                <button class="mic-btn" onclick="toggleVoice('handoverNotes', this)">🎤</button>
            </div>
            <div class="modal-actions">
                <button class="btn warning" onclick="submitHandover()">✅ تأكيد الاستلام</button>
                <button class="btn secondary" onclick="closeModal()">إغلاق</button>
            </div>
        `;
        document.getElementById("modalOverlay").classList.add("show");
    }

    function submitHandover() {
        const notes = document.getElementById("handoverNotes").value.trim();
        if (!notes) return showToast("أدخل ملاحظات التسليم", "danger");

        db.collection("handovers").add({
            supervisor: user.name, sector: user.sector, notes: notes, timestamp: new Date()
        }).then(() => {
            showToast("تم تسجيل الدوام بنجاح"); closeModal(); 
        }).catch(err => showToast("خطأ: " + err.message, "danger"));
    }

    // 6. الصوت
    let isListening = false;
    function toggleVoice(targetId, btn) {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            return showToast("متصفحك لا يدعم الكتابة بالصوت", "danger");
        }
        if (isListening) { isListening = false; btn.classList.remove("recording"); btn.innerText = "🎤"; return; }
        
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ar-OM';
        recognition.continuous = true;
        recognition.onstart = () => { isListening = true; btn.classList.add("recording"); btn.innerText = "🔴"; };
        recognition.onresult = (event) => {
            let finalText = "";
            for(let i = event.resultIndex; i < event.results.length; ++i) {
                if(event.results[i].isFinal) finalText += event.results[i][0].transcript;
            }
            if(finalText) document.getElementById(targetId).value += " " + finalText;
        };
        recognition.onerror = () => { showToast("لم يتم التعرف على الصوت", "danger"); isListening = false; btn.classList.remove("recording"); btn.innerText = "🎤"; };
        recognition.onend = () => { isListening = false; btn.classList.remove("recording"); btn.innerText = "🎤"; };
        recognition.start();
    }

    // 7. الدردشة
    function loadChat() {
        db.collection("messages").orderBy("timestamp", "asc").limitToLast(50).onSnapshot(snap => {
            let html = "";
            snap.forEach(doc => {
                const m = doc.data();
                const isMine = m.sender === user.name;
                const time = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString('ar-OM') : '';
                html += `<div class="message ${isMine ? 'mine' : 'theirs'}"><div>${m.text}</div><span class="time">${isMine ? 'أنا' : m.sender} • ${time}</span></div>`;
            });
            const el = document.getElementById("chatMessages");
            if(el) { el.innerHTML = html; el.scrollTop = el.scrollHeight; }
        });
    }

    function sendMessage() {
        const input = document.getElementById("chatInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        db.collection("messages").add({ sender: user.name, text: text, timestamp: new Date() });
    }

    // أدوات
    function closeModal() { document.getElementById("modalOverlay").classList.remove("show"); }
    function logout() { localStorage.removeItem("ems_session"); window.location.href = "./index.html"; }
    function toggleSOS() { if(confirm("🚨 هل أنت في خطر وتحتاج مساعدة فورية؟ سيتم إرسال تنبيه لغرفة العمليات.")) { showToast("تم إرسال نداء الاستغاثة!", "danger"); } }

    loadData();
</script>
