<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لوحة المشرف الميداني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    body { margin:0; padding:20px; background:#041814; color:#fff; font-family:'Cairo', sans-serif; }
    .card { background:rgba(13,74,66,0.6); border:1px solid #978d5b; padding:20px; border-radius:15px; margin-bottom:15px; }
    h1 { color:#d4c896; text-align:center; }
    .btn { background:linear-gradient(135deg, #978d5b, #d4c896); color:#041814; padding:15px; border:none; border-radius:8px; font-weight:900; width:100%; margin-bottom:10px; cursor:pointer; font-family:'Cairo'; font-size:16px; }
    .btn-danger { background:linear-gradient(135deg, #e53935, #ff5252); color:#fff; }
    .btn-success { background:linear-gradient(135deg, #43a047, #69f0ae); color:#041814; }
    input, select, textarea { width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #978d5b; background:#041814; color:#fff; font-family:'Cairo'; box-sizing:border-box; }
    #loading { position:fixed; inset:0; background:#041814; display:flex; align-items:center; justify-content:center; font-size:18px; color:#d4c896; font-weight:bold; z-index:9999; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); padding:20px; z-index:1000; overflow-y:auto; }
    .modal-content { background:#0d4a42; padding:20px; border-radius:15px; margin-top:50px; border:1px solid #978d5b; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loading">جاري تحميل لوحة المشرف...</div>

<div id="content" style="display:none;">
    <h1>🚑 المشرف الميداني</h1>
    
    <div class="card">
        <h3 style="margin-top:0; color:#d4c896;">مرحباً، <span id="supName">...</span></h3>
        <p style="font-size:12px; color:#ccc;">القطاع: <span id="supSector">...</span></p>
    </div>

    <button class="btn btn-danger" onclick="openForm('complaint')">🚩 تسجيل إشكالية</button>
    <button class="btn btn-success" onclick="openForm('praise')">⭐ تسجيل إشادة</button>
    <button class="btn btn-danger" style="background:#555; color:#fff; margin-top:20px;" onclick="logout()">🚪 تسجيل الخروج</button>
</div>

<!-- نافذة تسجيل الإشكالية/الإشادة -->
<div class="modal" id="entryModal">
    <div class="modal-content">
        <h3 id="modalTitle">تسجيل</h3>
        <label>المركز</label>
        <select id="entryCenter">
            <option>مركز إسعاف دارسيت</option>
            <option>مركز إسعاف بوشر</option>
            <option>مركز إسعاف العامرات</option>
            <option>مركز إسعاف قريات</option>
        </select>
        <label>اسم الهدف (المسعف/المركبة)</label>
        <input type="text" id="entryTarget">
        <label>الوصف</label>
        <textarea id="entryDesc" rows="3"></textarea>
        <button class="btn" onclick="submitEntry()">💾 حفظ</button>
        <button class="btn" style="background:#555; color:#fff;" onclick="closeForm()">إلغاء</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyC3m9o6Qx7m6r1b08DZIkyttArIihZL8n8",
      authDomain: "ems-supervisor.firebaseapp.com",
      projectId: "ems-supervisor",
      storageBucket: "ems-supervisor.firebasestorage.app",
      messagingSenderId: "230655268524",
      appId: "1:230655268524:web:5043a458af3d79989ff109"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // التحقق من الجلسة
    const session = localStorage.getItem("ems_session");
    if (!session) { window.location.href = "./index.html"; }
    
    const user = JSON.parse(session);
    if (user.type === "admin") { window.location.href = "./admin.html"; }

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    document.getElementById("supName").innerText = user.name;
    document.getElementById("supSector").innerText = user.sector || "غير محدد";

    let currentEntryType = "";

    function openForm(type) {
        currentEntryType = type;
        document.getElementById("modalTitle").innerText = type === 'complaint' ? "🚩 تسجيل إشكالية" : "⭐ تسجيل إشادة";
        document.getElementById("entryModal").style.display = "block";
    }

    function closeForm() {
        document.getElementById("entryModal").style.display = "none";
    }

    function submitEntry() {
        const center = document.getElementById("entryCenter").value;
        const target = document.getElementById("entryTarget").value.trim();
        const desc = document.getElementById("entryDesc").value.trim();

        if (!target || !desc) return alert("أكمل البيانات");

        db.collection("issues").add({
            centerName: center,
            targetName: target,
            issueType: currentEntryType === 'complaint' ? 'إشكالية عامة' : null,
            praiseType: currentEntryType === 'praise' ? 'إشادة عامة' : null,
            description: desc,
            supervisor: user.name,
            sector: user.sector,
            isPraise: currentEntryType === 'praise',
            status: 'new',
            timestamp: new Date()
        }).then(() => {
            alert("✅ تم الحفظ بنجاح");
            document.getElementById("entryTarget").value = "";
            document.getElementById("entryDesc").value = "";
            closeForm();
        }).catch(err => alert("خطأ: " + err.message));
    }

    function logout() {
        localStorage.removeItem("ems_session");
        window.location.href = "./index.html";
    }
</script>
</body>
</html>
