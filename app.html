<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المشرف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
    body { background:#041814; color:#fff; min-height:100vh; }
    .topbar { background:#0d4a42; padding:15px; display:flex; justify-content:space-between; border-bottom:2px solid #c9a227; }
    .btn { background:#e53935; color:#fff; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; }
    .content { padding:20px; text-align:center; }
</style>
</head>
<body>
<div class="topbar">
    <h3 id="nameDisplay">جاري التحميل...</h3>
    <button class="btn" onclick="logout()">خروج</button>
</div>
<div class="content">
    <h2 style="color:#c9a227; margin-top:50px;">👨‍💼 لوحة المشرف الميداني</h2>
    <p style="margin-top:20px;">مرحباً بك. (هنا سيتم بناء واجهة الإشكاليات والزيارات)</p>
</div>
<script>
    const sessionStr = localStorage.getItem("amb_session");
    
    if (!sessionStr) {
        window.location.href = "index.html"; 
    } else {
        const user = JSON.parse(sessionStr);
        if (user.type !== "supervisor") window.location.href = "index.html";
        else document.getElementById("nameDisplay").innerText = user.name;
    }

    function logout() { localStorage.removeItem("amb_session"); window.location.href = "index.html"; }
</script>
</body>
</html>
