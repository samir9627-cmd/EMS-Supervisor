<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041814">
<title>لوحة المشرف الميداني — v60.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal',sans-serif; }

:root {
  --gold:#978d5b; --gold-light:#d4c896; --teal:#0d4a42; --teal-dark:#082b26; --teal-deep:#041814;
  --green:#43a047; --green-light:#69f0ae; --red:#e53935; --red-light:#ff5252;
  --amber:#fb8c00; --blue:#29b6f6; --surface:rgba(13,74,66,0.55); --border:rgba(151,141,91,0.3);
  --safe-top:env(safe-area-inset-top, 0px); --safe-bottom:env(safe-area-inset-bottom, 0px);
}

html, body { background: var(--teal-deep); color: #fff; font-weight: 600; overflow-x: hidden; }
body { min-height: 100vh; padding-bottom: calc(100px + var(--safe-bottom)); }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), radial-gradient(circle at 85% 90%, rgba(13,74,66,0.6) 0%, transparent 50%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }

@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }

#mainApp { display: none; }
#mainApp.ready { display: block; }

/* الشريط العلوي */
.topbar { position: sticky; top: 0; z-index: 100; padding: calc(12px + var(--safe-top)) 16px 12px; background: linear-gradient(135deg, rgba(4,24,20,0.98), rgba(13,74,66,0.95)); border-bottom: 2px solid var(--gold); display: flex; align-items: center; gap: 8px; }
.topbar-logo { width: 44px; height: 44px; border-radius: 12px; object-fit: contain; }
.topbar-info { flex: 1; }
.topbar-info h1 { font-size: 14px; color: var(--gold-light); font-weight: 900; }
.topbar-info p { font-size: 10px; color: rgba(255,255,255,0.7); display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-light); box-shadow: 0 0 8px var(--green-light); }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: #fff; font-size: 17px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.icon-btn.danger { background: rgba(198,40,40,0.4); border-color: var(--red-light); }

/* التبويبات السفلية */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: linear-gradient(180deg, rgba(13,74,66,0.98), rgba(4,24,20,0.98)); border-top: 2px solid var(--gold); padding: 8px 4px calc(8px + var(--safe-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px; cursor: pointer; background: transparent; border: none; color: rgba(255,255,255,0.65); font-family: inherit; font-weight: 700; font-size: 9px; }
.nav-btn .nav-icon { font-size: 20px; line-height: 1; }
.nav-btn.active { background: linear-gradient(135deg, rgba(151,141,91,0.3), rgba(151,141,91,0.1)); color: var(--gold-light); }

/* الصفحات */
.page { display: none; padding: 16px; max-width: 720px; margin: 0 auto; }
.page.active { display: block; animation: slideUp 0.35s; }
.card { background: rgba(13,74,66,0.55); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
.card-title { font-size: 14px; color: var(--gold-light); font-weight: 900; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

/* الأزرار الرئيسية */
.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.action-btn { padding: 20px 14px; border-radius: 18px; border: none; font-family: inherit; font-weight: 900; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; }
.action-btn.danger { background: linear-gradient(135deg, #e53935, #ff5252); }
.action-btn.success { background: linear-gradient(135deg, #43a047, #69f0ae); color: #041814; }
.action-btn.info { background: linear-gradient(135deg, #29b6f6, #64b5f6); color: #fff; }

/* البطاقات */
.item-card { background: rgba(4,24,20,0.8); border: 1px solid var(--border); border-right: 4px solid var(--gold); border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.item-card.red { border-right-color: var(--red); }
.item-card.green { border-right-color: var(--green-light); }
.item-card.blue { border-right-color: var(--blue); }
.item-info { flex: 1; min-width: 0; }
.item-info h4 { font-size: 14px; font-weight: 900; color: var(--gold-light); margin-bottom: 4px; }
.item-info p { font-size: 11px; color: rgba(255,255,255,0.65); line-height: 1.6; }

/* المدخلات */
input, select, textarea { width: 100%; padding: 12px 14px; background: rgba(4,24,20,0.7); border: 1px solid var(--border); border-radius: 11px; color: #fff; font-size: 13px; font-family: inherit; font-weight: 600; outline: none; margin-bottom: 12px; }
input:focus, select:focus, textarea:focus { border-color: var(--gold); }
select option { background: var(--teal-deep); color: #fff; }
label { display: block; font-size: 12px; color: rgba(255,255,255,0.85); font-weight: 700; margin-bottom: 7px; }

/* الأزرار */
.btn { padding: 12px 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--teal-deep); font-size: 13px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.danger { background: linear-gradient(135deg, var(--red), var(--red-light)); color: #fff; }
.btn.success { background: linear-gradient(135deg, var(--green), var(--green-light)); color: #041814; }
.btn.block { width: 100%; }

/* النوافذ المنبثقة */
.modal-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.85); display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-sheet { background: linear-gradient(145deg, var(--teal), var(--teal-dark)); border-top-left-radius: 26px; border-top-right-radius: 26px; border-top: 3px solid var(--gold); width: 100%; max-width: 720px; max-height: 92vh; padding: 24px 18px calc(24px + var(--safe-bottom)); overflow-y: auto; }
.modal-sheet h3 { color: var(--gold-light); font-size: 17px; font-weight: 900; text-align: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }

/* التنبيهات */
.toast-container { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); z-index: 3000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: calc(100% - 32px); max-width: 420px; }
.toast { background: linear-gradient(135deg, var(--teal), var(--teal-dark)); color: #fff; padding: 12px 18px; border-radius: 12px; border: 1px solid var(--gold); font-size: 13px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
.toast.success { border-color: var(--green-light); }
.toast.danger { border-color: var(--red-light); }

/* الدردشة */
.chat-container { display: flex; flex-direction: column; height: 55vh; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
.message.mine { align-self: flex-end; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--teal-deep); border-bottom-left-radius: 2px; }
.message.theirs { align-self: flex-start; background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-bottom-right-radius: 2px; }
.message .time { font-size: 9px; opacity: 0.6; margin-top: 4px; display: block; text-align: left; }
.chat-input-box { display: flex; padding: 10px; background: rgba(4,24,20,0.6); border-top: 1px solid var(--border); }
.chat-input-box input { flex: 1; margin: 0; border-radius: 8px 0 0 8px; border-left: none; }
.chat-input-box button { padding: 0 20px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--teal-deep); border: none; border-radius: 0 8px 8px 0; font-weight: 900; cursor: pointer; }

#loadingOverlay { position:fixed; inset:0; z-index:9999; background:var(--teal-deep); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.spinner { width:40px; height:40px; border:4px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 1s linear infinite; margin-bottom:16px; }
</style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="color:var(--gold-light); font-weight:900;">جاري التحقق من الكود...</div>
</div>

<div id="mainApp">
  <div class="topbar">
    <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="topbar-logo" onerror="this.src='IMG_2828.png'">
    <div class="topbar-info">
      <h1>لوحة المشرف الميداني</h1>
      <p><span class="status-dot"></span><span id="currentUser">—</span></p>
    </div>
    <button class="icon-btn" onclick="manualRefresh()">🔄</button>
    <button class="icon-btn danger" onclick="confirmLogout()">🚪</button>
  </div>

  <!-- 1) الرئيسية -->
  <div class="page active" id="page-home">
    <div class="card" style="background:linear-gradient(135deg, rgba(151,141,91,0.15), rgba(13,74,66,0.6)); border-color:var(--gold);">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-size:12px; color:rgba(255,255,255,0.7);">مرحباً بك 👋</div>
          <div style="font-size:20px; color:#fff; font-weight:900;" id="welcomeName">—</div>
          <div style="font-size:12px; color:var(--gold-light); margin-top:4px;" id="welcomeSector">—</div>
        </div>
        <div style="width:50px; height:50px; border-radius:50%; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900;" id="heroAvatar">👤</div>
      </div>
    </div>

    <div class="quick-actions">
      <button class="action-btn danger" onclick="startEntry('complaint')">
        <span style="font-size:32px;">🚩</span>
        <span>تسجيل إشكالية</span>
      </button>
      <button class="action-btn success" onclick="startEntry('praise')">
        <span style="font-size:32px;">⭐</span>
        <span>تسجيل إشادة</span>
      </button>
      <button class="action-btn info" onclick="startVisit()" style="grid-column: span 2;">
        <span style="font-size:32px;">📋</span>
        <span>تسجيل زيارة مركز</span>
      </button>
    </div>

    <div class="card">
      <div class="card-title">📢 التعاميم الأخيرة</div>
      <div id="broadcastsList">جاري التحميل...</div>
    </div>
  </div>

  <!-- 2) السجلات -->
  <div class="page" id="page-issues">
    <div class="card"><div class="card-title">🚩 سجلاتي</div><div id="issuesList">جاري التحميل...</div></div>
  </div>
  
  <!-- 3) الزيارات -->
  <div class="page" id="page-visits">
    <div class="card"><div class="card-title">📋 سجل زيارات القطاع</div><div id="visitsList">جاري التحميل...</div></div>
  </div>

  <!-- 4) الدوام -->
  <div class="page" id="page-duty">
    <div class="card"><div class="card-title">📅 حالة الدوام اليوم</div><div id="dutyList">جاري التحميل...</div></div>
  </div>

  <!-- 5) المراسلة -->
  <div class="page" id="page-chat">
    <div class="card">
      <div class="card-title">💬 مراسلة الإدارة</div>
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-box">
          <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key === 'Enter') sendMessage()">
          <button onclick="sendMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" data-page="home" onclick="switchPage('home')"><span class="nav-icon">🏠</span><span>الرئيسية</span></button>
    <button class="nav-btn" data-page="issues" onclick="switchPage('issues')"><span class="nav-icon">🚩</span><span>سجلاتي</span></button>
    <button class="nav-btn" data-page="visits" onclick="switchPage('visits')"><span class="nav-icon">📋</span><span>الزيارات</span></button>
    <button class="nav-btn" data-page="duty" onclick="switchPage('duty')"><span class="nav-icon">📅</span><span>الدوام</span></button>
    <button class="nav-btn" data-page="chat" onclick="switchPage('chat')"><span class="nav-icon">💬</span><span>تواصل</span></button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet"><h3 id="modalTitle">تفاصيل</h3><div id="modalBody"></div></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
    import { checkAuthState, logoutUser } from './shared/auth.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3m9o6Qx7m6r1b08DZIkyttArIihZL8n8",
      authDomain: "ems-supervisor.firebaseapp.com",
      projectId: "ems-supervisor",
      storageBucket: "ems-supervisor.firebasestorage.app",
      messagingSenderId: "230655268524",
      appId: "1:230655268524:web:5043a458af3d79989ff109"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    let supervisorData = null;
    let masterData = {};
    let allIssues = [], myIssues = [];
    let allVisits = [], sectorVisits = [];
    let allMessages = [], myMessages = [];

    const MASTER_KEYS = ["issue_types_paramedic", "issue_types_center", "issue_types_vehicle", "issue_types_stock", "praise_types_paramedic", "praise_types_center", "praise_types_vehicle", "praise_types_stock"];

    function esc(s) { if (s === null || s === undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
    function showToast(msg, type="success") { const c = document.getElementById("toastContainer"); const t = document.createElement("div"); t.className = "toast " + type; t.textContent = (type==="success" ? "✅ " : "⚠️ ") + msg; c.appendChild(t); setTimeout(() => t.remove(), 3000); }
    function cleanCenter(n) { return (n || "").toString().replace("مركز إسعاف ", "").trim(); }
    function timeAgo(ts) { if (!ts) return "—"; const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000); if (diff < 60) return "الآن"; if (diff < 3600) return `قبل ${Math.floor(diff/60)}د`; if (diff < 86400) return `قبل ${Math.floor(diff/3600)}س`; return `قبل ${Math.floor(diff/86400)}ي`; }

    async function fsList(colName) {
        const snapshot = await getDocs(collection(db, colName));
        return snapshot.docs.map(d => ({ _id: d.id, ...d.data() }));
    }

    // 1. التحقق من الصلاحيات وجلب بيانات المشرف
    checkAuthState(async (code, user) => {
        if (!code || code.startsWith("ADM") || code.startsWith("OPS")) {
            // إذا لم يكن مشرفاً، أو كان مديراً/عمليات، اطرده
            await logoutUser();
            window.location.href = "index.html";
            return;
        }

        currentUser = { code, email: user.email };
        
        // جلب بيانات المشرف من Firestore
        const snapshot = await getDocs(query(collection(db, "access_code"), where("code", "==", code)));
        if (snapshot.empty) {
            showToast("لم يتم العثور على بيانات الكود", "danger");
            setTimeout(() => { logoutUser(); window.location.href = "index.html"; }, 2000);
            return;
        }

        supervisorData = { _id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
        
        // عرض البيانات في الواجهة
        document.getElementById("currentUser").textContent = supervisorData.name;
        document.getElementById("welcomeName").textContent = supervisorData.name;
        document.getElementById("heroAvatar").textContent = (supervisorData.name || "م").charAt(0);
        document.getElementById("welcomeSector").textContent = supervisorData.sector || "قطاع غير محدد";

        document.getElementById("loadingOverlay").style.display = "none";
        document.getElementById("mainApp").classList.add("ready");

        // جلب البيانات الأساسية (Master Data)
        for (let col of MASTER_KEYS) {
            const data = await fsList(col).catch(() => []);
            masterData[col] = data.map(d => d.name); // نحتاج الأسماء فقط
        }

        syncData();
        setInterval(syncData, 30000);
    });

    // 2. جلب البيانات الدورية
    async function syncData() {
        try {
            const [issues, visits, msgs] = await Promise.all([
                fsList("issues").catch(() => []), 
                fsList("visits").catch(() => []), 
                fsList("messages").catch(() => [])
            ]);
            allIssues = issues; myIssues = allIssues.filter(i => i.supervisor === supervisorData.name);
            allVisits = visits; sectorVisits = allVisits.filter(v => v.sector === supervisorData.sector);
            allMessages = msgs; myMessages = allMessages.filter(m => m.supervisor === supervisorData.name);
            renderAll();
        } catch(e) { console.warn(e); }
    }

    function renderAll() {
        const elIssues = document.getElementById("issuesList");
        if (elIssues) elIssues.innerHTML = myIssues.map(i => `<div class="item-card ${i.isPraise ? 'green' : 'red'}"><div class="item-info"><h4>${esc(i.issueType||i.praiseType)}</h4><p>🎯 ${esc(i.targetName)}</p></div></div>`).join("") || '<div style="text-align:center; opacity:0.5; padding:20px;">لا سجلات</div>';

        const elVisits = document.getElementById("visitsList");
        if (elVisits) elVisits.innerHTML = sectorVisits.map(v => `<div class="item-card blue"><div class="item-info"><h4>🏥 ${esc(cleanCenter(v.centerName))}</h4><p>👤 ${esc(v.supervisor)} • ${esc(v.evaluation)}</p></div></div>`).join("") || '<div style="text-align:center; opacity:0.5; padding:20px;">لا زيارات</div>';

        const elChat = document.getElementById("chatMessages");
        if (elChat) {
            elChat.innerHTML = myMessages.map(m => { const isMine = m.sender === supervisorData.name; return `<div class="message ${isMine ? 'mine' : 'theirs'}"><div>${esc(m.text)}</div><span class="time">${timeAgo(m.timestamp)}</span></div>`; }).join("");
            elChat.scrollTop = elChat.scrollHeight;
        }
    }

    window.switchPage = function(id) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.getElementById("page-" + id).classList.add("active");
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        document.querySelector(`.nav-btn[data-page="${id}"]`).classList.add("active");
        window.scrollTo({top:0,behavior:"smooth"});
    };

    // 3. الإشكالات والإشادات
    window.startEntry = async function(type) {
        const params = await fsList("paramedics").catch(() => []);
        // القطاع يحتوي على 4 مراكز (في المثال نضع قائمة تجريبية، لاحقاً ستُجلب من الإعدادات)
        const centers = ["مركز إسعاف دارسيت", "مركز إسعاف بوشر", "مركز إسعاف العامرات", "مركز إسعاف قريات"]; 
        
        openModal(type === 'complaint' ? "🚩 تسجيل إشكالية" : "⭐ تسجيل إشادة", `
            <label>🏥 المركز</label>
            <select id="entryCenter" onchange="updateTargets('${type}', ${JSON.stringify(params).replace(/"/g, '&quot;')})">${centers.map(c => `<option>${esc(c)}</option>`).join("")}</select>
            <label>🎯 نوع الهدف</label>
            <select id="entryTargetType" onchange="updateTargets('${type}', ${JSON.stringify(params).replace(/"/g, '&quot;')})"><option value="paramedic">👨‍🚒 مسعف</option><option value="center">🏥 مركز</option><option value="vehicle">🚑 مركبة</option><option value="stock">💊 مخزن</option></select>
            <label>👤 اسم الهدف</label><select id="entryTargetName"></select>
            <label>📌 النوع</label><select id="entryType"></select>
            <label>📝 الوصف</label><textarea id="entryDesc" rows="3"></textarea>
            <button class="btn ${type==='complaint'?'danger':'success'} block" onclick="submitEntry('${type}')">💾 حفظ</button>
        `);
        setTimeout(() => updateTargets(type, params), 100);
    };

    window.updateTargets = function(type, params) {
        const centerVal = document.getElementById("entryCenter").value;
        const targetType = document.getElementById("entryTargetType").value;
        const nameSelect = document.getElementById("entryTargetName");
        const typeSelect = document.getElementById("entryType");
        
        if (targetType === "paramedic") {
            const filtered = params.filter(p => cleanCenter(p.centerName) === cleanCenter(centerVal));
            nameSelect.innerHTML = filtered.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("") || '<option>لا يوجد مسعفون</option>';
        } else if (targetType === "center") {
            nameSelect.innerHTML = `<option value="${esc(centerVal)}">${esc(cleanCenter(centerVal))}</option>`;
        } else {
            nameSelect.innerHTML = '<option>غير محدد</option>';
        }

        const masterKey = (type === 'complaint' ? 'issue_types_' : 'praise_types_') + targetType;
        const types = masterData[masterKey] || [];
        typeSelect.innerHTML = types.map(t => `<option>${esc(t)}</option>`).join("") || '<option>لا أنواع (أضف من الإدارة)</option>';
    };

    window.submitEntry = async function(type) {
        const center = document.getElementById("entryCenter").value;
        const targetType = document.getElementById("entryTargetType").value;
        const targetName = document.getElementById("entryTargetName").value;
        const entryType = document.getElementById("entryType").value;
        const desc = document.getElementById("entryDesc").value;
        if (!desc) return showToast("أدخل الوصف", "danger");

        await addDoc(collection(db, "issues"), {
            center, centerName: center, targetType, targetName,
            issueType: type === 'complaint' ? entryType : null, 
            praiseType: type === 'praise' ? entryType : null,
            description: desc, supervisor: supervisorData.name, sector: supervisorData.sector,
            isPraise: type === 'praise', status: type === 'praise' ? 'resolved' : 'new', 
            timestamp: new Date().toISOString()
        });
        showToast("تم الحفظ"); closeModal(); syncData();
    };

    // 4. الزيارات
    window.startVisit = function() {
        const centers = ["مركز إسعاف دارسيت", "مركز إسعاف بوشر", "مركز إسعاف العامرات", "مركز إسعاف قريات"]; 
        openModal("📋 تسجيل زيارة", `
            <label>🏥 المركز</label><select id="visitCenter">${centers.map(c => `<option>${esc(c)}</option>`).join("")}</select>
            <label>⭐ التقييم</label><select id="visitEval"><option>ممتاز</option><option>جيد</option><option>يحتاج تحسين</option></select>
            <label>📝 الملاحظات</label><textarea id="visitNotes" rows="3"></textarea>
            <button class="btn success block" onclick="submitVisit()">💾 حفظ</button>
        `);
    };

    window.submitVisit = async function() {
        const center = document.getElementById("visitCenter").value;
        const evalVal = document.getElementById("visitEval").value;
        const notes = document.getElementById("visitNotes").value;
        if (!notes) return showToast("أدخل الملاحظات", "danger");

        await addDoc(collection(db, "visits"), { center, centerName: center, evaluation: evalVal, notes, supervisor: supervisorData.name, sector: supervisorData.sector, timestamp: new Date().toISOString() });
        showToast("تم حفظ الزيارة"); closeModal(); syncData();
    };

    // 5. الدردشة
    window.sendMessage = async function() {
        const input = document.getElementById("chatInput"); const text = input.value.trim();
        if (!text) return; input.value = "";
        await addDoc(collection(db, "messages"), { supervisor: supervisorData.name, sender: supervisorData.name, text: text, timestamp: new Date().toISOString() });
        syncData();
    };

    // أدوات
    window.openModal = function(title, body) { document.getElementById("modalTitle").textContent = title; document.getElementById("modalBody").innerHTML = body; document.getElementById("modalOverlay").classList.add("show"); };
    window.closeModal = function() { document.getElementById("modalOverlay").classList.remove("show"); };
    window.manualRefresh = function() { showToast("تحديث..."); syncData(); };
    window.confirmLogout = async function() { if (confirm("خروج؟")) { await logoutUser(); window.location.href = "index.html"; } };
</script>
</body>
</html>
