<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041814">
<title>لوحة المشرف الميداني — v30.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal','Segoe UI',sans-serif; }

:root {
  --gold:#978d5b; --gold-light:#d4c896; --gold-bright:#e8dcaf;
  --teal:#0d4a42; --teal-dark:#082b26; --teal-deep:#041814;
  --green:#43a047; --green-light:#69f0ae;
  --red:#e53935; --red-light:#ff5252;
  --amber:#fb8c00; --amber-light:#ffa726;
  --blue:#29b6f6; --blue-light:#64b5f6;
  --purple:#ab47bc; --purple-light:#ce93d8;
  --surface:rgba(13,74,66,0.55);
  --border:rgba(151,141,91,0.3);
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}

html, body { background:var(--teal-deep); color:#fff; font-weight:600; overflow-x:hidden; overscroll-behavior-y:contain; }
body { min-height:100vh; padding-bottom:calc(100px + var(--safe-bottom)); }
body::before { content:''; position:fixed; inset:0; z-index:-1; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), radial-gradient(circle at 85% 90%, rgba(13,74,66,0.6) 0%, transparent 50%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }

@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }

#mainApp { display:none; }
#mainApp.ready { display:block; }

/* الشريط العلوي */
.topbar { position:sticky; top:0; z-index:100; padding:calc(12px + var(--safe-top)) 16px 12px; background:linear-gradient(135deg, rgba(4,24,20,0.98), rgba(13,74,66,0.95)); border-bottom:2px solid var(--gold); display:flex; align-items:center; gap:8px; }
.topbar-logo { width:44px; height:44px; border-radius:12px; object-fit:contain; background:transparent; }
.topbar-info { flex:1; }
.topbar-info h1 { font-size:14px; color:var(--gold-light); font-weight:900; }
.topbar-info p { font-size:10px; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:6px; margin-top:3px; }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--green-light); box-shadow:0 0 8px var(--green-light); }
.icon-btn { width:42px; height:42px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.icon-btn.danger { background:rgba(198,40,40,0.4); border-color:var(--red-light); }

/* التبويبات السفلية */
.bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:200; background:linear-gradient(180deg, rgba(13,74,66,0.98), rgba(4,24,20,0.98)); border-top:2px solid var(--gold); padding:8px 4px calc(8px + var(--safe-bottom)); display:grid; grid-template-columns:repeat(5, 1fr); gap:2px; }
.nav-btn { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:10px; cursor:pointer; background:transparent; border:none; color:rgba(255,255,255,0.65); font-family:inherit; font-weight:700; font-size:9px; }
.nav-btn .nav-icon { font-size:20px; line-height:1; }
.nav-btn.active { background:linear-gradient(135deg, rgba(151,141,91,0.3), rgba(151,141,91,0.1)); color:var(--gold-light); }
.nav-btn .badge { position:absolute; top:0; right:4px; background:var(--red); width:8px; height:8px; border-radius:50%; display:none; }

/* الصفحات */
.page { display:none; padding:16px; max-width:720px; margin:0 auto; }
.page.active { display:block; animation:slideUp 0.35s; }
.card { background:linear-gradient(145deg, var(--surface), rgba(4,24,20,0.9)); border:1px solid var(--border); border-radius:18px; padding:16px; margin-bottom:14px; }
.card-title { font-size:14px; color:var(--gold-light); font-weight:900; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }

/* الإحصائيات */
.stats-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:14px; }
.stat-mini { background:rgba(4,24,20,0.75); border:1px solid var(--border); border-radius:16px; padding:16px 14px; text-align:center; }
.stat-mini .num { font-size:26px; font-weight:900; color:var(--gold-light); line-height:1; }
.stat-mini .lbl { font-size:11px; color:rgba(255,255,255,0.7); margin-top:5px; }

/* الأزرار الرئيسية */
.quick-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.action-btn { padding:20px 14px; border-radius:18px; border:none; font-family:inherit; font-weight:900; font-size:14px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; color:#fff; }
.action-btn.danger { background:linear-gradient(135deg, #e53935, #ff5252); }
.action-btn.success { background:linear-gradient(135deg, #43a047, #69f0ae); color:#041814; }

/* القوائم */
.item-card { background:rgba(4,24,20,0.8); border:1px solid var(--border); border-right:4px solid var(--gold); border-radius:14px; padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.item-card.red { border-right-color:var(--red); }
.item-card.green { border-right-color:var(--green-light); }
.item-card.blue { border-right-color:var(--blue); }
.item-info { flex:1; min-width:0; }
.item-info h4 { font-size:14px; font-weight:900; color:var(--gold-light); margin-bottom:4px; }
.item-info p { font-size:11px; color:rgba(255,255,255,0.65); line-height:1.6; }

/* المدخلات */
input, select, textarea { width:100%; padding:12px 14px; background:rgba(4,24,20,0.7); border:1px solid var(--border); border-radius:11px; color:#fff; font-size:13px; font-family:inherit; font-weight:600; outline:none; margin-bottom:12px; }
input:focus, textarea:focus, select:focus { border-color:var(--gold); }
select option { background:var(--teal-deep); color:#fff; }
label { display:block; font-size:12px; color:rgba(255,255,255,0.85); font-weight:700; margin-bottom:7px; }

.btn { padding:12px 16px; border:none; border-radius:12px; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); font-size:13px; font-weight:900; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn.danger { background:linear-gradient(135deg, var(--red), var(--red-light)); color:#fff; }
.btn.success { background:linear-gradient(135deg, var(--green), var(--green-light)); color:#041814; }
.btn.block { width:100%; }

.modal-overlay { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.85); display:none; align-items:flex-end; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-sheet { background:linear-gradient(145deg, var(--teal), var(--teal-dark)); border-top-left-radius:26px; border-top-right-radius:26px; border-top:3px solid var(--gold); width:100%; max-width:720px; max-height:92vh; padding:24px 18px calc(24px + var(--safe-bottom)); overflow-y:auto; animation:slideUp 0.35s; }
.modal-sheet h3 { color:var(--gold-light); font-size:17px; font-weight:900; text-align:center; padding-bottom:14px; border-bottom:1px solid var(--border); margin-bottom:18px; }

/* التنبيهات */
.toast-container { position:fixed; top:90px; left:50%; transform:translateX(-50%); z-index:3000; display:flex; flex-direction:column; gap:8px; pointer-events:none; width:calc(100% - 32px); max-width:420px; }
.toast { background:linear-gradient(135deg, var(--teal), var(--teal-dark)); color:#fff; padding:12px 18px; border-radius:12px; border:1px solid var(--gold); font-size:13px; font-weight:700; box-shadow:0 10px 30px rgba(0,0,0,0.6); }
.toast.success { border-color:var(--green-light); }
.toast.danger { border-color:var(--red-light); }

/* الدردشة */
.chat-container { display:flex; flex-direction:column; height:60vh; background:rgba(0,0,0,0.3); border-radius:14px; border:1px solid var(--border); overflow:hidden; }
.chat-messages { flex:1; padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.message { max-width:80%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.5; }
.message.mine { align-self:flex-end; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); border-bottom-left-radius:2px; }
.message.theirs { align-self:flex-start; background:rgba(255,255,255,0.1); border:1px solid var(--border); border-bottom-right-radius:2px; }
.message .time { font-size:9px; opacity:0.6; margin-top:4px; display:block; text-align:left; }
.chat-input-box { display:flex; padding:10px; background:rgba(4,24,20,0.6); border-top:1px solid var(--border); }
.chat-input-box input { flex:1; margin:0; border-radius:8px 0 0 8px; border-left:none; }
.chat-input-box button { padding:0 20px; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); border:none; border-radius:0 8px 8px 0; font-weight:900; cursor:pointer; }
</style>
</head>
<body>

<div id="mainApp">
  <div class="topbar">
    <img src="https://cdn.imagetourls.com/uploads/tyImg/XlLOezQJ.png" class="topbar-logo">
    <div class="topbar-info">
      <h1>لوحة المشرف الميداني</h1>
      <p><span class="status-dot"></span><span id="currentUser">—</span></p>
    </div>
    <button class="icon-btn" onclick="manualRefresh()">🔄</button>
    <button class="icon-btn danger" onclick="confirmLogout()">🚪</button>
  </div>

  <!-- 1) الرئيسية -->
  <div class="page active" id="page-home">
    <div class="card" style="background:linear-gradient(135deg, rgba(151,141,91,0.15), rgba(13,74,66,0.6)); border-color:var(--gold);">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-size:12px; color:rgba(255,255,255,0.7);">مرحباً بك 👋</div>
          <div style="font-size:20px; color:#fff; font-weight:900;" id="welcomeName">—</div>
          <div style="font-size:12px; color:var(--gold-light); margin-top:4px;" id="welcomeSector">—</div>
        </div>
        <div style="width:50px; height:50px; border-radius:50%; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900;" id="heroAvatar">👤</div>
      </div>
    </div>

    <div class="quick-actions">
      <button class="action-btn danger" onclick="startEntry('complaint')">
        <span style="font-size:32px;">🚩</span>
        <span>تسجيل إشكالية</span>
      </button>
      <button class="action-btn success" onclick="startEntry('praise')">
        <span style="font-size:32px;">⭐</span>
        <span>تسجيل إشادة</span>
      </button>
    </div>

    <div class="stats-grid">
      <div class="stat-mini" onclick="switchPage('issues')"><div class="num" id="statOpenIssues">0</div><div class="lbl">إشكالياتي المفتوحة</div></div>
      <div class="stat-mini" onclick="switchPage('issues')"><div class="num" id="statTotalIssues">0</div><div class="lbl">إجمالي سجلاتي</div></div>
    </div>

    <div class="card">
      <div class="card-title">📢 التعاميم الأخيرة</div>
      <div id="broadcastsList"></div>
    </div>
  </div>

  <!-- 2) الإشكالات -->
  <div class="page" id="page-issues">
    <div class="card">
      <div class="card-title">🚩 سجلاتي الميدانية <span id="issuesCount" style="margin-right:auto;background:var(--gold);color:var(--teal-deep);padding:2px 10px;border-radius:12px;font-size:11px;font-weight:900;">0</span></div>
      <div id="issuesList"></div>
    </div>
  </div>

  <!-- 3) التعاميم -->
  <div class="page" id="page-broadcasts">
    <div class="card">
      <div class="card-title">📢 التعاميم الموجهة إليك</div>
      <div id="broadcastsFullList"></div>
    </div>
  </div>

  <!-- 4) المراسلة -->
  <div class="page" id="page-chat">
    <div class="card" style="padding:0; overflow:hidden;">
      <div style="padding:14px 16px; border-bottom:1px solid var(--border); background:rgba(4,24,20,0.5); display:flex; align-items:center; gap:10px;">
        <span style="font-size:20px;">💬</span>
        <span style="font-weight:900; color:var(--gold-light); flex:1;">مراسلة الإدارة</span>
      </div>
      <div class="chat-container" style="border-radius:0; height:65vh; border:none;">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-box">
          <input type="text" id="chatInput" placeholder="اكتب رسالتك للإدارة..." onkeypress="if(event.key === 'Enter') sendMessage()">
          <button onclick="sendMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 5) حسابي -->
  <div class="page" id="page-profile">
    <div class="card" style="text-align:center;">
      <div style="font-size:50px; margin-bottom:10px;">👤</div>
      <div style="font-size:20px; color:var(--gold-light); font-weight:900;" id="profileName">—</div>
      <div style="font-size:12px; color:rgba(255,255,255,0.6); margin-top:4px;" id="profileSector">—</div>
      <div style="font-size:12px; color:rgba(255,255,255,0.6); margin-top:2px;" id="profileCode">—</div>
    </div>
    <button class="btn danger block" onclick="confirmLogout()">🚪 تسجيل الخروج</button>
  </div>

  <!-- شريط التنقل السفلي -->
  <div class="bottom-nav">
    <button class="nav-btn active" data-page="home" onclick="switchPage('home')"><span class="nav-icon">🏠</span><span>الرئيسية</span></button>
    <button class="nav-btn" data-page="issues" onclick="switchPage('issues')"><span class="nav-icon">🚩</span><span>سجلاتي</span></button>
    <button class="nav-btn" data-page="broadcasts" onclick="switchPage('broadcasts')"><span class="nav-icon">📢</span><span>التعاميم</span></button>
    <button class="nav-btn" data-page="chat" onclick="switchPage('chat')"><span class="nav-icon">💬</span><span>المراسلة</span></button>
    <button class="nav-btn" data-page="profile" onclick="switchPage('profile')"><span class="nav-icon">👤</span><span>حسابي</span></button>
  </div>
</div>

<!-- نافذة منبثقة -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <h3 id="modalTitle">تفاصيل</h3>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   لوحة المشرف — v30.0 (شامل ومتصل بالإدارة)
   ═══════════════════════════════════════════════════════════ */

const FIREBASE_PROJECT = "ems-supervisor";
const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;
const SESSION_KEY = "amb_user";

let currentUser = null;
let supervisorSector = "";
let supervisorCenters = [];
let allIssues = [], myIssues = [], allBroadcasts = [], myBroadcasts = [], allChats = [];

function esc(s) { return String(s||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function showToast(msg, type="success") { const c=document.getElementById("toastContainer"); const t=document.createElement("div"); t.className="toast "+type; t.textContent=(type==="success"?"✅ ":type==="danger"?"⚠️ ":"ℹ️ ")+msg; c.appendChild(t); setTimeout(()=>t.remove(),3000); }
function cleanCenter(n) { return (n || "").toString().replace("مركز إسعاف ", "").trim(); }
function timeAgo(ts) { const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000); if (diff < 60) return "الآن"; if (diff < 3600) return `قبل ${Math.floor(diff/60)}د`; if (diff < 86400) return `قبل ${Math.floor(diff/3600)}س`; return `قبل ${Math.floor(diff/86400)}ي`; }

function fromFS(v) { if(!v)return null; if("stringValue"in v)return v.stringValue; if("integerValue"in v)return parseInt(v.integerValue); if("booleanValue"in v)return v.booleanValue; if("mapValue"in v){const o={};for(const k in v.mapValue.fields||{})o[k]=fromFS(v.mapValue.fields[k]);return o;} return null; }
function docToObj(d) { const o={}; if(!d.fields)return o; for(const k in d.fields)o[k]=fromFS(d.fields[k]); o._id=d.name.split("/").pop(); return o; }
async function fsList(col) { const r=await fetch(`${FIRESTORE_URL}/${col}?pageSize=1000`,{cache:"no-store"}); if(!r.ok)throw new Error("HTTP "+r.status); const d=await r.json(); return (d.documents||[]).map(docToObj); }
async function fsAdd(col, data) { const f={}; for(const k in data){ if(data[k]===null||data[k]===undefined)continue; if(typeof data[k]==="string")f[k]={stringValue:data[k]}; else if(typeof data[k]==="number")f[k]={integerValue:String(data[k])}; else if(typeof data[k]==="boolean")f[k]={booleanValue:data[k]}; } await fetch(`${FIRESTORE_URL}/${col}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})}); }

/* ═══ التشغيل ═══ */
async function initApp() {
  document.getElementById("currentUser").textContent = currentUser.name || "مشرف";
  document.getElementById("welcomeName").textContent = currentUser.name || "مشرف";
  document.getElementById("profileName").textContent = currentUser.name || "مشرف";
  document.getElementById("profileCode").textContent = currentUser.code || "—";
  document.getElementById("heroAvatar").textContent = (currentUser.name || "م").charAt(0);
  document.getElementById("profileSector").textContent = currentUser.sector || "—";

  // جلب القطاعات
  try {
    const settings = await fsList("settings").catch(() => []);
    supervisorSector = currentUser.sector || "";
    if (settings.length > 0 && settings[0].sectors) {
      supervisorCenters = settings[0].sectors[supervisorSector] || [];
    }
    document.getElementById("welcomeSector").textContent = supervisorSector || "قطاع غير محدد";
  } catch(e) { console.warn(e); }

  syncData();
  setInterval(syncData, 30000);
}

async function syncData() {
  try {
    const [issues, bc, chat] = await Promise.all([
      fsList("issues").catch(() => []),
      fsList("broadcasts").catch(() => []),
      fsList("messages").catch(() => [])
    ]);

    allIssues = issues;
    myIssues = allIssues.filter(i => i.supervisor === currentUser.name);
    
    allBroadcasts = bc;
    myBroadcasts = allBroadcasts.filter(b => b.target === "الجميع" || b.target === supervisorSector || b.target === currentUser.name);
    
    allChats = chat;
    renderChat();

    renderHome();
    renderIssues();
    renderBroadcasts();
  } catch(e) { console.warn(e); }
}

/* ═══ الرندر ═══ */
function renderHome() {
  document.getElementById("statOpenIssues").textContent = myIssues.filter(i => i.status !== "resolved" && !i.isPraise).length;
  document.getElementById("statTotalIssues").textContent = myIssues.length;

  const bl = document.getElementById("broadcastsList");
  if (myBroadcasts.length === 0) { bl.innerHTML = '<div style="text-align:center; padding:10px; opacity:0.5;">لا تعاميم</div>'; return; }
  bl.innerHTML = myBroadcasts.slice(0,3).map(b => `
    <div class="item-card blue" style="margin-bottom:8px;">
      <div class="item-info"><h4>📢 ${esc(b.title)}</h4><p>${esc(b.description)}</p></div>
    </div>
  `).join("");
}

function renderIssues() {
  document.getElementById("issuesCount").textContent = myIssues.length;
  const list = document.getElementById("issuesList");
  if (myIssues.length === 0) { list.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.5;">لا توجد سجلات</div>'; return; }
  
  list.innerHTML = myIssues.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).map(i => `
    <div class="item-card ${i.isPraise ? 'green' : (i.status === 'resolved' ? 'blue' : 'red')}">
      <div class="item-info">
        <h4>${i.isPraise ? '⭐' : '🚩'} ${esc(i.issueType || i.praiseType || '—')}</h4>
        <p>🏥 ${esc(cleanCenter(i.center))} | 🎯 ${esc(i.targetName)} | 🕐 ${timeAgo(i.timestamp)}</p>
      </div>
    </div>
  `).join("");
}

function renderBroadcasts() {
  const list = document.getElementById("broadcastsFullList");
  if (myBroadcasts.length === 0) { list.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.5;">لا تعاميم</div>'; return; }
  list.innerHTML = myBroadcasts.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).map(b => `
    <div class="item-card">
      <div class="item-info">
        <h4>📢 ${esc(b.title)}</h4>
        <p>${esc(b.description)}</p>
        <p style="font-size:10px; opacity:0.6; margin-top:4px;">🕐 ${timeAgo(b.timestamp)}</p>
      </div>
    </div>
  `).join("");
}

/* ═══ الدردشة ═══ */
function renderChat() {
  if (!currentUser) return;
  const chatDiv = document.getElementById("chatMessages");
  if (!chatDiv) return;
  let msgs = allChats.filter(m => m.supervisor === currentUser.name).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  
  if (msgs.length === 0) { chatDiv.innerHTML = '<div style="text-align:center; opacity:0.5; padding:20px;">لا رسائل. ابدأ المحادثة.</div>'; return; }
  
  chatDiv.innerHTML = msgs.map(m => {
    const isMine = m.sender === currentUser.name;
    return `<div class="message ${isMine ? 'mine' : 'theirs'}">
      <div>${esc(m.text)}</div>
      <span class="time">${timeAgo(m.timestamp)}</span>
    </div>`;
  }).join("");
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  
  await fsAdd("messages", {
    supervisor: currentUser.name,
    sender: currentUser.name,
    text: text,
    timestamp: new Date().toISOString(),
    read: false
  });
  syncData();
}

function switchPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page-" + id).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(`.nav-btn[data-page="${id}"]`).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ═══ تسجيل إشكالية / إشادة (ديناميكي) ═══ */
async function startEntry(type) {
  if (supervisorCenters.length === 0) { showToast("لا توجد مراكز مسندة", "danger"); return; }
  
  // جلب المسعفين من السحابة
  const params = await fsList("paramedics").catch(() => []);
  
  openModal(type === 'complaint' ? "🚩 تسجيل إشكالية" : "⭐ تسجيل إشادة", `
    <label>🏥 المركز</label>
    <select id="entryCenter" onchange="updateTargets('${type}')">
      ${supervisorCenters.map(c => `<option value="${esc(c)}">${esc(cleanCenter(c))}</option>`).join("")}
    </select>

    <label>🎯 نوع الهدف</label>
    <select id="entryTargetType" onchange="updateTargets('${type}')">
      <option value="paramedic">👨‍🚒 مسعف</option>
      <option value="center">🏥 المركز نفسه</option>
      <option value="vehicle">🚑 مركبة</option>
      <option value="stock">💊 مخزن طبي</option>
    </select>

    <label id="targetNameLabel">👤 اسم المسعف</label>
    <select id="entryTargetName"></select>

    <label>${type === 'complaint' ? '🚩 نوع الإشكالية' : '⭐ نوع الإشادة'}</label>
    <input type="text" id="entryType" placeholder="اكتب النوع هنا...">

    <label>📝 الوصف</label>
    <textarea id="entryDesc" placeholder="اكتب التفاصيل..." rows="3"></textarea>

    <button class="btn ${type === 'complaint' ? 'danger' : 'success'} block" onclick="submitEntry('${type}')">💾 حفظ</button>
  `);

  // تعبئة أولية
  setTimeout(() => updateTargets(type, params), 100);
}

function updateTargets(type, paramData = null) {
  const centerVal = document.getElementById("entryCenter").value;
  const targetType = document.getElementById("entryTargetType").value;
  const targetNameSelect = document.getElementById("entryTargetName");
  const label = document.getElementById("targetNameLabel");

  if (targetType === "paramedic") {
    label.textContent = "👤 اسم المسعف";
    const centerClean = cleanCenter(centerVal);
    // جلب المسعفين التابعين للمركز
    const loadParams = paramData || window._cachedParams || [];
    const filtered = loadParams.filter(p => cleanCenter(p.centerName) === centerClean);
    
    if (filtered.length === 0) {
      targetNameSelect.innerHTML = '<option value="">لا يوجد مسعفون في هذا المركز</option>';
    } else {
      targetNameSelect.innerHTML = filtered.map(p => `<option value="${esc(p.name)}">${esc(p.name)} (${esc(p.rank || '')})</option>`).join("");
    }
  } else if (targetType === "center") {
    label.textContent = "🏥 المركز";
    targetNameSelect.innerHTML = `<option value="${esc(centerVal)}">${esc(cleanCenter(centerVal))}</option>`;
  } else if (targetType === "vehicle") {
    label.textContent = "🚑 رقم المركبة";
    targetNameSelect.innerHTML = '<option value="AMB-01">AMB-01</option><option value="AMB-02">AMB-02</option>';
  } else if (targetType === "stock") {
    label.textContent = "💊 المخزن";
    targetNameSelect.innerHTML = '<option value="المخزن الطبي">المخزن الطبي</option>';
  }
}

async function submitEntry(type) {
  const center = document.getElementById("entryCenter").value;
  const targetType = document.getElementById("entryTargetType").value;
  const targetName = document.getElementById("entryTargetName").value;
  const entryType = document.getElementById("entryType").value;
  const desc = document.getElementById("entryDesc").value;

  if (!entryType || !desc) { showToast("أكمل البيانات", "danger"); return; }

  await fsAdd("issues", {
    center: center,
    centerName: center,
    targetType: targetType,
    targetName: targetName,
    issueType: type === 'complaint' ? entryType : null,
    praiseType: type === 'praise' ? entryType : null,
    description: desc,
    supervisor: currentUser.name,
    sector: supervisorSector,
    isPraise: type === 'praise',
    status: type === 'praise' ? 'resolved' : 'new',
    timestamp: new Date().toISOString()
  });
  
  showToast("تم الحفظ بنجاح"); closeModal(); syncData();
}

/* ═══ أدوات ═══ */
function openModal(title, body) { document.getElementById("modalTitle").textContent = title; document.getElementById("modalBody").innerHTML = body; document.getElementById("modalOverlay").classList.add("show"); }
function closeModal() { document.getElementById("modalOverlay").classList.remove("show"); }
function manualRefresh() { showToast("تحديث..."); syncData(); }
function confirmLogout() { if(confirm("خروج؟")) { localStorage.removeItem(SESSION_KEY); location.href="index.html"; } }

/* ═══ التشغيل ═══ */
(function() {
  const saved = localStorage.getItem(SESSION_KEY);
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      if (currentUser && (currentUser.type === "supervisor" || currentUser.code?.startsWith("SUP"))) {
        document.getElementById("mainApp").classList.add("ready");
        initApp();
        // كاش المسعفين
        fsList("paramedics").then(p => window._cachedParams = p).catch(()=>{});
      } else {
        window.location.href = "index.html";
      }
    } catch(e) { window.location.href = "index.html"; }
  } else {
    window.location.href = "index.html";
  }
})();
</script>
