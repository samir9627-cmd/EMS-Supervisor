<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#041814">
<title>الإدارة العامة — غرفة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; -webkit-tap-highlight-color:transparent; }
    :root { --gold:#978d5b; --gold-light:#d4c896; --green:#0d4a42; --bg:#041814; --red:#e53935; --blue:#29b6f6; }
    body { background:var(--bg); color:#fff; min-height:100vh; padding-bottom:80px; }
    body::before { content:''; position:fixed; inset:0; z-index:-1; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }

    /* التبويبات العلوية */
    .topbar { background:linear-gradient(135deg, rgba(13,74,66,0.95), rgba(4,24,20,0.98)); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--gold); position:sticky; top:0; z-index:100; }
    .topbar h1 { font-size:16px; color:var(--gold-light); font-weight:900; }
    .btn-logout { background:var(--red); color:#fff; border:none; padding:6px 12px; border-radius:8px; font-weight:bold; cursor:pointer; font-family:inherit; }
    
    .tabs { display:flex; gap:8px; overflow-x:auto; padding:15px; scrollbar-width:none; border-bottom:1px solid rgba(151,141,91,0.2); }
    .tabs::-webkit-scrollbar { display:none; }
    .tab-btn { padding:10px 18px; border-radius:20px; background:rgba(255,255,255,0.05); border:1px solid rgba(151,141,91,0.3); color:#fff; font-weight:bold; font-size:13px; cursor:pointer; white-space:nowrap; font-family:inherit; transition:0.3s; }
    .tab-btn.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }

    /* المحتوى */
    .content { padding:15px; max-width:800px; margin:0 auto; }
    .page { display:none; animation:fadeIn 0.3s; }
    .page.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    /* البطاقات */
    .card { background:rgba(255,255,255,0.03); border:1px solid rgba(151,141,91,0.2); border-radius:16px; padding:20px; margin-bottom:15px; backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(0,0,0,0.5); }
    .card h3 { color:var(--gold-light); font-size:15px; margin-bottom:15px; border-bottom:1px solid rgba(151,141,91,0.2); padding-bottom:10px; display:flex; align-items:center; gap:8px; }
    
    /* النماذج */
    .form-group { margin-bottom:12px; }
    .form-group label { display:block; font-size:12px; color:var(--gold-light); margin-bottom:6px; font-weight:bold; }
    input, select, textarea { width:100%; padding:14px; background:rgba(0,0,0,0.4); border:1px solid rgba(151,141,91,0.3); border-radius:10px; color:#fff; font-size:14px; font-family:inherit; outline:none; transition:0.3s; }
    input:focus, select:focus, textarea:focus { border-color:var(--gold); box-shadow:0 0 15px rgba(151,141,91,0.2); }
    select option { background:var(--bg); }
    
    .btn { width:100%; padding:14px; border-radius:10px; border:none; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; transition:0.2s; display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:8px; }
    .btn:active { transform:scale(0.98); }
    .btn-gold { background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--bg); }
    .btn-red { background:linear-gradient(135deg, #e53935, #ff5252); color:#fff; }
    .btn-blue { background:linear-gradient(135deg, #29b6f6, #64b5f6); color:#fff; }
    .btn-green { background:linear-gradient(135deg, #43a047, #69f0ae); color:var(--bg); }
    .btn-small { padding:8px 12px; font-size:12px; width:auto; margin:0; }

    /* القوائم */
    .list-item { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.05); border-right:4px solid var(--gold); border-radius:10px; padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
    .list-info h4 { font-size:14px; color:var(--gold-light); margin-bottom:4px; }
    .list-info p { font-size:11px; color:rgba(255,255,255,0.6); }
    .list-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .icon-btn { width:32px; height:32px; border-radius:8px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
    .icon-btn.edit { background:rgba(41,182,246,0.2); color:#64b5f6; }
    .icon-btn.delete { background:rgba(229,57,53,0.2); color:#ff5252; }
    .icon-btn.copy { background:rgba(201,162,39,0.2); color:var(--gold-light); }
    .icon-btn.print { background:rgba(171,71,188,0.2); color:#ce93d8; }

    /* مؤشرات KPI */
    .kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px; }
    .kpi-box { background:rgba(13,74,66,0.5); border:1px solid rgba(151,141,91,0.3); border-radius:12px; padding:15px; text-align:center; }
    .kpi-box .num { font-size:28px; font-weight:900; color:var(--gold-light); }
    .kpi-box .lbl { font-size:11px; color:rgba(255,255,255,0.6); margin-top:4px; }
</style>
</head>
<body>

<div class="topbar">
    <h1>🏛️ الإدارة العامة</h1>
    <button class="btn-logout" onclick="logout()">خروج</button>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard', this)">📊 الإحصائيات</button>
    <button class="tab-btn" onclick="switchTab('supervisors', this)">👨‍💼 المشرفون</button>
    <button class="tab-btn" onclick="switchTab('paramedics', this)">👨‍🚒 المسعفون</button>
    <button class="tab-btn" onclick="switchTab('vehicles', this)">🚑 المركبات</button>
</div>

<div class="content">

    <!-- 1. الإحصائيات -->
    <div class="page active" id="tab-dashboard">
        <div class="kpi-grid">
            <div class="kpi-box"><div class="num" id="kpiSups">0</div><div class="lbl">المشرفون</div></div>
            <div class="kpi-box"><div class="num" id="kpiParams">0</div><div class="lbl">المسعفون</div></div>
            <div class="kpi-box"><div class="num" id="kpiVehicles">0</div><div class="lbl">المركبات</div></div>
            <div class="kpi-box"><div class="num" id="kpiCenters">0</div><div class="lbl">المراكز</div></div>
        </div>
    </div>

    <!-- 2. إدارة المشرفين -->
    <div class="page" id="tab-supervisors">
        <div class="card">
            <h3>➕ إضافة / تعديل مشرف</h3>
            <input type="hidden" id="editSupId" value="">
            <div class="form-group"><label>اسم المشرف</label><input type="text" id="supName" placeholder="مثال: أحمد المشرف"></div>
            <div class="form-group"><label>القطاع</label>
                <select id="supSector">
                    <option value="قطاع A">قطاع A</option>
                    <option value="قطاع B">قطاع B</option>
                </select>
            </div>
            <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="supPhone" placeholder="9XXXXXXX"></div>
            <div class="form-group"><label>الكود (تلقائي)</label><input type="text" id="supCode" readonly style="text-align:center; color:var(--gold-light); font-weight:bold; letter-spacing:2px;"></div>
            <button class="btn btn-gold" id="btnSaveSup" onclick="saveSupervisor()">➕ إضافة مشرف</button>
            <button class="btn btn-blue" id="btnCancelSup" onclick="cancelEditSupervisor()" style="display:none;">إلغاء التعديل</button>
        </div>
        <div class="card">
            <h3>📋 قائمة المشرفين</h3>
            <div style="display:flex; gap:8px; margin-bottom:10px;">
                <button class="btn btn-green btn-small" style="flex:1;" onclick="exportCSV('supervisors')">📊 Excel</button>
                <button class="btn btn-blue btn-small" style="flex:1;" onclick="printPDF('supervisors')">🖨️ PDF</button>
            </div>
            <div id="supervisorsList"></div>
        </div>
    </div>

    <!-- 3. إدارة المسعفين -->
    <div class="page" id="tab-paramedics">
        <div class="card">
            <h3>➕ إضافة / تعديل مسعف</h3>
            <input type="hidden" id="editPmId" value="">
            <div class="form-group"><label>الاسم</label><input type="text" id="pmName" placeholder="اسم المسعف"></div>
            <div class="form-group"><label>المركز</label>
                <select id="pmCenter">
                    <option value="مركز إسعاف دارسيت">مركز إسعاف دارسيت</option>
                    <option value="مركز إسعاف بوشر">مركز إسعاف بوشر</option>
                    <option value="مركز إسعاف العامرات">مركز إسعاف العامرات</option>
                    <option value="مركز إسعاف قريات">مركز إسعاف قريات</option>
                    <option value="مركز إسعاف الخوض 1">مركز إسعاف الخوض 1</option>
                    <option value="مركز إسعاف الخوض 2">مركز إسعاف الخوض 2</option>
                    <option value="مركز إسعاف العذيبة">مركز إسعاف العذيبة</option>
                    <option value="مركز إسعاف الرسيل">مركز إسعاف الرسيل</option>
                </select>
            </div>
            <div class="form-group"><label>الرتبة</label><input type="text" id="pmRank" placeholder="مثال: مسعف أول"></div>
            <button class="btn btn-gold" id="btnSavePm" onclick="saveParamedic()">➕ إضافة مسعف</button>
            <button class="btn btn-blue" id="btnCancelPm" onclick="cancelEditParamedic()" style="display:none;">إلغاء التعديل</button>
        </div>
        <div class="card">
            <h3>📋 قائمة المسعفين</h3>
            <div style="display:flex; gap:8px; margin-bottom:10px;">
                <button class="btn btn-green btn-small" style="flex:1;" onclick="exportCSV('paramedics')">📊 Excel</button>
                <button class="btn btn-blue btn-small" style="flex:1;" onclick="printPDF('paramedics')">🖨️ PDF</button>
            </div>
            <div id="paramedicsList"></div>
        </div>
    </div>

    <!-- 4. إدارة المركبات -->
    <div class="page" id="tab-vehicles">
        <div class="card">
            <h3>➕ إضافة / تعديل مركبة</h3>
            <input type="hidden" id="editVehId" value="">
            <div class="form-group"><label>رقم اللوحة</label><input type="text" id="vPlate" placeholder="AMB-01"></div>
            <div class="form-group"><label>النوع</label><input type="text" id="vType" placeholder="إسعاف أساسي"></div>
            <div class="form-group"><label>المركز</label>
                <select id="vCenter">
                    <option value="مركز إسعاف دارسيت">مركز إسعاف دارسيت</option>
                    <option value="مركز إسعاف بوشر">مركز إسعاف بوشر</option>
                    <option value="مركز إسعاف العامرات">مركز إسعاف العامرات</option>
                    <option value="مركز إسعاف قريات">مركز إسعاف قريات</option>
                    <option value="مركز إسعاف الخوض 1">مركز إسعاف الخوض 1</option>
                    <option value="مركز إسعاف الخوض 2">مركز إسعاف الخوض 2</option>
                    <option value="مركز إسعاف العذيبة">مركز إسعاف العذيبة</option>
                    <option value="مركز إسعاف الرسيل">مركز إسعاف الرسيل</option>
                </select>
            </div>
            <button class="btn btn-gold" id="btnSaveVeh" onclick="saveVehicle()">➕ إضافة مركبة</button>
            <button class="btn btn-blue" id="btnCancelVeh" onclick="cancelEditVehicle()" style="display:none;">إلغاء التعديل</button>
        </div>
        <div class="card">
            <h3>📋 قائمة المركبات</h3>
            <div style="display:flex; gap:8px; margin-bottom:10px;">
                <button class="btn btn-green btn-small" style="flex:1;" onclick="exportCSV('vehicles')">📊 Excel</button>
                <button class="btn btn-blue btn-small" style="flex:1;" onclick="printPDF('vehicles')">🖨️ PDF</button>
            </div>
            <div id="vehiclesList"></div>
        </div>
    </div>

</div>

<script>
    const FIREBASE_PROJECT = "ems-supervisor";
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

    const sessionStr = localStorage.getItem("amb_user") || sessionStorage.getItem("amb_user");
    if (!sessionStr) window.location.href = "index.html";
    let currentUser = JSON.parse(sessionStr);
    if (currentUser.type !== "admin") window.location.href = "index.html";

    function logout() { localStorage.removeItem("amb_user"); sessionStorage.removeItem("amb_user"); window.location.href = "index.html"; }

    function getString(field) { return (field && field.stringValue) ? field.stringValue : ""; }
    function docToObj(doc) {
        const obj = {}; if (!doc.fields) return obj;
        for (const k in doc.fields) obj[k] = getString(doc.fields[k]);
        obj._id = doc.name.split("/").pop(); return obj;
    }

    function switchTab(id, btn) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.getElementById("tab-" + id).classList.add("active");
        btn.classList.add("active");
        if (id === 'dashboard') loadKPIs();
        else if (id === 'supervisors') loadSupervisors();
        else if (id === 'paramedics') loadParamedics();
        else if (id === 'vehicles') loadVehicles();
    }

    async function loadKPIs() {
        try {
            const [resSup, resParams, resVeh] = await Promise.all([
                fetch(`${FIRESTORE_URL}/access_code?pageSize=1000`).then(r => r.json()),
                fetch(`${FIRESTORE_URL}/paramedics?pageSize=1000`).then(r => r.json()),
                fetch(`${FIRESTORE_URL}/vehicles?pageSize=1000`).then(r => r.json())
            ]);
            let sups = resSup.documents ? resSup.documents.filter(d => getString(d.fields.type) === 'supervisor').length : 0;
            document.getElementById("kpiSups").innerText = sups;
            document.getElementById("kpiParams").innerText = resParams.documents ? resParams.documents.length : 0;
            document.getElementById("kpiVehicles").innerText = resVeh.documents ? resVeh.documents.length : 0;
            document.getElementById("kpiCenters").innerText = 8; // ثابت (8 مراكز)
        } catch(e) {}
    }

    // 2. المشرفون
    function generateCode() { return "SUP-" + Math.floor(1000 + Math.random() * 9000); }

    async function loadSupervisors() {
        const el = document.getElementById("supervisorsList");
        try {
            const res = await fetch(`${FIRESTORE_URL}/access_code?pageSize=1000`, { cache: "no-store" });
            const data = await res.json();
            let list = data.documents ? data.documents.map(docToObj).filter(u => u.type === "supervisor") : [];
            
            if (list.length === 0) { el.innerHTML = "<p style='text-align:center; font-size:12px; color:#ccc;'>لا يوجد مشرفون.</p>"; return; }
            el.innerHTML = list.map(u => `
                <div class="list-item">
                    <div class="list-info">
                        <h4>👨‍💼 ${u.name}</h4>
                        <p>🏢 ${u.sector || "—"} | 📱 ${u.phone || "—"} | 🔑 ${u.code}</p>
                    </div>
                    <div class="list-actions">
                        <button class="icon-btn copy" onclick="copyCode('${u.code}')">📋</button>
                        <button class="icon-btn edit" onclick="editSupervisor('${u._id}', '${u.name}', '${u.sector}', '${u.phone}', '${u.code}')">✏️</button>
                        <button class="icon-btn delete" onclick="deleteSupervisor('${u._id}')">🗑️</button>
                    </div>
                </div>
            `).join("");
        } catch(e) { el.innerHTML = "<p style='text-align:center; color:#ff5252;'>خطأ في التحميل.</p>"; }
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => alert("📋 تم نسخ الكود: " + code)).catch(() => alert("الكود: " + code));
    }

    function editSupervisor(id, name, sector, phone, code) {
        document.getElementById("editSupId").value = id;
        document.getElementById("supName").value = name;
        document.getElementById("supSector").value = sector;
        document.getElementById("supPhone").value = phone;
        document.getElementById("supCode").value = code;
        document.getElementById("btnSaveSup").innerHTML = "💾 حفظ التعديل";
        document.getElementById("btnSaveSup").className = "btn btn-blue";
        document.getElementById("btnCancelSup").style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEditSupervisor() {
        document.getElementById("editSupId").value = "";
        document.getElementById("supName").value = "";
        document.getElementById("supPhone").value = "";
        document.getElementById("supCode").value = generateCode();
        document.getElementById("btnSaveSup").innerHTML = "➕ إضافة مشرف";
        document.getElementById("btnSaveSup").className = "btn btn-gold";
        document.getElementById("btnCancelSup").style.display = "none";
    }

    async function saveSupervisor() {
        const id = document.getElementById("editSupId").value;
        const name = document.getElementById("supName").value.trim();
        const sector = document.getElementById("supSector").value;
        const phone = document.getElementById("supPhone").value.trim();
        let code = document.getElementById("supCode").value.trim();
        if (!name) { alert("أدخل اسم المشرف"); return; }
        if (!code) code = generateCode();

        const payload = {
            fields: {
                name: { stringValue: name }, sector: { stringValue: sector },
                phone: { stringValue: phone }, code: { stringValue: code },
                type: { stringValue: "supervisor" }, active: { booleanValue: true }
            }
        };

        try {
            if (id) {
                await fetch(`${FIRESTORE_URL}/access_code/${id}`, { method: "PATCH", body: JSON.stringify(payload) });
            } else {
                payload.fields.createdAt = { stringValue: new Date().toISOString() };
                await fetch(`${FIRESTORE_URL}/access_code`, { method: "POST", body: JSON.stringify(payload) });
            }
            cancelEditSupervisor(); loadSupervisors(); loadKPIs();
        } catch(e) { alert("خطأ في الشبكة"); }
    }

    async function deleteSupervisor(id) {
        if (!confirm("حذف هذا المشرف؟")) return;
        await fetch(`${FIRESTORE_URL}/access_code/${id}`, { method: "DELETE" });
        loadSupervisors(); loadKPIs();
    }

    // 3. المسعفون
    async function loadParamedics() {
        const el = document.getElementById("paramedicsList");
        try {
            const res = await fetch(`${FIRESTORE_URL}/paramedics?pageSize=1000`, { cache: "no-store" });
            const data = await res.json();
            let list = data.documents ? data.documents.map(docToObj) : [];
            if (list.length === 0) { el.innerHTML = "<p style='text-align:center; font-size:12px; color:#ccc;'>لا يوجد مسعفون.</p>"; return; }
            el.innerHTML = list.map(p => `
                <div class="list-item">
                    <div class="list-info">
                        <h4>👨‍🚒 ${p.name}</h4>
                        <p>🏥 ${p.centerName} | 🎖️ ${p.rank || "—"}</p>
                    </div>
                    <div class="list-actions">
                        <button class="icon-btn edit" onclick="editParamedic('${p._id}', '${p.name}', '${p.centerName}', '${p.rank}')">✏️</button>
                        <button class="icon-btn delete" onclick="deleteParamedic('${p._id}')">🗑️</button>
                    </div>
                </div>
            `).join("");
        } catch(e) {}
    }

    function editParamedic(id, name, center, rank) {
        document.getElementById("editPmId").value = id;
        document.getElementById("pmName").value = name;
        document.getElementById("pmCenter").value = center;
        document.getElementById("pmRank").value = rank;
        document.getElementById("btnSavePm").innerHTML = "💾 حفظ التعديل";
        document.getElementById("btnSavePm").className = "btn btn-blue";
        document.getElementById("btnCancelPm").style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEditParamedic() {
        document.getElementById("editPmId").value = "";
        document.getElementById("pmName").value = "";
        document.getElementById("pmRank").value = "";
        document.getElementById("btnSavePm").innerHTML = "➕ إضافة مسعف";
        document.getElementById("btnSavePm").className = "btn btn-gold";
        document.getElementById("btnCancelPm").style.display = "none";
    }

    async function saveParamedic() {
        const id = document.getElementById("editPmId").value;
        const name = document.getElementById("pmName").value.trim();
        const center = document.getElementById("pmCenter").value;
        const rank = document.getElementById("pmRank").value.trim();
        if (!name) { alert("أدخل الاسم"); return; }

        const payload = { fields: { name: {stringValue:name}, centerName: {stringValue:center}, rank: {stringValue:rank} } };

        try {
            if (id) {
                await fetch(`${FIRESTORE_URL}/paramedics/${id}`, { method: "PATCH", body: JSON.stringify(payload) });
            } else {
                await fetch(`${FIRESTORE_URL}/paramedics`, { method: "POST", body: JSON.stringify(payload) });
            }
            cancelEditParamedic(); loadParamedics(); loadKPIs();
        } catch(e) { alert("خطأ في الشبكة"); }
    }

    async function deleteParamedic(id) {
        if (!confirm("حذف المسعف؟")) return;
        await fetch(`${FIRESTORE_URL}/paramedics/${id}`, { method: "DELETE" });
        loadParamedics(); loadKPIs();
    }

    // 4. المركبات
    async function loadVehicles() {
        const el = document.getElementById("vehiclesList");
        try {
            const res = await fetch(`${FIRESTORE_URL}/vehicles?pageSize=1000`, { cache: "no-store" });
            const data = await res.json();
            let list = data.documents ? data.documents.map(docToObj) : [];
            if (list.length === 0) { el.innerHTML = "<p style='text-align:center; font-size:12px; color:#ccc;'>لا يوجد مركبات.</p>"; return; }
            el.innerHTML = list.map(v => `
                <div class="list-item">
                    <div class="list-info">
                        <h4>🚑 ${v.plateNumber}</h4>
                        <p>🚗 ${v.type} | 🏥 ${v.centerName}</p>
                    </div>
                    <div class="list-actions">
                        <button class="icon-btn edit" onclick="editVehicle('${v._id}', '${v.plateNumber}', '${v.type}', '${v.centerName}')">✏️</button>
                        <button class="icon-btn delete" onclick="deleteVehicle('${v._id}')">🗑️</button>
                    </div>
                </div>
            `).join("");
        } catch(e) {}
    }

    function editVehicle(id, plate, type, center) {
        document.getElementById("editVehId").value = id;
        document.getElementById("vPlate").value = plate;
        document.getElementById("vType").value = type;
        document.getElementById("vCenter").value = center;
        document.getElementById("btnSaveVeh").innerHTML = "💾 حفظ التعديل";
        document.getElementById("btnSaveVeh").className = "btn btn-blue";
        document.getElementById("btnCancelVeh").style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEditVehicle() {
        document.getElementById("editVehId").value = "";
        document.getElementById("vPlate").value = "";
        document.getElementById("vType").value = "";
        document.getElementById("btnSaveVeh").innerHTML = "➕ إضافة مركبة";
        document.getElementById("btnSaveVeh").className = "btn btn-gold";
        document.getElementById("btnCancelVeh").style.display = "none";
    }

    async function saveVehicle() {
        const id = document.getElementById("editVehId").value;
        const plate = document.getElementById("vPlate").value.trim();
        const type = document.getElementById("vType").value.trim();
        const center = document.getElementById("vCenter").value;
        if (!plate) { alert("أدخل اللوحة"); return; }

        const payload = { fields: { plateNumber: {stringValue:plate}, type: {stringValue:type}, centerName: {stringValue:center} } };

        try {
            if (id) {
                await fetch(`${FIRESTORE_URL}/vehicles/${id}`, { method: "PATCH", body: JSON.stringify(payload) });
            } else {
                await fetch(`${FIRESTORE_URL}/vehicles`, { method: "POST", body: JSON.stringify(payload) });
            }
            cancelEditVehicle(); loadVehicles(); loadKPIs();
        } catch(e) { alert("خطأ في الشبكة"); }
    }

    async function deleteVehicle(id) {
        if (!confirm("حذف المركبة؟")) return;
        await fetch(`${FIRESTORE_URL}/vehicles/${id}`, { method: "DELETE" });
        loadVehicles(); loadKPIs();
    }

    // 5. التصدير Excel & PDF
    function exportCSV(type) {
        let data = [], headers = [], filename = "";
        if (type === 'supervisors') {
            headers = ["الاسم", "القطاع", "الهاتف", "الكود"];
            data = allSupervisors.map(s => [s.name, s.sector, s.phone, s.code]);
            filename = "supervisors";
        } else if (type === 'paramedics') {
            headers = ["الاسم", "المركز", "الرتبة"];
            data = allParamedics.map(p => [p.name, p.centerName, p.rank]);
            filename = "paramedics";
        } else if (type === 'vehicles') {
            headers = ["اللوحة", "النوع", "المركز"];
            data = allVehicles.map(v => [v.plateNumber, v.type, v.centerName]);
            filename = "vehicles";
        }
        if (data.length === 0) { alert("لا توجد بيانات للتصدير"); return; }
        
        const csv = "\uFEFF" + [headers, ...data].map(row => row.map(c => `"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `ambulance_${filename}.csv`; a.click();
        URL.revokeObjectURL(url);
    }

    function printPDF(type) {
        let title = "", headers = [], rows = [];
        if (type === 'supervisors') {
            title = "تقرير المشرفين";
            headers = ["الاسم", "القطاع", "الهاتف", "الكود"];
            rows = allSupervisors.map(s => [s.name, s.sector, s.phone, s.code]);
        } else if (type === 'paramedics') {
            title = "تقرير المسعفين";
            headers = ["الاسم", "المركز", "الرتبة"];
            rows = allParamedics.map(p => [p.name, p.centerName, p.rank]);
        } else if (type === 'vehicles') {
            title = "تقرير المركبات";
            headers = ["اللوحة", "النوع", "المركز"];
            rows = allVehicles.map(v => [v.plateNumber, v.type, v.centerName]);
        }

        const win = window.open("", "_blank");
        win.document.write(`
            <html dir="rtl"><head><title>${title}</title>
            <style>
                body { font-family: 'Cairo', sans-serif; padding: 20px; color: #000; }
                h1 { text-align: center; color: #1e4620; border-bottom: 2px solid #c9a227; padding-bottom: 10px; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                th { background: #1e4620; color: #fff; padding: 10px; border: 1px solid #000; }
                td { padding: 8px; border: 1px solid #000; text-align: center; }
                tr:nth-child(even) { background: #f5f5f5; }
            </style>
            </head><body>
                <h1>${title}</h1>
                <table>
                    <thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
                    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c||""}</td>`).join("")}</tr>`).join("")}</tbody>
                </table>
                <div style="margin-top:20px; text-align:center; font-size:10px; color:#666;">طبع من نظام الإسعاف الذكي — ${new Date().toLocaleString('ar-OM')}</div>
            </body></html>
        `);
        win.document.close();
        win.focus();
        setTimeout(() => { win.print(); win.close(); }, 500);
    }

    window.onload = function() {
        document.getElementById("supCode").value = generateCode();
        loadKPIs();
    };
</script>
</body>
