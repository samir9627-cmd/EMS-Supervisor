<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لوحة الإدارة العامة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    body { margin:0; padding:20px; background:#041814; color:#fff; font-family:'Cairo', sans-serif; }
    .card { background:rgba(13,74,66,0.6); border:1px solid #978d5b; padding:20px; border-radius:15px; margin-bottom:15px; }
    h1 { color:#d4c896; text-align:center; margin-bottom:20px; }
    h3 { color:#d4c896; margin-top:0; border-bottom:1px solid rgba(151,141,91,0.3); padding-bottom:10px; }
    .btn { background:linear-gradient(135deg, #978d5b, #d4c896); color:#041814; padding:12px; border:none; border-radius:8px; font-weight:900; width:100%; margin-top:10px; cursor:pointer; font-family:'Cairo'; font-size:14px; }
    .btn-danger { background:#e53935; color:#fff; }
    input, select, textarea { width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #978d5b; background:#041814; color:#fff; font-family:'Cairo'; box-sizing:border-box; }
    .item { background:#082b26; padding:10px; border-radius:8px; margin-bottom:5px; border-right:4px solid #978d5b; display:flex; justify-content:space-between; align-items:center; }
    .item-code { font-family:monospace; font-size:18px; color:#69f0ae; background:#000; padding:4px 8px; border-radius:4px; font-weight:bold; }
    #loading { position:fixed; inset:0; background:#041814; display:flex; align-items:center; justify-content:center; font-size:18px; color:#d4c896; font-weight:bold; z-index:9999; }
    .tabs { display:flex; gap:5px; margin-bottom:15px; }
    .tab { flex:1; padding:10px; text-align:center; background:#082b26; border-radius:8px; cursor:pointer; font-size:13px; border:1px solid #978d5b; }
    .tab.active { background:#978d5b; color:#041814; font-weight:bold; }
    .page { display:none; }
    .page.active { display:block; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loading">جاري التحقق...</div>

<div id="content" style="display:none;">
    <h1>🏛️ الإدارة العامة</h1>
    
    <div class="tabs">
        <div class="tab active" onclick="showPage('sup')">المشرفون</div>
        <div class="tab" onclick="showPage('param')">المسعفون</div>
    </div>

    <!-- صفحة المشرفين -->
    <div class="page active" id="page-sup">
        <div class="card">
            <h3>➕ إضافة مشرف (توليد كود فوري)</h3>
            <input type="text" id="supName" placeholder="اسم المشرف">
            <input type="text" id="supSector" placeholder="القطاع (A أو B)">
            <button class="btn" onclick="addSupervisor()">💾 حفظ وتوليد الكود</button>
        </div>
        <div class="card">
            <h3>👨‍💼 قائمة المشرفين وأكوادهم</h3>
            <div id="supList">جاري التحميل...</div>
        </div>
    </div>

    <!-- صفحة المسعفين -->
    <div class="page" id="page-param">
        <div class="card">
            <h3>➕ إضافة مسعف</h3>
            <input type="text" id="paramName" placeholder="اسم المسعف">
            <input type="text" id="paramCenter" placeholder="المركز">
            <button class="btn" onclick="addParamedic()">💾 حفظ</button>
        </div>
        <div class="card">
            <h3>👨‍🚒 قائمة المسعفين</h3>
            <div id="paramList">جاري التحميل...</div>
        </div>
    </div>

    <button class="btn btn-danger" onclick="logout()">🚪 تسجيل الخروج</button>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyC3m9o6Qx7m6r1b08DZIkyttArIihZL8n8",
      authDomain: "ems-supervisor.firebaseapp.com",
      projectId: "ems-supervisor",
      storageBucket: "ems-supervisor.firebasestorage.app",
      messagingSenderId: "230655268524",
      appId: "1:230655268524:web:5043a458af3d79989ff109"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // التحقق من الدخول (لوحة الإدارة)
    auth.onAuthStateChanged((user) => {
        if (!user) { window.location.href = "./index.html"; return; }
        const code = user.email.split('@')[0].toUpperCase();
        if (!code.startsWith("ADM")) { window.location.href = "./index.html"; return; }
        
        document.getElementById("loading").style.display = "none";
        document.getElementById("content").style.display = "block";
        loadSups(); loadParams();
    });

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('page-' + id).classList.add('active');
        event.target.classList.add('active');
    }

    function loadSups() {
        db.collection("access_code").where("type", "==", "supervisor").get().then(snap => {
            let html = "";
            snap.forEach(doc => {
                const data = doc.data();
                html += `<div class="item">
                    <div><b>${data.name}</b><br><small style="color:#ccc;">قطاع: ${data.sector || '-'}</small></div>
                    <div class="item-code">${data.code}</div>
                </div>`;
            });
            document.getElementById("supList").innerHTML = html || "لا يوجد مشرفون";
        });
    }

    function addSupervisor() {
        const name = document.getElementById("supName").value.trim();
        const sector = document.getElementById("supSector").value.trim() || "A";
        if (!name) return alert("أدخل الاسم");
        
        // توليد كود عشوائي
        const code = "SUP-" + Math.floor(1000 + Math.random() * 9000);
        
        // حفظ في Firestore فقط (بدون Auth لتفادي الأخطاء)
        db.collection("access_code").add({ 
            name: name, 
            code: code, 
            sector: sector, 
            type: "supervisor", 
            active: true,
            createdAt: new Date()
        }).then(() => {
            // عرض رسالة نجاح تحتوي على الكود
            alert("✅ تم حفظ المشرف بنجاح!\n\nالكود الخاص به هو: " + code);
            document.getElementById("supName").value = "";
            document.getElementById("supSector").value = "";
            loadSups();
        }).catch((error) => alert("خطأ: " + error.message));
    }

    function loadParams() {
        db.collection("paramedics").get().then(snap => {
            let html = "";
            snap.forEach(doc => {
                const data = doc.data();
                html += `<div class="item"><div><b>${data.name}</b><br><small style="color:#ccc;">${data.centerName}</small></div></div>`;
            });
            document.getElementById("paramList").innerHTML = html || "لا يوجد مسعفون";
        });
    }

    function addParamedic() {
        const name = document.getElementById("paramName").value.trim();
        const center = document.getElementById("paramCenter").value.trim();
        if (!name) return alert("أدخل الاسم");
        
        db.collection("paramedics").add({ name, centerName: center }).then(() => {
            alert("تم الحفظ");
            document.getElementById("paramName").value = "";
            document.getElementById("paramCenter").value = "";
            loadParams();
        });
    }

    function logout() {
        auth.signOut().then(() => window.location.href = "./index.html");
    }
</script>
</body>
</html>
