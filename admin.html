<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#041814">
<title>الإدارة العامة — غرفة التحكم الشاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; -webkit-tap-highlight-color:transparent; }
    :root { --gold:#978d5b; --gold-light:#d4c896; --green:#0d4a42; --bg:#041814; --red:#e53935; --blue:#29b6f6; --amber:#fb8c00; }
    body { background:var(--bg); color:#fff; min-height:100vh; padding-bottom:80px; }
    body::before { content:''; position:fixed; inset:0; z-index:-1; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }

    /* Topbar & Tabs */
    .topbar { background:linear-gradient(135deg, rgba(13,74,66,0.95), rgba(4,24,20,0.98)); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--gold); position:sticky; top:0; z-index:100; }
    .topbar h1 { font-size:16px; color:var(--gold-light); font-weight:900; }
    .btn-logout { background:var(--red); color:#fff; border:none; padding:6px 12px; border-radius:8px; font-weight:bold; cursor:pointer; font-family:inherit; }
    
    .tabs { display:flex; gap:8px; overflow-x:auto; padding:15px; scrollbar-width:none; border-bottom:1px solid rgba(151,141,91,0.2); }
    .tabs::-webkit-scrollbar { display:none; }
    .tab-btn { padding:10px 18px; border-radius:20px; background:rgba(255,255,255,0.05); border:1px solid rgba(151,141,91,0.3); color:#fff; font-weight:bold; font-size:13px; cursor:pointer; white-space:nowrap; font-family:inherit; transition:0.3s; }
    .tab-btn.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }

    .content { padding:15px; max-width:900px; margin:0 auto; }
    .page { display:none; animation:fadeIn 0.3s; }
    .page.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    /* Cards & Forms */
    .card { background:rgba(255,255,255,0.03); border:1px solid rgba(151,141,91,0.2); border-radius:16px; padding:20px; margin-bottom:15px; backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(0,0,0,0.5); }
    .card h3 { color:var(--gold-light); font-size:15px; margin-bottom:15px; border-bottom:1px solid rgba(151,141,91,0.2); padding-bottom:10px; display:flex; align-items:center; gap:8px; }
    
    .form-group { margin-bottom:12px; }
    .form-group label { display:block; font-size:12px; color:var(--gold-light); margin-bottom:6px; font-weight:bold; }
    input, select, textarea { width:100%; padding:14px; background:rgba(0,0,0,0.4); border:1px solid rgba(151,141,91,0.3); border-radius:10px; color:#fff; font-size:14px; font-family:inherit; outline:none; }
    input:focus, select:focus, textarea:focus { border-color:var(--gold); box-shadow:0 0 15px rgba(151,141,91,0.2); }
    select option { background:var(--bg); }
    
    .btn { width:100%; padding:14px; border-radius:10px; border:none; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; transition:0.2s; display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:8px; }
    .btn:active { transform:scale(0.98); }
    .btn-gold { background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--bg); }
    .btn-red { background:linear-gradient(135deg, #e53935, #ff5252); color:#fff; }
    .btn-blue { background:linear-gradient(135deg, #29b6f6, #64b5f6); color:#fff; }
    .btn-small { padding:8px 12px; font-size:12px; width:auto; margin:0; }

    /* Lists */
    .list-item { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.05); border-right:4px solid var(--gold); border-radius:10px; padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
    .list-info h4 { font-size:14px; color:var(--gold-light); margin-bottom:4px; }
    .list-info p { font-size:11px; color:rgba(255,255,255,0.6); }
    .list-actions { display:flex; gap:6px; }
    .icon-btn { width:32px; height:32px; border-radius:8px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
    .icon-btn.edit { background:rgba(41,182,246,0.2); color:#64b5f6; }
    .icon-btn.delete { background:rgba(229,57,53,0.2); color:#ff5252; }
    .icon-btn.copy { background:rgba(151,141,91,0.2); color:var(--gold-light); }

    /* KPI */
    .kpi-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:15px; }
    .kpi-box { background:rgba(13,74,66,0.5); border:1px solid rgba(151,141,91,0.3); border-radius:12px; padding:15px; text-align:center; }
    .kpi-box .num { font-size:26px; font-weight:900; color:var(--gold-light); }
    .kpi-box .lbl { font-size:11px; color:rgba(255,255,255,0.6); margin-top:4px; }

    /* Schedule */
    .schedule-table { width:100%; border-collapse:collapse; font-size:11px; margin-top:10px; }
    .schedule-table th, .schedule-table td { border:1px solid rgba(151,141,91,0.2); padding:6px; text-align:center; }
    .schedule-table th { background:rgba(13,74,66,0.8); color:var(--gold-light); }
    .schedule-table td { background:rgba(0,0,0,0.3); }
    .schedule-table select { padding:4px; font-size:10px; margin:0; background:transparent; border:none; }

    /* Reports table */
    .report-table { width:100%; border-collapse:collapse; font-size:12px; }
    .report-table th, .report-table td { border:1px solid rgba(151,141,91,0.2); padding:8px; text-align:center; }
    .report-table th { background:rgba(13,74,66,0.8); color:var(--gold-light); }
    .report-table td { background:rgba(0,0,0,0.3); }
</style>
</head>
<body>

<div class="topbar">
    <h1>🏛️ الإدارة العامة</h1>
    <button class="btn-logout" onclick="logout()">خروج</button>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard', this)">📊 التحليلات</button>
    <button class="tab-btn" onclick="switchTab('supervisors', this)">👨‍💼 المشرفون</button>
    <button class="tab-btn" onclick="switchTab('paramedics', this)">👨‍🚒 المسعفون</button>
    <button class="tab-btn" onclick="switchTab('vehicles', this)">🚑 المركبات</button>
    <button class="tab-btn" onclick="switchTab('schedule', this)">📅 الدوام الشهري</button>
    <button class="tab-btn" onclick="switchTab('reports', this)">📈 التقارير</button>
    <button class="tab-btn" onclick="switchTab('masterdata', this)">📋 البيانات الأساسية</button>
</div>

<div class="content">
    <!-- 1. لوحة التحليلات -->
    <div class="page active" id="tab-dashboard">
        <div class="kpi-grid">
            <div class="kpi-box"><div class="num" id="kpiSups">0</div><div class="lbl">المشرفون</div></div>
            <div class="kpi-box"><div class="num" id="kpiIssues">0</div><div class="lbl">الإشكالات</div></div>
            <div class="kpi-box"><div class="num" id="kpiPraises">0</div><div class="lbl">الإشادات</div></div>
        </div>
        <div class="card">
            <h3>📊 نشاط المشرفين (آخر 7 أيام)</h3>
            <div id="activityChart" style="display:flex; align-items:flex-end; height:150px; gap:6px; padding:10px; border-bottom:2px solid var(--gold);"></div>
        </div>
        <div class="card">
            <h3>📡 نبض المراكز (Heatmap)</h3>
            <div id="centersHeatmap" style="display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;"></div>
        </div>
    </div>

    <!-- 2. المشرفون -->
    <div class="page" id="tab-supervisors">
        <div class="card">
            <h3>➕ إضافة / تعديل مشرف</h3>
            <input type="hidden" id="editSupId" value="">
            <div class="form-group"><label>الاسم</label><input type="text" id="supName"></div>
            <div class="form-group"><label>القطاع</label><select id="supSector"><option>قطاع A</option><option>قطاع B</option></select></div>
            <div class="form-group"><label>الهاتف</label><input type="tel" id="supPhone"></div>
            <div class="form-group"><label>الكود (تلقائي)</label><input type="text" id="supCode" readonly style="text-align:center; font-weight:bold; color:var(--gold-light);"></div>
            <button class="btn btn-gold" onclick="saveSupervisor()">💾 حفظ</button>
            <button class="btn btn-blue" id="btnCancelSup" onclick="cancelEditSupervisor()" style="display:none;">إلغاء</button>
        </div>
        <div class="card"><h3>📋 المشرفون</h3><div id="supervisorsList"></div></div>
    </div>

    <!-- 3. المسعفون -->
    <div class="page" id="tab-paramedics">
        <div class="card">
            <h3>➕ إضافة مسعف</h3>
            <div class="form-group"><label>الاسم</label><input type="text" id="pmName"></div>
            <div class="form-group"><label>المركز</label><select id="pmCenter"><option>مركز إسعاف دارسيت</option><option>مركز إسعاف بوشر</option><option>مركز إسعاف العامرات</option><option>مركز إسعاف قريات</option><option>مركز إسعاف الخوض 1</option><option>مركز إسعاف الخوض 2</option><option>مركز إسعاف العذيبة</option><option>مركز إسعاف الرسيل</option></select></div>
            <div class="form-group"><label>الرتبة</label><input type="text" id="pmRank"></div>
            <button class="btn btn-gold" onclick="saveParamedic()">💾 حفظ</button>
        </div>
        <div class="card"><h3>📋 المسعفون</h3><div id="paramedicsList"></div></div>
    </div>

    <!-- 4. المركبات -->
    <div class="page" id="tab-vehicles">
        <div class="card">
            <h3>➕ إضافة مركبة</h3>
            <div class="form-group"><label>اللوحة</label><input type="text" id="vPlate"></div>
            <div class="form-group"><label>النوع</label><input type="text" id="vType"></div>
            <div class="form-group"><label>المركز</label><select id="vCenter"><option>مركز إسعاف دارسيت</option><option>مركز إسعاف بوشر</option><option>مركز إسعاف العامرات</option><option>مركز إسعاف قريات</option><option>مركز إسعاف الخوض 1</option><option>مركز إسعاف الخوض 2</option><option>مركز إسعاف العذيبة</option><option>مركز إسعاف الرسيل</option></select></div>
            <button class="btn btn-gold" onclick="saveVehicle()">💾 حفظ</button>
        </div>
        <div class="card"><h3>📋 المركبات</h3><div id="vehiclesList"></div></div>
    </div>

    <!-- 5. الدوام الشهري -->
    <div class="page" id="tab-schedule">
        <div class="card">
            <h3>📅 جدول الدوام الشهري</h3>
            <div class="form-group"><label>اختر الشهر</label><input type="month" id="scheduleMonth" onchange="loadSchedule()"></div>
            <div style="overflow-x:auto;" id="scheduleContainer"></div>
            <button class="btn btn-gold" onclick="saveSchedule()" style="margin-top:10px;">💾 حفظ الجدول</button>
        </div>
    </div>

    <!-- 6. التقارير -->
    <div class="page" id="tab-reports">
        <div class="card">
            <h3>📊 تقييم أداء المراكز</h3>
            <div id="centersReport"></div>
        </div>
    </div>

    <!-- 7. البيانات الأساسية -->
    <div class="page" id="tab-masterdata">
        <div class="card">
            <h3>🚩 أنواع الإشكالات</h3>
            <div class="form-group"><input type="text" id="mdIssueType" placeholder="اسم النوع"></div>
            <button class="btn btn-gold btn-small" onclick="addMasterData('issue_types')">➕ إضافة</button>
            <div id="issueTypesList" style="margin-top:10px;"></div>
        </div>
        <div class="card">
            <h3>⭐ أنواع الإشادات</h3>
            <div class="form-group"><input type="text" id="mdPraiseType" placeholder="اسم النوع"></div>
            <button class="btn btn-gold btn-small" onclick="addMasterData('praise_types')">➕ إضافة</button>
            <div id="praiseTypesList" style="margin-top:10px;"></div>
        </div>
    </div>
</div>

<script>
    const FIREBASE_PROJECT = "ems-supervisor";
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;
    const CENTERS_LIST = ["مركز إسعاف دارسيت","مركز إسعاف بوشر","مركز إسعاف العامرات","مركز إسعاف قريات","مركز إسعاف الخوض 1","مركز إسعاف الخوض 2","مركز إسعاف العذيبة","مركز إسعاف الرسيل"];

    const sessionStr = localStorage.getItem("amb_user") || sessionStorage.getItem("amb_user");
    if (!sessionStr) window.location.href = "index.html";
    let currentUser = JSON.parse(sessionStr);
    if (currentUser.type !== "admin") window.location.href = "index.html";

    let allSupervisors = [], allParameds = [], allVehicles = [], allIssues = [], allPraises = [];

    function logout() { localStorage.removeItem("amb_user"); sessionStorage.removeItem("amb_user"); window.location.href = "index.html"; }
    function getString(field) { return (field && field.stringValue) ? field.stringValue : ""; }
    function docToObj(doc) { const obj = {}; if (!doc.fields) return obj; for (const k in doc.fields) obj[k] = getString(doc.fields[k]); obj._id = doc.name.split("/").pop(); return obj; }
    function generateCode() { return "SUP-" + Math.floor(1000 + Math.random() * 9000); }

    function switchTab(id, btn) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.getElementById("tab-" + id).classList.add("active");
        btn.classList.add("active");
        if (id === 'dashboard') loadKPIs();
        else if (id === 'supervisors') loadSupervisors();
        else if (id === 'paramedics') loadParameds();
        else if (id === 'vehicles') loadVehicles();
        else if (id === 'schedule') loadSchedule();
        else if (id === 'reports') loadReports();
        else if (id === 'masterdata') loadMasterData();
    }

    async function loadKPIs() {
        try {
            const [resSup, resIss, resPra] = await Promise.all([
                fetch(`${FIRESTORE_URL}/access_code?pageSize=1000`).then(r => r.json()),
                fetch(`${FIRESTORE_URL}/issues?pageSize=1000`).then(r => r.json()),
                fetch(`${FIRESTORE_URL}/praises?pageSize=1000`).then(r => r.json())
            ]);
            allSupervisors = resSup.documents ? resSup.documents.map(docToObj).filter(u => u.type === "supervisor") : [];
            allIssues = resIss.documents ? resIss.documents.map(docToObj) : [];
            allPraises = resPra.documents ? resPra.documents.map(docToObj) : [];

            document.getElementById("kpiSups").innerText = allSupervisors.length;
            document.getElementById("kpiIssues").innerText = allIssues.length;
            document.getElementById("kpiPraises").innerText = allPraises.length;

            const days = [0,0,0,0,0,0,0];
            const now = new Date();
            [...allIssues, ...allPraises].forEach(item => {
                const diff = Math.floor((now - new Date(item.timestamp)) / 86400000);
                if (diff >= 0 && diff < 7) days[6-diff]++;
            });
            const max = Math.max(...days, 1);
            document.getElementById("activityChart").innerHTML = days.map((c, i) => {
                const h = Math.max(10, (c / max) * 100);
                return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;">
                    <div style="font-size:10px;color:var(--gold-light);margin-bottom:4px;">${c}</div>
                    <div style="width:100%;height:${h}%;background:linear-gradient(180deg,var(--gold-light),var(--gold));border-radius:4px 4px 0 0;"></div>
                </div>`;
            }).join("");

            const heatmap = document.getElementById("centersHeatmap");
            heatmap.innerHTML = CENTERS_LIST.map(c => {
                const iss = allIssues.filter(i => i.centerName === c).length;
                const pra = allPraises.filter(p => p.centerName === c).length;
                let color = "rgba(67,160,71,0.5)";
                if (iss > 5) color = "rgba(229,57,53,0.5)";
                else if (iss > 2) color = "rgba(251,140,0,0.5)";
                return `<div style="background:${color}; border-radius:10px; padding:10px; text-align:center;">
                    <div style="font-size:11px; font-weight:bold;">${c.replace("مركز إسعاف ", "")}</div>
                    <div style="font-size:18px; font-weight:900; color:#fff;">${iss} / ${pra}</div>
                    <div style="font-size:9px; opacity:0.8;">إشكالات / إشادات</div>
                </div>`;
            }).join("");
        } catch(e) {}
    }

    // المشرفون
    async function loadSupervisors() {
        const el = document.getElementById("supervisorsList");
        el.innerHTML = allSupervisors.map(u => `
            <div class="list-item">
                <div class="list-info"><h4>${u.name}</h4><p>${u.sector} | ${u.phone || "—"} | ${u.code}</p></div>
                <div class="list-actions">
                    <button class="icon-btn copy" onclick="copyCode('${u.code}')">📋</button>
                    <button class="icon-btn edit" onclick="editSupervisor('${u._id}', '${u.name}', '${u.sector}', '${u.phone}', '${u.code}')">✏️</button>
                    <button class="icon-btn delete" onclick="deleteSupervisor('${u._id}')">🗑️</button>
                </div>
            </div>
        `).join("");
    }
    function copyCode(code) { navigator.clipboard.writeText(code); alert("📋 تم النسخ: " + code); }
    function editSupervisor(id, name, sector, phone, code) {
        document.getElementById("editSupId").value = id;
        document.getElementById("supName").value = name;
        document.getElementById("supSector").value = sector;
        document.getElementById("supPhone").value = phone;
        document.getElementById("supCode").value = code;
        document.getElementById("btnCancelSup").style.display = "block";
    }
    function cancelEditSupervisor() {
        document.getElementById("editSupId").value = "";
        document.getElementById("supName").value = "";
        document.getElementById("supPhone").value = "";
        document.getElementById("supCode").value = generateCode();
        document.getElementById("btnCancelSup").style.display = "none";
    }
    async function saveSupervisor() {
        const id = document.getElementById("editSupId").value;
        const name = document.getElementById("supName").value.trim();
        const sector = document.getElementById("supSector").value;
        const phone = document.getElementById("supPhone").value.trim();
        let code = document.getElementById("supCode").value.trim() || generateCode();
        const payload = { fields: { name: {stringValue:name}, sector: {stringValue:sector}, phone: {stringValue:phone}, code: {stringValue:code}, type: {stringValue:"supervisor"}, active: {booleanValue:true} } };
        if (id) await fetch(`${FIRESTORE_URL}/access_code/${id}`, { method: "PATCH", body: JSON.stringify(payload) });
        else await fetch(`${FIRESTORE_URL}/access_code`, { method: "POST", body: JSON.stringify(payload) });
        cancelEditSupervisor(); loadKPIs(); loadSupervisors();
    }
    async function deleteSupervisor(id) {
        if (!confirm("حذف؟")) return;
        await fetch(`${FIRESTORE_URL}/access_code/${id}`, { method: "DELETE" });
        loadKPIs(); loadSupervisors();
    }

    // المسعفون والمركبات (تم اختصارها للتركيز على الأساسيات)
    async function loadParameds() {
        const res = await fetch(`${FIRESTORE_URL}/paramedics?pageSize=1000`).then(r => r.json());
        allParameds = res.documents ? res.documents.map(docToObj) : [];
        document.getElementById("paramedicsList").innerHTML = allParameds.map(p => `
            <div class="list-item"><div class="list-info"><h4>${p.name}</h4><p>${p.centerName} | ${p.rank}</p></div><div class="list-actions"><button class="icon-btn delete" onclick="deleteParamedic('${p._id}')">🗑️</button></div></div>
        `).join("");
    }
    async function saveParamedic() {
        const name = document.getElementById("pmName").value.trim();
        const center = document.getElementById("pmCenter").value;
        const rank = document.getElementById("pmRank").value.trim();
        await fetch(`${FIRESTORE_URL}/paramedics`, { method: "POST", body: JSON.stringify({ fields: { name: {stringValue:name}, centerName: {stringValue:center}, rank: {stringValue:rank} } }) });
        document.getElementById("pmName").value = ""; document.getElementById("pmRank").value = "";
        loadParameds();
    }
    async function deleteParamedic(id) {
        if (!confirm("حذف؟")) return;
        await fetch(`${FIRESTORE_URL}/paramedics/${id}`, { method: "DELETE" });
        loadParameds();
    }
    async function loadVehicles() {
        const res = await fetch(`${FIRESTORE_URL}/vehicles?pageSize=1000`).then(r => r.json());
        allVehicles = res.documents ? res.documents.map(docToObj) : [];
        document.getElementById("vehiclesList").innerHTML = allVehicles.map(v => `
            <div class="list-item"><div class="list-info"><h4>${v.plateNumber}</h4><p>${v.type} | ${v.centerName}</p></div><div class="list-actions"><button class="icon-btn delete" onclick="deleteVehicle('${v._id}')">🗑️</button></div></div>
        `).join("");
    }
    async function saveVehicle() {
        const plate = document.getElementById("vPlate").value.trim();
        const type = document.getElementById("vType").value.trim();
        const center = document.getElementById("vCenter").value;
        await fetch(`${FIRESTORE_URL}/vehicles`, { method: "POST", body: JSON.stringify({ fields: { plateNumber: {stringValue:plate}, type: {stringValue:type}, centerName: {stringValue:center} } }) });
        document.getElementById("vPlate").value = ""; document.getElementById("vType").value = "";
        loadVehicles();
    }
    async function deleteVehicle(id) {
        if (!confirm("حذف؟")) return;
        await fetch(`${FIRESTORE_URL}/vehicles/${id}`, { method: "DELETE" });
        loadVehicles();
    }

    // جدول الدوام
    function loadSchedule() {
        const monthInput = document.getElementById("scheduleMonth");
        if (!monthInput.value) monthInput.value = new Date().toISOString().slice(0,7);
        const [year, month] = monthInput.value.split("-");
        const daysInMonth = new Date(year, month, 0).getDate();
        let html = `<table class="schedule-table"><thead><tr><th>المشرف</th>`;
        for (let d = 1; d <= daysInMonth; d++) html += `<th>${d}</th>`;
        html += `</tr></thead><tbody>`;
        allSupervisors.forEach(s => {
            html += `<tr><td style="text-align:right;padding-right:8px;">${s.name}</td>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const key = `shift_${monthInput.value}_${s.code}_${d}`;
                const val = localStorage.getItem(key) || "";
                html += `<td><select onchange="setScheduleShift('${s.code}', ${d}, this.value)">
                    <option value="">—</option>
                    <option value="morning" ${val === 'morning' ? 'selected' : ''}>ص</option>
                    <option value="evening" ${val === 'evening' ? 'selected' : ''}>م</option>
                </select></td>`;
            }
            html += `</tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById("scheduleContainer").innerHTML = html;
    }
    function setScheduleShift(code, day, shift) {
        const monthInput = document.getElementById("scheduleMonth");
        localStorage.setItem(`shift_${monthInput.value}_${code}_${day}`, shift);
    }
    function saveSchedule() { alert("✅ تم حفظ الجدول محلياً"); }

    // التقارير
    function loadReports() {
        let html = `<table class="report-table"><thead><tr><th>المركز</th><th>إشكالات</th><th>إشادات</th><th>الحالة</th></tr></thead><tbody>`;
        CENTERS_LIST.forEach(c => {
            const cIssues = allIssues.filter(i => i.centerName === c).length;
            const cPraises = allPraises.filter(p => p.centerName === c).length;
            const status = cIssues > 5 ? "🔴 ضغط عالي" : cIssues > 2 ? "🟡 متوسط" : "🟢 مستقر";
            html += `<tr><td>${c.replace("مركز إسعاف ", "")}</td><td>${cIssues}</td><td>${cPraises}</td><td>${status}</td></tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById("centersReport").innerHTML = html;
    }

    // البيانات الأساسية
    async function loadMasterData() {
        const [resIss, resPra] = await Promise.all([
            fetch(`${FIRESTORE_URL}/issue_types?pageSize=1000`).then(r => r.json()),
            fetch(`${FIRESTORE_URL}/praise_types?pageSize=1000`).then(r => r.json())
        ]);
        const issTypes = resIss.documents ? resIss.documents.map(docToObj) : [];
        const praTypes = resPra.documents ? resPra.documents.map(docToObj) : [];
        document.getElementById("issueTypesList").innerHTML = issTypes.map(t => `<div class="list-item"><div class="list-info"><h4>${t.name}</h4></div><div class="list-actions"><button class="icon-btn delete" onclick="deleteMasterData('issue_types', '${t._id}')">🗑️</button></div></div>`).join("");
        document.getElementById("praiseTypesList").innerHTML = praTypes.map(t => `<div class="list-item"><div class="list-info"><h4>${t.name}</h4></div><div class="list-actions"><button class="icon-btn delete" onclick="deleteMasterData('praise_types', '${t._id}')">🗑️</button></div></div>`).join("");
    }
    async function addMasterData(col) {
        const input = col === 'issue_types' ? document.getElementById("mdIssueType") : document.getElementById("mdPraiseType");
        const name = input.value.trim();
        if (!name) return;
        await fetch(`${FIRESTORE_URL}/${col}`, { method: "POST", body: JSON.stringify({ fields: { name: {stringValue:name} } }) });
        input.value = "";
        loadMasterData();
    }
    async function deleteMasterData(col, id) {
        if (!confirm("حذف؟")) return;
        await fetch(`${FIRESTORE_URL}/${col}/${id}`, { method: "DELETE" });
        loadMasterData();
    }

    window.onload = function() { 
        document.getElementById("supCode").value = generateCode();
        loadKPIs(); 
        document.getElementById("scheduleMonth").value = new Date().toISOString().slice(0,7);
    };
</script>
</body>
