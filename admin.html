<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة العامة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
    :root { --gold:#c9a227; --green:#0d4a42; --bg:#041814; --red:#e53935; }
    body { background:var(--bg); color:#fff; min-height:100vh; padding-bottom:20px; }
    .topbar { background:var(--green); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--gold); position:sticky; top:0; z-index:100; }
    .topbar h2 { font-size:14px; color:var(--gold); }
    .btn-logout { background:var(--red); color:#fff; border:none; padding:6px 12px; border-radius:8px; font-weight:bold; cursor:pointer; }
    .content { padding:15px; max-width:600px; margin:0 auto; }
    .card { background:rgba(255,255,255,0.05); border:1px solid rgba(201,162,39,0.2); border-radius:16px; padding:15px; margin-bottom:15px; }
    .card h3 { color:var(--gold); margin-bottom:15px; font-size:15px; }
    .form-group { margin-bottom:10px; }
    .form-group label { display:block; font-size:12px; color:var(--gold); margin-bottom:4px; }
    input, select { width:100%; padding:12px; background:rgba(0,0,0,0.3); border:1px solid rgba(201,162,39,0.3); border-radius:8px; color:#fff; font-size:14px; outline:none; }
    select option { background:var(--bg); }
    button.btn-save { width:100%; padding:14px; border-radius:8px; border:none; font-size:14px; font-weight:900; cursor:pointer; background:linear-gradient(135deg, #43a047, #69f0ae); color:var(--bg); margin-top:10px; }
    .msg { text-align:center; font-size:12px; font-weight:bold; margin-top:10px; }
    
    /* قائمة المستخدمين */
    .user-item { background:rgba(255,255,255,0.05); border-right:4px solid var(--gold); border-radius:8px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
    .user-info h4 { font-size:14px; color:var(--gold); margin-bottom:4px; }
    .user-info p { font-size:11px; color:rgba(255,255,255,0.6); }
    .user-code { background:rgba(201,162,39,0.2); color:var(--gold); padding:4px 8px; border-radius:6px; font-weight:900; font-size:12px; letter-spacing:1px; }
</style>
</head>
<body>
<div class="topbar">
    <h2 id="nameDisplay">جاري التحميل...</h2>
    <button class="btn-logout" onclick="logout()">خروج</button>
</div>

<div class="content">
    <!-- نموذج توليد كود -->
    <div class="card">
        <h3>🏛️ توليد كود جديد</h3>
        <div class="form-group">
            <label>الاسم / المركز</label>
            <input type="text" id="newName" placeholder="مثال: مركز بوشر">
        </div>
        <div class="form-group">
            <label>نوع الحساب</label>
            <select id="newType" onchange="generateCode()">
                <option value="supervisor">مشرف ميداني</option>
                <option value="ops">غرفة عمليات</option>
                <option value="admin">إدارة</option>
            </select>
        </div>
        <div class="form-group">
            <label>الكود التلقائي</label>
            <input type="text" id="newCode" readonly style="text-align:center; color:var(--gold); font-weight:bold; font-size:16px;">
        </div>
        <button class="btn-save" onclick="saveNewUser()">💾 حفظ في Firebase</button>
        <div id="msgBox" class="msg"></div>
    </div>

    <!-- قائمة المستخدمين -->
    <div class="card">
        <h3>👥 المستخدمون المسجلون</h3>
        <div id="usersList">
            <p style="text-align:center; font-size:12px; color:#ccc;">جاري التحميل...</p>
        </div>
    </div>
</div>

<script>
    const FIREBASE_PROJECT = "ems-supervisor";
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

    // حماية الصفحة
    const sessionStr = localStorage.getItem("amb_session");
    if (!sessionStr) window.location.href = "index.html";
    const currentUser = JSON.parse(sessionStr || "{}");
    if (currentUser.type !== "admin") window.location.href = "index.html";
    
    document.getElementById("nameDisplay").innerText = currentUser.name || "الإدارة";

    function logout() { localStorage.removeItem("amb_session"); window.location.href = "index.html"; }

    // دالة قراءة القيم
    function getString(field) { return (field && field.stringValue) ? field.stringValue : ""; }
    function getBool(field) { return (field && field.booleanValue !== undefined) ? field.booleanValue : true; }

    // توليد الكود
    function generateCode() {
        const type = document.getElementById("newType").value;
        const prefix = type === "admin" ? "ADM" : (type === "ops" ? "OPS" : "SUP");
        document.getElementById("newCode").value = `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`;
    }

    // حفظ المستخدم الجديد
    async function saveNewUser() {
        const name = document.getElementById("newName").value.trim();
        const type = document.getElementById("newType").value;
        const code = document.getElementById("newCode").value;
        const msg = document.getElementById("msgBox");

        if (!name) { msg.style.color = "#ff5252"; msg.innerText = "⚠️ أدخل الاسم"; return; }

        msg.style.color = "#e5c158"; msg.innerText = "⏳ جاري الحفظ...";

        const payload = {
            fields: {
                code: { stringValue: code },
                name: { stringValue: name },
                type: { stringValue: type },
                active: { booleanValue: true }
            }
        };

        try {
            const res = await fetch(`${FIRESTORE_URL}/access_code`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                msg.style.color = "#69f0ae"; msg.innerText = "✅ تم الحفظ بنجاح!";
                document.getElementById("newName").value = "";
                generateCode();
                loadUsers(); // تحديث القائمة
            } else {
                msg.style.color = "#ff5252"; msg.innerText = "❌ فشل الحفظ";
            }
        } catch (e) { msg.style.color = "#ff5252"; msg.innerText = "❌ خطأ في الشبكة"; }
    }

    // تحميل المستخدمين
    async function loadUsers() {
        const listDiv = document.getElementById("usersList");
        try {
            const res = await fetch(`${FIRESTORE_URL}/access_code?pageSize=1000`, { cache: "no-store" });
            const data = await res.json();

            if (!data.documents || data.documents.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center; font-size:12px; color:#ccc;'>لا يوجد مستخدمون بعد.</p>";
                return;
            }

            listDiv.innerHTML = data.documents.map(doc => {
                const f = doc.fields;
                const name = getString(f.name);
                const code = getString(f.code);
                const type = getString(f.type);
                const active = getBool(f.active);

                let roleName = "مشرف";
                if (type === "admin") roleName = "إدارة";
                if (type === "ops") roleName = "عمليات";

                return `
                    <div class="user-item" style="${active ? '' : 'opacity:0.5;'}">
                        <div class="user-info">
                            <h4>${name}</h4>
                            <p>${roleName} ${active ? '(نشط)' : '(معطل)'}</p>
                        </div>
                        <div class="user-code">${code}</div>
                    </div>
                `;
            }).join("");

        } catch(e) {
            listDiv.innerHTML = "<p style='text-align:center; font-size:12px; color:#ff5252;'>خطأ في تحميل البيانات.</p>";
        }
    }

    // التشغيل عند فتح الصفحة
    window.onload = function() {
        generateCode();
        loadUsers();
    };
</script>
</body>
</html>
