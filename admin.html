<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
    :root { --gold:#c9a227; --green:#0d4a42; --bg:#041814; --red:#e53935; }
    body { background:var(--bg); color:#fff; min-height:100vh; }
    .topbar { background:var(--green); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--gold); }
    .topbar h2 { font-size:14px; color:var(--gold); }
    .btn-logout { background:var(--red); color:#fff; border:none; padding:6px 12px; border-radius:8px; font-weight:bold; }
    .content { padding:15px; max-width:500px; margin:0 auto; }
    .card { background:rgba(255,255,255,0.05); border:1px solid rgba(201,162,39,0.2); border-radius:16px; padding:15px; margin-bottom:15px; }
    .card h3 { color:var(--gold); margin-bottom:10px; font-size:15px; }
    .form-group { margin-bottom:10px; }
    .form-group label { display:block; font-size:12px; color:var(--gold); margin-bottom:4px; }
    input, select { width:100%; padding:12px; background:rgba(0,0,0,0.3); border:1px solid rgba(201,162,39,0.3); border-radius:8px; color:#fff; font-size:14px; outline:none; }
    select option { background:var(--bg); }
    button { width:100%; padding:14px; border-radius:8px; border:none; font-size:14px; font-weight:900; cursor:pointer; background:linear-gradient(135deg, #43a047, #69f0ae); color:var(--bg); }
    .msg { text-align:center; font-size:12px; font-weight:bold; margin-top:10px; }
</style>
</head>
<body>
<div class="topbar">
    <h2 id="welcomeName">الإدارة</h2>
    <button class="btn-logout" onclick="logout()">خروج</button>
</div>
<div class="content">
    <div class="card">
        <h3>🏛️ توليد كود جديد</h3>
        <div class="form-group">
            <label>الاسم / المركز</label>
            <input type="text" id="newName" placeholder="مثال: مركز بوشر">
        </div>
        <div class="form-group">
            <label>نوع الحساب</label>
            <select id="newType" onchange="generateCode()">
                <option value="supervisor">مشرف ميداني</option>
                <option value="ops">غرفة عمليات</option>
                <option value="admin">إدارة</option>
            </select>
        </div>
        <div class="form-group">
            <label>الكود التلقائي</label>
            <input type="text" id="newCode" readonly style="text-align:center; color:var(--gold); font-weight:bold;">
        </div>
        <button onclick="saveNewUser()">💾 حفظ في Firebase</button>
        <div id="msgBox" class="msg"></div>
    </div>
</div>
<script>
    const FIREBASE_PROJECT = "ems-supervisor";
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

    window.onload = function() {
        const saved = localStorage.getItem("amb_session");
        if (!saved) { location.href = "index.html"; return; }
        const user = JSON.parse(saved);
        if (user.role !== 'admin') { location.href = "index.html"; return; }
        document.getElementById("welcomeName").innerText = user.name;
        generateCode();
    };

    function logout() { localStorage.removeItem("amb_session"); location.href = "index.html"; }

    function generateCode() {
        const type = document.getElementById("newType").value;
        const prefix = type === "admin" ? "ADM" : (type === "ops" ? "OPS" : "SUP");
        document.getElementById("newCode").value = `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`;
    }

    async function saveNewUser() {
        const name = document.getElementById("newName").value.trim();
        const type = document.getElementById("newType").value;
        const code = document.getElementById("newCode").value;
        if (!name) { document.getElementById("msgBox").innerText = "⚠️ أدخل الاسم"; return; }

        const payload = { fields: { code: { stringValue: code }, name: { stringValue: name }, type: { stringValue: type }, active: { booleanValue: true } } };
        try {
            await fetch(`${FIRESTORE_URL}/access_code`, { method: "POST", body: JSON.stringify(payload) });
            document.getElementById("msgBox").style.color = "#69f0ae";
            document.getElementById("msgBox").innerText = "✅ تم الحفظ بنجاح!";
            document.getElementById("newName").value = "";
            generateCode();
        } catch(e) { document.getElementById("msgBox").innerText = "❌ خطأ"; }
    }
</script>
</body>
</html>
