<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#041814">
<title>الإدارة العامة — غرفة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; -webkit-tap-highlight-color:transparent; }
    :root { --gold:#978d5b; --gold-light:#d4c896; --green:#0d4a42; --bg:#041814; --red:#e53935; --blue:#29b6f6; }
    body { background:var(--bg); color:#fff; min-height:100vh; padding-bottom:80px; }
    body::before { content:''; position:fixed; inset:0; z-index:-1; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }

    /* التبويبات العلوية */
    .topbar { background:linear-gradient(135deg, rgba(13,74,66,0.95), rgba(4,24,20,0.98)); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--gold); position:sticky; top:0; z-index:100; }
    .topbar h1 { font-size:16px; color:var(--gold-light); font-weight:900; }
    .btn-logout { background:var(--red); color:#fff; border:none; padding:6px 12px; border-radius:8px; font-weight:bold; cursor:pointer; font-family:inherit; }
    
    .tabs { display:flex; gap:8px; overflow-x:auto; padding:15px; scrollbar-width:none; border-bottom:1px solid rgba(151,141,91,0.2); }
    .tabs::-webkit-scrollbar { display:none; }
    .tab-btn { padding:10px 18px; border-radius:20px; background:rgba(255,255,255,0.05); border:1px solid rgba(151,141,91,0.3); color:#fff; font-weight:bold; font-size:13px; cursor:pointer; white-space:nowrap; font-family:inherit; transition:0.3s; }
    .tab-btn.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }

    /* المحتوى */
    .content { padding:15px; max-width:800px; margin:0 auto; }
    .page { display:none; animation:fadeIn 0.3s; }
    .page.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    /* البطاقات */
    .card { background:rgba(255,255,255,0.03); border:1px solid rgba(151,141,91,0.2); border-radius:16px; padding:20px; margin-bottom:15px; backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(0,0,0,0.5); }
    .card h3 { color:var(--gold-light); font-size:15px; margin-bottom:15px; border-bottom:1px solid rgba(151,141,91,0.2); padding-bottom:10px; display:flex; align-items:center; gap:8px; }
    
    /* النماذج */
    .form-group { margin-bottom:12px; }
    .form-group label { display:block; font-size:12px; color:var(--gold-light); margin-bottom:6px; font-weight:bold; }
    input, select, textarea { width:100%; padding:14px; background:rgba(0,0,0,0.4); border:1px solid rgba(151,141,91,0.3); border-radius:10px; color:#fff; font-size:14px; font-family:inherit; outline:none; transition:0.3s; }
    input:focus, select:focus, textarea:focus { border-color:var(--gold); box-shadow:0 0 15px rgba(151,141,91,0.2); }
    select option { background:var(--bg); }
    
    .btn { width:100%; padding:14px; border-radius:10px; border:none; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit; transition:0.2s; display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:8px; }
    .btn:active { transform:scale(0.98); }
    .btn-gold { background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--bg); }
    .btn-red { background:linear-gradient(135deg, #e53935, #ff5252); color:#fff; }
    .btn-blue { background:linear-gradient(135deg, #29b6f6, #64b5f6); color:#fff; }
    .btn-green { background:linear-gradient(135deg, #43a047, #69f0ae); color:var(--bg); }
    .btn-small { padding:8px 12px; font-size:12px; width:auto; margin:0; }

    /* القوائم */
    .list-item { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.05); border-right:4px solid var(--gold); border-radius:10px; padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
    .list-info h4 { font-size:14px; color:var(--gold-light); margin-bottom:4px; }
    .list-info p { font-size:11px; color:rgba(255,255,255,0.6); }
    .list-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .icon-btn { width:32px; height:32px; border-radius:8px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
    .icon-btn.edit { background:rgba(41,182,246,0.2); color:#64b5f6; }
    .icon-btn.delete { background:rgba(229,57,53,0.2); color:#ff5252; }
    .icon-btn.print { background:rgba(171,71,188,0.2); color:#ce93d8; }
    .icon-btn.info { background:rgba(255,193,7,0.2); color:#ffd54f; }

    /* مؤشرات KPI */
    .kpi-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:15px; }
    .kpi-box { background:rgba(13,74,66,0.5); border:1px solid rgba(151,141,91,0.3); border-radius:12px; padding:15px; text-align:center; }
    .kpi-box .num { font-size:26px; font-weight:900; color:var(--gold-light); }
    .kpi-box .lbl { font-size:11px; color:rgba(255,255,255,0.6); margin-top:4px; }

    /* الدردشة */
    .chat-box { display:flex; flex-direction:column; height:400px; background:rgba(0,0,0,0.2); border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.1); }
    .chat-messages { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
    .msg { max-width:80%; padding:10px; border-radius:10px; font-size:13px; }
    .msg.mine { align-self:flex-end; background:var(--gold); color:var(--bg); }
    .msg.theirs { align-self:flex-start; background:rgba(255,255,255,0.1); color:#fff; }
    .msg .time { font-size:9px; opacity:0.6; margin-top:4px; display:block; }
    .chat-input { display:flex; padding:10px; background:rgba(0,0,0,0.3); border-top:1px solid rgba(255,255,255,0.1); }
    .chat-input input { flex:1; margin:0; border-radius:8px 0 0 8px; }
    .chat-input button { padding:0 15px; background:var(--gold); color:var(--bg); border:none; border-radius:0 8px 8px 0; font-weight:bold; cursor:pointer; }

    /* جدول الدوام */
    .duty-table { width:100%; border-collapse:collapse; margin-top:10px; }
    .duty-table th, .duty-table td { padding:8px; border:1px solid rgba(151,141,91,0.3); text-align:center; font-size:11px; }
    .duty-table th { background:rgba(13,74,66,0.8); color:var(--gold-light); }
    .duty-table td { background:rgba(0,0,0,0.3); color:#fff; }
    .duty-table select { margin:0; padding:6px; font-size:11px; }
</style>
</head>
<body>

<div class="topbar">
    <h1>🏛️ الإدارة العامة</h1>
    <button class="btn-logout" onclick="logout()">خروج</button>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard', this)">📊 الإحصائيات</button>
    <button class="tab-btn" onclick="switchTab('supervisors', this)">👨‍💼 المشرفون</button>
    <button class="tab-btn" onclick="switchTab('activities', this)">🚩 المتابعة</button>
    <button class="tab-btn" onclick="switchTab('duty', this)">📅 الدوام</button>
    <button class="tab-btn" onclick="switchTab('messages', this)">💬 الدردشة</button>
    <button class="tab-btn" onclick="switchTab('broadcasts', this)">📢 التعاميم</button>
</div>

<div class="content">

    <!-- 1. الإحصائيات -->
    <div class="page active" id="tab-dashboard">
        <div class="kpi-grid">
            <div class="kpi-box"><div class="num" id="kpiSups">0</div><div class="lbl">المشرفون</div></div>
            <div class="kpi-box"><div class="num" id="kpiIssues">0</div><div class="lbl">الإشكالات</div></div>
            <div class="kpi-box"><div class="num" id="kpiPraises">0</div><div class="lbl">الإشادات</div></div>
        </div>
        <div class="card">
            <h3>📊 نشاط المشرفين (آخر 7 أيام)</h3>
            <div id="activityChart" style="display:flex; align-items:flex-end; height:150px; gap:6px; padding:10px; border-bottom:2px solid var(--gold);"></div>
        </div>
    </div>

    <!-- 2. إدارة المشرفين -->
    <div class="page" id="tab-supervisors">
        <div class="card">
            <h3>➕ إضافة / تعديل مشرف</h3>
            <input type="hidden" id="editSupId" value="">
            <div class="form-group"><label>اسم المشرف</label><input type="text" id="supName" placeholder="مثال: أحمد المشرف"></div>
            <div class="form-group"><label>القطاع</label>
                <select id="supSector">
                    <option value="قطاع A">قطاع A</option>
                    <option value="قطاع B">قطاع B</option>
                </select>
            </div>
            <div class="form-group"><label>الهاتف</label><input type="tel" id="supPhone" placeholder="9XXXXXXX"></div>
            <div class="form-group"><label>الكود</label><input type="text" id="supCode" readonly style="text-align:center; color:var(--gold-light); font-weight:bold;"></div>
            <button class="btn btn-gold" onclick="saveSupervisor()">💾 حفظ</button>
            <button class="btn btn-blue" id="btnCancelSup" onclick="cancelEditSupervisor()" style="display:none;">إلغاء</button>
        </div>
        <div class="card">
            <h3>📋 المشرفون</h3>
            <button class="btn btn-green btn-small" style="margin-bottom:10px;" onclick="printPDF('supervisors')">🖨️ طباعة الكل</button>
            <div id="supervisorsList"></div>
        </div>
    </div>

    <!-- 3. المتابعة (الإشكالات والإشادات) -->
    <div class="page" id="tab-activities">
        <div class="card">
            <h3>🚩 آخر الإشكالات والإشادات</h3>
            <div id="activitiesList"></div>
        </div>
    </div>

    <!-- 4. جدول الدوام -->
    <div class="page" id="tab-duty">
        <div class="card">
            <h3>📅 توزيع المشرفين (القطاع A)</h3>
            <div id="dutyA"></div>
        </div>
        <div class="card">
            <h3>📅 توزيع المشرفين (القطاع B)</h3>
            <div id="dutyB"></div>
        </div>
    </div>

    <!-- 5. الدردشة -->
    <div class="page" id="tab-messages">
        <div class="card">
            <h3>💬 الدردشة مع المشرفين</h3>
            <div class="form-group">
                <select id="chatTarget" onchange="loadChat()">
                    <option value="">اختر المشرف...</option>
                </select>
            </div>
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
                    <button onclick="sendMsg()">📤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 6. التعاميم -->
    <div class="page" id="tab-broadcasts">
        <div class="card">
            <h3>📢 إرسال تعميم</h3>
            <input type="text" id="bTitle" placeholder="عنوان التعميم" style="margin-bottom:10px;">
            <textarea id="bDesc" rows="4" placeholder="نص التعميم..."></textarea>
            <button class="btn btn-gold" onclick="sendBroadcast()" style="margin-top:10px;">📤 إرسال</button>
        </div>
    </div>

</div>

<script>
    const FIREBASE_PROJECT = "ems-supervisor";
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

    const sessionStr = localStorage.getItem("amb_user") || sessionStorage.getItem("amb_user");
    if (!sessionStr) window.location.href = "index.html";
    let currentUser = JSON.parse(sessionStr);
    if (currentUser.type !== "admin") window.location.href = "index.html";

    let allSupervisors = [], allIssues = [], allPraises = [], allMessages = [];

    function logout() { localStorage.removeItem("amb_user"); sessionStorage.removeItem("amb_user"); window.location.href = "index.html"; }
    function getString(field) { return (field && field.stringValue) ? field.stringValue : ""; }
    function docToObj(doc) {
        const obj = {}; if (!doc.fields) return obj;
        for (const k in doc.fields) obj[k] = getString(doc.fields[k]);
        obj._id = doc.name.split("/").pop(); return obj;
    }
    function generateCode() { return "SUP-" + Math.floor(1000 + Math.random() * 9000); }

    function switchTab(id, btn) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.getElementById("tab-" + id).classList.add("active");
        btn.classList.add("active");
        if (id === 'dashboard') loadKPIs();
        else if (id === 'supervisors') loadSupervisors();
        else if (id === 'activities') loadActivities();
        else if (id === 'duty') loadDuty();
        else if (id === 'messages') loadChatTargets();
    }

    // تحميل الإحصائيات
    async function loadKPIs() {
        try {
            const [resSup, resIss, resPra] = await Promise.all([
                fetch(`${FIRESTORE_URL}/access_code?pageSize=1000`).then(r => r.json()),
                fetch(`${FIRESTORE_URL}/issues?pageSize=1000`).then(r => r.json()),
                fetch(`${FIRESTORE_URL}/praises?pageSize=1000`).then(r => r.json())
            ]);
            allSupervisors = resSup.documents ? resSup.documents.map(docToObj).filter(u => u.type === "supervisor") : [];
            allIssues = resIss.documents ? resIss.documents.map(docToObj) : [];
            allPraises = resPra.documents ? resPra.documents.map(docToObj) : [];

            document.getElementById("kpiSups").innerText = allSupervisors.length;
            document.getElementById("kpiIssues").innerText = allIssues.length;
            document.getElementById("kpiPraises").innerText = allPraises.length;

            // رسم بياني بسيط
            const days = [0,0,0,0,0,0,0];
            const now = new Date();
            [...allIssues, ...allPraises].forEach(item => {
                const d = new Date(item.timestamp);
                const diff = Math.floor((now - d) / 86400000);
                if (diff >= 0 && diff < 7) days[6-diff]++;
            });
            const chart = document.getElementById("activityChart");
            chart.innerHTML = days.map((count, i) => {
                const h = Math.max(10, (count / Math.max(...days, 1)) * 100);
                return `<div style="flex:1; display:flex; flex-direction:column; align-items:center;">
                    <div style="font-size:10px; color:var(--gold-light); margin-bottom:4px;">${count}</div>
                    <div style="width:100%; height:${h}%; background:linear-gradient(180deg, var(--gold-light), var(--gold)); border-radius:4px 4px 0 0;"></div>
                </div>`;
            }).join("");
        } catch(e) {}
    }

    // المشرفون
    async function loadSupervisors() {
        const el = document.getElementById("supervisorsList");
        if (allSupervisors.length === 0) { el.innerHTML = "<p style='text-align:center; color:#ccc;'>لا يوجد مشرفون.</p>"; return; }
        el.innerHTML = allSupervisors.map(u => `
            <div class="list-item">
                <div class="list-info">
                    <h4>👨‍💼 ${u.name}</h4>
                    <p>🏢 ${u.sector || "—"} | 📱 ${u.phone || "—"} | 🔑 ${u.code}</p>
                </div>
                <div class="list-actions">
                    <button class="icon-btn edit" onclick="editSupervisor('${u._id}', '${u.name}', '${u.sector}', '${u.phone}', '${u.code}')">✏️</button>
                    <button class="icon-btn delete" onclick="deleteSupervisor('${u._id}')">🗑️</button>
                </div>
            </div>
        `).join("");
    }

    function editSupervisor(id, name, sector, phone, code) {
        document.getElementById("editSupId").value = id;
        document.getElementById("supName").value = name;
        document.getElementById("supSector").value = sector;
        document.getElementById("supPhone").value = phone;
        document.getElementById("supCode").value = code;
        document.getElementById("btnCancelSup").style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEditSupervisor() {
        document.getElementById("editSupId").value = "";
        document.getElementById("supName").value = "";
        document.getElementById("supPhone").value = "";
        document.getElementById("supCode").value = generateCode();
        document.getElementById("btnCancelSup").style.display = "none";
    }

    async function saveSupervisor() {
        const id = document.getElementById("editSupId").value;
        const name = document.getElementById("supName").value.trim();
        const sector = document.getElementById("supSector").value;
        const phone = document.getElementById("supPhone").value.trim();
        let code = document.getElementById("supCode").value.trim();
        if (!name) { alert("أدخل اسم المشرف"); return; }
        if (!code) code = generateCode();

        const payload = { fields: { name: {stringValue:name}, sector: {stringValue:sector}, phone: {stringValue:phone}, code: {stringValue:code}, type: {stringValue:"supervisor"}, active: {booleanValue:true} } };

        if (id) await fetch(`${FIRESTORE_URL}/access_code/${id}`, { method: "PATCH", body: JSON.stringify(payload) });
        else await fetch(`${FIRESTORE_URL}/access_code`, { method: "POST", body: JSON.stringify(payload) });

        cancelEditSupervisor(); loadKPIs(); loadSupervisors();
    }

    async function deleteSupervisor(id) {
        if (!confirm("حذف المشرف؟")) return;
        await fetch(`${FIRESTORE_URL}/access_code/${id}`, { method: "DELETE" });
        loadKPIs(); loadSupervisors();
    }

    // المتابعة (الإشكالات والإشادات)
    async function loadActivities() {
        const el = document.getElementById("activitiesList");
        let all = [...allIssues, ...allPraises].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        if (all.length === 0) { el.innerHTML = "<p style='text-align:center; color:#ccc;'>لا توجد أنشطة.</p>"; return; }
        el.innerHTML = all.slice(0, 50).map(item => {
            const isPraise = item._collection === "praises" || item.type === "praise";
            return `
            <div class="list-item" style="border-right-color:${isPraise ? '#69f0ae' : '#ff5252'};">
                <div class="list-info">
                    <h4>${isPraise ? '⭐ إشادة' : '🚩 إشكالية'} — ${item.supervisor || "—"}</h4>
                    <p>${item.description || "—"}</p>
                    <p style="font-size:9px; opacity:0.5;">${new Date(item.timestamp).toLocaleString('ar-OM')}</p>
                </div>
                <div class="list-actions">
                    <button class="icon-btn delete" onclick="deleteActivity('${isPraise ? 'praises' : 'issues'}', '${item._id}')">🗑️</button>
                </div>
            </div>`;
        }).join("");
    }

    async function deleteActivity(col, id) {
        if (!confirm("حذف هذا السجل؟")) return;
        await fetch(`${FIRESTORE_URL}/${col}/${id}`, { method: "DELETE" });
        loadKPIs(); loadActivities();
    }

    // جدول الدوام
    function loadDuty() {
        const buildTable = (sector) => {
            const sups = allSupervisors.filter(s => s.sector === sector);
            return `
                <table class="duty-table">
                    <thead><tr><th>المشرف</th><th>الفترة</th></tr></thead>
                    <tbody>
                        ${sups.map(s => `<tr><td>${s.name}</td><td>${getShiftLabel(s.code)}</td></tr>`).join("")}
                    </tbody>
                </table>
            `;
        };
        document.getElementById("dutyA").innerHTML = buildTable("قطاع A");
        document.getElementById("dutyB").innerHTML = buildTable("قطاع B");
    }

    function getShiftLabel(code) {
        const shifts = JSON.parse(localStorage.getItem("duty_shifts") || "{}");
        return shifts[code] || "غير محدد";
    }

    // الدردشة
    function loadChatTargets() {
        const sel = document.getElementById("chatTarget");
        sel.innerHTML = '<option value="">اختر المشرف...</option>' + allSupervisors.map(s => `<option value="${s.code}">${s.name}</option>`).join("");
    }

    async function loadChat() {
        const target = document.getElementById("chatTarget").value;
        if (!target) return;
        const res = await fetch(`${FIRESTORE_URL}/chats?pageSize=100`, { cache: "no-store" });
        const data = await res.json();
        let msgs = data.documents ? data.documents.map(docToObj).filter(m => m.room === target) : [];
        msgs.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
        
        const el = document.getElementById("chatMessages");
        el.innerHTML = msgs.map(m => {
            const isMine = m.sender === "admin";
            return `<div class="msg ${isMine ? 'mine' : 'theirs'}">${m.text}<span class="time">${new Date(m.timestamp).toLocaleTimeString('ar-OM')}</span></div>`;
        }).join("");
        el.scrollTop = el.scrollHeight;
    }

    async function sendMsg() {
        const target = document.getElementById("chatTarget").value;
        const text = document.getElementById("chatInput").value.trim();
        if (!target || !text) return;
        const payload = { fields: { room: {stringValue:target}, sender: {stringValue:"admin"}, text: {stringValue:text}, timestamp: {stringValue:new Date().toISOString()} } };
        await fetch(`${FIRESTORE_URL}/chats`, { method: "POST", body: JSON.stringify(payload) });
        document.getElementById("chatInput").value = "";
        loadChat();
    }

    // التعاميم
    async function sendBroadcast() {
        const title = document.getElementById("bTitle").value.trim();
        const desc = document.getElementById("bDesc").value.trim();
        if (!title || !desc) { alert("أدخل العنوان والنص"); return; }
        const payload = { fields: { title: {stringValue:title}, description: {stringValue:desc}, sender: {stringValue:"الإدارة"}, timestamp: {stringValue:new Date().toISOString()} } };
        await fetch(`${FIRESTORE_URL}/broadcasts`, { method: "POST", body: JSON.stringify(payload) });
        document.getElementById("bTitle").value = "";
        document.getElementById("bDesc").value = "";
        alert("✅ تم إرسال التعميم");
    }

    // طباعة PDF
    function printPDF(type) {
        const win = window.open("", "_blank");
        win.document.write(`<html dir="rtl"><body style="font-family:Cairo; padding:20px;">
            <h1 style="text-align:center; color:#1e4620;">قائمة المشرفين</h1>
            <table border="1" style="width:100%; border-collapse:collapse; margin-top:20px;">
                <tr style="background:#1e4620; color:#fff;"><th>الاسم</th><th>القطاع</th><th>الكود</th></tr>
                ${allSupervisors.map(s => `<tr><td>${s.name}</td><td>${s.sector}</td><td>${s.code}</td></tr>`).join("")}
            </table>
        </body></html>`);
        win.document.close();
        setTimeout(() => { win.print(); win.close(); }, 500);
    }

    window.onload = function() { 
        document.getElementById("supCode").value = generateCode();
        loadKPIs(); 
    };
</script>
