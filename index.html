<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#041814">
<title>نظام الإسعاف الذكي — البوابة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; -webkit-tap-highlight-color:transparent; }
    :root { 
        --gold:#978d5b; /* لون الهوية */
        --gold-light:#d4c896; 
        --green:#0d4a42; 
        --bg:#041814; 
        --red:#e53935; 
    }
    body { background:var(--bg); color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; overflow-x:hidden; }
    
    /* الخلفية السحرية */
    body::before {
        content:''; position:fixed; inset:0; z-index:-2;
        background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), 
                    radial-gradient(circle at 85% 90%, rgba(13,74,66,0.6) 0%, transparent 50%), 
                    linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%);
    }
    .stars { position:fixed; inset:0; z-index:-1; pointer-events:none; }
    .star { position:absolute; width:2px; height:2px; background:var(--gold-light); border-radius:50%; opacity:0.4; animation:twinkle 4s infinite; }
    @keyframes twinkle { 0%,100%{opacity:0.2; transform:scale(0.8);} 50%{opacity:0.9; transform:scale(1.4);} }

    /* شاشة التحميل */
    #loadingScreen { position:fixed; inset:0; z-index:9999; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.5s; }
    .loading-logo { width:120px; height:120px; border-radius:24px; border:3px solid var(--gold); padding:5px; filter:drop-shadow(0 0 30px rgba(151,141,91,0.8)); animation:float 2s infinite; }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }

    /* الهيدر */
    .header { text-align:center; margin-top:20px; margin-bottom:30px; z-index:1; }
    .logo-wrap { position:relative; display:inline-block; }
    .logo { width:110px; height:110px; border-radius:22px; border:2px solid var(--gold); background:var(--green); padding:5px; animation:float 3s infinite; object-fit: contain; }
    h1 { color:var(--gold-light); font-size:24px; margin-top:15px; font-weight:900; text-shadow:0 0 20px rgba(151,141,91,0.5); }
    .subtitle { color:rgba(255,255,255,0.6); font-size:12px; letter-spacing:2px; margin-top:5px; }

    /* صندوق الدخول الزجاجي */
    .login-box { width:100%; max-width:400px; background:rgba(13,74,66,0.4); backdrop-filter:blur(20px); padding:30px 25px; border-radius:24px; border:1px solid rgba(151,141,91,0.3); box-shadow:0 20px 50px rgba(0,0,0,0.6); margin-bottom:25px; z-index:1; }
    input { width:100%; padding:18px; background:rgba(4,24,20,0.8); border:2px solid rgba(151,141,91,0.3); border-radius:16px; color:var(--gold-light); font-size:22px; text-align:center; font-weight:900; outline:none; text-transform:uppercase; letter-spacing:3px; margin-bottom:20px; transition:0.3s; }
    input:focus { border-color:var(--gold); box-shadow:0 0 25px rgba(151,141,91,0.4); }
    .btn-login { width:100%; padding:18px; border-radius:16px; border:none; font-size:17px; font-weight:900; cursor:pointer; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--bg); display:flex; justify-content:center; align-items:center; gap:10px; transition:0.3s; box-shadow:0 10px 25px rgba(151,141,91,0.3); }
    .btn-login:active { transform:scale(0.97); }
    .msg { text-align:center; font-size:13px; font-weight:bold; margin-top:15px; min-height:20px; color:var(--red); }
    
    /* الإحصائيات */
    .stats-container { width:100%; max-width:400px; z-index:1; }
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .stat-card { background:rgba(255,255,255,0.03); backdrop-filter:blur(10px); border:1px solid rgba(151,141,91,0.15); padding:18px 15px; border-radius:16px; text-align:center; }
    .stat-card .num { font-size:28px; font-weight:900; color:var(--gold-light); line-height:1; }
    .stat-card .lbl { font-size:11px; color:rgba(255,255,255,0.6); margin-top:6px; }

    /* نجوم الشهر */
    .section-title { display:flex; justify-content:center; align-items:center; gap:10px; color:var(--gold-light); font-size:15px; font-weight:900; margin:25px 0 15px; width:100%; max-width:400px; }
    .section-title::before, .section-title::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(151,141,91,0.3), transparent); }
    .star-card { display:grid; grid-template-columns:60px 1fr auto; gap:12px; align-items:center; background:rgba(255,255,255,0.03); border:1px solid rgba(151,141,91,0.2); border-radius:16px; padding:12px; margin-bottom:10px; width:100%; max-width:400px; }
    .star-photo { width:60px; height:60px; border-radius:12px; border:2px solid var(--gold); background:var(--green); display:flex; align-items:center; justify-content:center; font-size:24px; object-fit:cover; }
    .star-name { font-size:14px; font-weight:900; color:var(--gold-light); }
    .star-role { font-size:11px; color:rgba(255,255,255,0.6); margin-top:2px; }
    .star-badge { font-size:28px; filter:drop-shadow(0 0 10px var(--gold)); }

    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
    <div id="loadingScreen">
        <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="loading-logo">
        <h1 style="color:var(--gold); margin-top:20px;">جاري التحميل...</h1>
    </div>

    <div class="stars" id="starsContainer"></div>

    <div class="header">
        <div class="logo-wrap">
            <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="logo">
        </div>
        <h1>نظام الإسعاف الذكي</h1>
        <div class="subtitle">هيئة الدفاع المدني والإسعاف</div>
    </div>

    <div class="login-box">
        <h3 style="color:var(--gold-light); text-align:center; margin-bottom:20px; font-size:15px;">🔐 بوابة الدخول الموحدة</h3>
        <input type="text" id="codeInput" placeholder="أدخل الكود الخاص بك">
        <button class="btn-login" id="loginBtn" onclick="login()">
            <span>🔓 دخول النظام</span>
        </button>
        <div id="msgBox" class="msg"></div>
    </div>

    <div class="stats-container">
        <div class="stats-grid">
            <div class="stat-card"><div class="num" id="statIssues">0</div><div class="lbl">إشكالية ميدانية</div></div>
            <div class="stat-card"><div class="num" id="statVisits">0</div><div class="lbl">تقرير زيارة</div></div>
            <div class="stat-card"><div class="num" id="statUsers">0</div><div class="lbl">مستخدم مسجل</div></div>
            <div class="stat-card"><div class="num" id="statBroadcasts">0</div><div class="lbl">تعميم مرسل</div></div>
        </div>
    </div>

    <div class="section-title">🌟 نجوم الشهر</div>
    <div id="starsMonthList" style="width:100%; max-width:400px;">
        <div style="text-align:center; font-size:12px; color:rgba(255,255,255,0.5); padding:20px;">جاري التحميل...</div>
    </div>

<script>
    // ⚠️ تم تثبيت اسم المشروع الجديد والمجموعة بدون حرف S
    const FIREBASE_PROJECT = "ems-supervisor"; 
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

    // إنشاء النجوم
    const starsContainer = document.getElementById("starsContainer");
    for(let i=0; i<50; i++) {
        let s = document.createElement("div");
        s.className = "star";
        s.style.left = Math.random()*100 + "%";
        s.style.top = Math.random()*100 + "%";
        s.style.animationDelay = (Math.random()*4) + "s";
        starsContainer.appendChild(s);
    }

    // إخفاء شاشة التحميل
    setTimeout(() => {
        let ls = document.getElementById("loadingScreen");
        ls.style.opacity = "0";
        setTimeout(() => ls.remove(), 500);
    }, 1000);

    // دوال مساعدة
    function getString(field) { return (field && field.stringValue) ? field.stringValue : ""; }
    function docToObj(doc) {
        const obj = {}; if (!doc.fields) return obj;
        for (const k in doc.fields) obj[k] = getString(doc.fields[k]);
        obj._id = doc.name.split("/").pop(); return obj;
    }

    // تسجيل الدخول
    async function login() {
        const code = document.getElementById("codeInput").value.trim().toUpperCase();
        const msg = document.getElementById("msgBox");
        const btn = document.getElementById("loginBtn");
        
        if (!code) { msg.innerText = "⚠️ أدخل الكود"; return; }
        
        btn.innerHTML = "⏳ جاري التحقق..."; btn.disabled = true; msg.innerText = "";
        
        try {
            // القراءة من access_code (بدون S)
            const res = await fetch(`${FIRESTORE_URL}/access_code?pageSize=1000`, { cache: "no-store" });
            const data = await res.json();
            
            let foundUser = null;
            if (data.documents) {
                for (let doc of data.documents) {
                    const docCode = getString(doc.fields.code).toUpperCase();
                    if (docCode === code) {
                        foundUser = docToObj(doc);
                        break;
                    }
                }
            }
            
            if (!foundUser) { 
                msg.innerText = "❌ الكود غير صحيح"; 
                btn.innerHTML = "<span>🔓 دخول النظام</span>"; btn.disabled = false; return; 
            }
            
            if (foundUser.active === false || foundUser.active === "false") {
                msg.innerText = "⚠️ هذا الحساب معطل حالياً"; 
                btn.innerHTML = "<span>🔓 دخول النظام</span>"; btn.disabled = false; return; 
            }
            
            // حفظ الجلسة
            const sessionData = JSON.stringify(foundUser);
            localStorage.setItem("amb_user", sessionData);
            sessionStorage.setItem("amb_user", sessionData);
            
            msg.style.color = "#69f0ae"; msg.innerText = "✅ تم الدخول بنجاح";
            
            setTimeout(() => {
                if (foundUser.type === "admin") window.location.href = "admin.html";
                else if (foundUser.type === "ops") window.location.href = "ops.html";
                else window.location.href = "app.html";
            }, 500);

        } catch(e) { 
            msg.innerText = "⚠️ خطأ في الاتصال"; 
            btn.innerHTML = "<span>🔓 دخول النظام</span>"; btn.disabled = false; 
        }
    }

    // تحميل الإحصائيات
    async function loadStats() {
        try {
            const [resUsers, resActs, resBroadcasts] = await Promise.all([
                fetch(`${FIRESTORE_URL}/access_code?pageSize=1000`).then(r => r.json()),
                fetch(`${FIRESTORE_URL}/activities?pageSize=1000`).then(r => r.json()),
                fetch(`${FIRESTORE_URL}/broadcasts?pageSize=1000`).then(r => r.json())
            ]);

            if (resUsers.documents) document.getElementById("statUsers").innerText = resUsers.documents.length;
            if (resBroadcasts.documents) document.getElementById("statBroadcasts").innerText = resBroadcasts.documents.length;
            
            let issues = 0, visits = 0;
            if (resActs.documents) {
                resActs.documents.forEach(d => {
                    const t = getString(d.fields.type);
                    if (t === 'issue') issues++;
                    if (t === 'visit') visits++;
                });
            }
            document.getElementById("statIssues").innerText = issues;
            document.getElementById("statVisits").innerText = visits;

        } catch(e) { console.log("Stats error"); }
    }

    // تحميل نجوم الشهر
    async function loadFeatured() {
        const el = document.getElementById("starsMonthList");
        try {
            const res = await fetch(`${FIRESTORE_URL}/featured?pageSize=100`, { cache: "no-store" });
            const data = await res.json();
            
            const d = new Date();
            const month = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
            
            let docs = data.documents ? data.documents.map(docToObj) : [];
            let list = docs.filter(f => f.month === month).sort((a, b) => (parseInt(b.score) || 0) - (parseInt(a.score) || 0)).slice(0, 3);
            
            if (list.length === 0) {
                el.innerHTML = '<div style="text-align:center; font-size:12px; color:rgba(255,255,255,0.5); padding:20px;">لا يوجد متميزون هذا الشهر</div>';
                return;
            }
            
            el.innerHTML = list.map((f, idx) => {
                const badge = idx === 0 ? "🥇" : idx === 1 ? "🥈" : "🥉";
                return `
                    <div class="star-card">
                        ${f.photoUrl ? `<img src="${f.photoUrl}" class="star-photo">` : `<div class="star-photo">👤</div>`}
                        <div>
                            <div class="star-name">${f.name || "—"}</div>
                            <div class="star-role">${f.role || ""} ${f.centerName ? "• " + f.centerName : ""}</div>
                        </div>
                        <div class="star-badge">${badge}</div>
                    </div>
                `;
            }).join("");
        } catch(e) { 
            el.innerHTML = '<div style="text-align:center; font-size:12px; color:#ff5252;">خطأ في التحميل</div>'; 
        }
    }

    window.onload = function() {
        document.getElementById("codeInput").addEventListener("keypress", e => { if (e.key === "Enter") login(); });
        loadStats();
        loadFeatured();
    };
</script>
</body>
</html>
