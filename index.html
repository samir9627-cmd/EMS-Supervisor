<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة العامة</title>
    
    <!-- مكتبات تصدير الإكسل و PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- رابط ملف التطبيق (PWA) -->
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- القائمة العلوية -->
    <header class="top-bar no-print">
        <div class="logo">
            <img src="https://via.placeholder.com/40" alt="Logo"> <!-- ضع شعارك هنا -->
            <span>الإدارة العامة</span>
        </div>
        <div class="controls">
            <button onclick="toggleDarkMode()" class="btn-icon">🌙</button>
            <button onclick="installPWA()" class="btn-icon" id="installBtn" style="display:none;">📥 تثبيت التطبيق</button>
            <button onclick="window.print()" class="btn-icon">🖨️ طباعة</button>
        </div>
    </header>

    <!-- التبويبات -->
    <nav class="tabs no-print">
        <button class="tab active" onclick="openTab('reports')">التقارير 📈</button>
        <button class="tab" onclick="openTab('admin')">لوحة التحكم ⚙️</button>
    </nav>

    <!-- قسم التقارير (الجدول) -->
    <section id="reports" class="tab-content active">
        <div class="report-header">
            <h2>تقرير الشهر الحالي</h2>
            <div class="export-btns no-print">
                <button onclick="exportExcel()" class="btn btn-success">تصدير Excel 📊</button>
                <button onclick="exportPDF()" class="btn btn-danger">تصدير PDF 📄</button>
            </div>
        </div>

        <div class="table-container">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th>اليوم</th>
                        <th>التاريخ</th>
                        <th>المشرف</th>
                        <th>نوع الإشكالية</th>
                        <th>ملاحظات</th>
                        <th>الإشادة</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- سيتم توليد الصفوف هنا برمجياً -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- قسم لوحة التحكم (إضافة، تعديل، حذف) -->
    <section id="admin" class="tab-content">
        <div class="admin-panel">
            <h2>إضافة / تعديل البيانات</h2>
            <form id="dataForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>اسم المشرف:</label>
                    <input type="text" id="supervisorName" required>
                </div>
                <div class="form-group">
                    <label>نوع الإشكالية:</label>
                    <select id="issueType">
                        <option value="">لا يوجد</option>
                        <option value="تقني">تقني</option>
                        <option value="إداري">إداري</option>
                        <option value="سلوكي">سلوكي</option>
                        <option value="طارئ">طارئ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الإشادة:</label>
                    <select id="commendationType">
                        <option value="">لا يوجد</option>
                        <option value="تميز في الأداء">تميز في الأداء</option>
                        <option value="تعاون متميز">تعاون متميز</option>
                        <option value="مبادرة">مبادرة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ملاحظات:</label>
                    <textarea id="notes"></textarea>
                </div>
                <div class="form-group">
                    <label>التاريخ:</label>
                    <input type="date" id="recordDate" required>
                </div>
                <button type="submit" class="btn btn-primary">حفظ البيانات</button>
            </form>
        </div>

        <div class="records-list">
            <h2>سجل البيانات</h2>
            <ul id="recordsList">
                <!-- سيتم عرض السجلات هنا مع أزرار التعديل والحذف -->
            </ul>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
