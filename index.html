<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام الإسعاف الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
    body { background:#041814; color:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .logo { width:120px; height:120px; border-radius:20px; border:3px solid #c9a227; margin-bottom:20px; }
    input { width:80%; max-width:300px; padding:15px; border-radius:10px; border:1px solid #c9a227; text-align:center; font-size:20px; margin-bottom:10px; }
    button { width:80%; max-width:300px; padding:15px; border-radius:10px; border:none; background:#c9a227; color:#000; font-weight:bold; font-size:16px; cursor:pointer; }
    .msg { margin-top:10px; color:red; font-size:14px; text-align:center; max-width:90%; }
</style>
</head>
<body>
    <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="logo">
    <h2 style="color:#c9a227; margin-bottom:20px;">نظام الإسعاف الذكي</h2>
    <input type="text" id="codeInput" placeholder="أدخل الكود">
    <button id="loginBtn" onclick="login()">دخول</button>
    <div id="msgBox" class="msg"></div>

<script>
    const FIREBASE_PROJECT = "ems-supervisor";
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

    async function login() {
        const code = document.getElementById("codeInput").value.trim().toUpperCase();
        const msg = document.getElementById("msgBox");
        const btn = document.getElementById("loginBtn");
        
        if (!code) { msg.innerText = "أدخل الكود"; return; }
        btn.innerText = "جاري التحقق...";
        
        try {
            const res = await fetch(`${FIRESTORE_URL}/access_code?pageSize=1000`, { cache: "no-store" });
            const data = await res.json();
            
            let foundUser = null;
            if (data.documents) {
                for (let doc of data.documents) {
                    if (doc.fields && doc.fields.code && doc.fields.code.stringValue.toUpperCase() === code) {
                        foundUser = {
                            name: doc.fields.name ? doc.fields.name.stringValue : "مستخدم",
                            type: doc.fields.type ? doc.fields.type.stringValue : "supervisor",
                            code: code
                        };
                        break;
                    }
                }
            }
            
            if (!foundUser) { msg.innerText = "❌ الكود غير صحيح"; btn.innerText = "دخول"; return; }
            
            // حفظ الجلسة بشكل موحد
            localStorage.setItem("amb_session", JSON.stringify(foundUser));
            
            // التوجيه
            if (foundUser.type === "admin") window.location.href = "admin.html";
            else if (foundUser.type === "ops") window.location.href = "ops.html";
            else window.location.href = "app.html";

        } catch(e) { msg.innerText = "خطأ في الشبكة"; btn.innerText = "دخول"; }
    }
</script>
</body>
</html>
