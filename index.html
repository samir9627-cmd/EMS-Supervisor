<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041814">
<title>الإدارة العامة — غرفة التحكم v100.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal',sans-serif; }
:root { --gold:#978d5b; --gold-light:#d4c896; --gold-bright:#e8dcaf; --teal:#0d4a42; --teal-dark:#082b26; --teal-deep:#041814; --green:#43a047; --green-light:#69f0ae; --red:#e53935; --red-light:#ff5252; --amber:#fb8c00; --amber-light:#ffa726; --blue:#29b6f6; --blue-light:#64b5f6; --purple:#ab47bc; --surface:rgba(13,74,66,0.55); --border:rgba(151,141,91,0.3); --safe-top:env(safe-area-inset-top, 0px); --safe-bottom:env(safe-area-inset-bottom, 0px); }
html, body { background:var(--teal-deep); color:#fff; font-weight:600; overflow-x:hidden; }
body { min-height:100vh; padding-bottom:calc(88px + var(--safe-bottom)); }
body::before { content:''; position:fixed; inset:0; z-index:-1; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), radial-gradient(circle at 85% 90%, rgba(13,74,66,0.6) 0%, transparent 50%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes spin { to { transform:rotate(360deg); } }
#mainApp { display:none; } #mainApp.ready { display:block; }
.topbar { position:sticky; top:0; z-index:100; padding:calc(12px + var(--safe-top)) 16px 12px; background:linear-gradient(135deg, rgba(4,24,20,0.98), rgba(13,74,66,0.95)); border-bottom:2px solid var(--gold); backdrop-filter:blur(20px); display:flex; align-items:center; gap:8px; }
.topbar-logo { width:44px; height:44px; border-radius:12px; object-fit:contain; }
.topbar-info { flex:1; }
.topbar-info h1 { font-size:13px; color:var(--gold-light); font-weight:900; }
.topbar-info p { font-size:10px; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:6px; margin-top:3px; }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--green-light); }
.icon-btn { width:42px; height:42px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.icon-btn.danger { background:rgba(198,40,40,0.4); border-color:var(--red-light); }
.tabs-bar { position:sticky; top:calc(74px + var(--safe-top)); z-index:98; background:rgba(4,24,20,0.95); border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
.tabs-bar::-webkit-scrollbar { display:none; }
.tabs-scroll { display:flex; gap:6px; padding:10px 12px; min-width:min-content; }
.tab-btn { flex-shrink:0; padding:9px 16px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:22px; color:rgba(255,255,255,0.75); font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.tab-btn.active { background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); border-color:var(--gold); }
.page { display:none; padding:16px; max-width:900px; margin:0 auto; }
.page.active { display:block; animation:slideUp 0.35s; }
.card { background:linear-gradient(145deg, var(--surface), rgba(4,24,20,0.9)); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; }
.card-title { font-size:14px; color:var(--gold-light); font-weight:900; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid rgba(151,141,91,0.15); display:flex; align-items:center; gap:8px; }
.stats-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:14px; }
.stats-grid.four { grid-template-columns:repeat(2, 1fr); }
@media (min-width:600px) { .stats-grid.four { grid-template-columns:repeat(4, 1fr); } }
.stat-mini { background:linear-gradient(145deg, rgba(4,24,20,0.75), rgba(13,74,66,0.4)); border:1px solid var(--border); border-radius:16px; padding:16px 14px; position:relative; overflow:hidden; }
.stat-mini .stat-icon { position:absolute; top:10px; left:10px; font-size:26px; opacity:0.35; }
.stat-mini .num { font-size:26px; font-weight:900; color:var(--gold-light); line-height:1; }
.stat-mini .lbl { font-size:11px; color:rgba(255,255,255,0.7); margin-top:5px; }
.btn { padding:12px 16px; border:none; border-radius:12px; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); font-size:13px; font-weight:900; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn.secondary { background:rgba(255,255,255,0.08); color:#fff; border:1px solid var(--border); }
.btn.danger { background:linear-gradient(135deg, var(--red), var(--red-light)); color:#fff; }
.btn.info { background:linear-gradient(135deg, var(--blue), var(--blue-light)); color:#fff; }
.btn.success { background:linear-gradient(135deg, var(--green), var(--green-light)); color:#041814; }
.btn.small { padding:8px 14px; font-size:11px; }
.btn.block { width:100%; }
input, select, textarea { width:100%; padding:12px 14px; background:rgba(4,24,20,0.7); border:1px solid var(--border); border-radius:11px; color:#fff; font-size:13px; font-weight:600; outline:none; margin-bottom:12px; }
input:focus, textarea:focus, select:focus { border-color:var(--gold); }
select option { background:var(--teal-deep); color:#fff; }
label { display:block; font-size:12px; color:rgba(255,255,255,0.85); font-weight:700; margin-bottom:7px; }
.item-card { background:linear-gradient(145deg, rgba(13,74,66,0.6), rgba(4,24,20,0.9)); border:1px solid var(--border); border-right:4px solid var(--gold); border-radius:14px; padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.item-card.blue { border-right-color:var(--blue); } .item-card.green { border-right-color:var(--green-light); } .item-card.red { border-right-color:var(--red); } .item-card.amber { border-right-color:var(--amber); }
.item-info { flex:1; min-width:0; }
.item-info h4 { font-size:14px; font-weight:900; color:var(--gold-light); margin-bottom:4px; }
.item-info p { font-size:11px; color:rgba(255,255,255,0.65); line-height:1.6; }
.item-actions { display:flex; gap:6px; }
.icon-btn-sm { width:32px; height:32px; border-radius:8px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
.icon-btn-sm.edit { background:rgba(41,182,246,0.2); color:#64b5f6; } .icon-btn-sm.delete { background:rgba(229,57,53,0.2); color:#ff5252; } .icon-btn-sm.copy { background:rgba(151,141,91,0.2); color:var(--gold-light); }
.empty { text-align:center; padding:40px 20px; color:rgba(255,255,255,0.4); font-size:13px; }
.empty .icon { font-size:52px; display:block; margin-bottom:12px; opacity:0.5; }
.modal-overlay { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); display:none; align-items:flex-end; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-sheet { background:linear-gradient(145deg, var(--teal), var(--teal-dark)); border-top-left-radius:26px; border-top-right-radius:26px; border-top:3px solid var(--gold); width:100%; max-width:780px; max-height:92vh; padding:24px 18px calc(24px + var(--safe-bottom)); overflow-y:auto; animation:slideUp 0.35s; }
.modal-sheet::before { content:''; display:block; width:42px; height:4px; background:rgba(255,255,255,0.3); border-radius:3px; margin:-12px auto 16px; }
.modal-sheet h3 { color:var(--gold-light); font-size:17px; font-weight:900; text-align:center; padding-bottom:14px; border-bottom:1px solid rgba(151,141,91,0.2); margin-bottom:18px; }
.toast-container { position:fixed; top:90px; left:50%; transform:translateX(-50%); z-index:3000; display:flex; flex-direction:column; gap:8px; pointer-events:none; width:calc(100% - 32px); max-width:420px; }
.toast { background:linear-gradient(135deg, var(--teal), var(--teal-dark)); color:#fff; padding:12px 18px; border-radius:12px; border:1px solid var(--gold); font-size:13px; font-weight:700; box-shadow:0 10px 30px rgba(0,0,0,0.6); }
.toast.success { border-color:var(--green-light); } .toast.danger { border-color:var(--red-light); }
.warning-bar { padding:10px 14px; background:linear-gradient(90deg, rgba(251,140,0,0.2), rgba(251,140,0,0.05)); border-right:4px solid var(--amber); border-radius:10px; font-size:12px; color:#ffcc80; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
#loadingOverlay { position:fixed; inset:0; z-index:9999; background:var(--teal-deep); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.spinner { width:40px; height:40px; border:4px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 1s linear infinite; margin-bottom:16px; }
</style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="color:var(--gold-light); font-weight:900;">جاري التحقق من الصلاحيات...</div>
</div>

<div id="mainApp">
  <div class="topbar">
    <div class="topbar-logo" style="display:flex; align-items:center; justify-content:center; font-size:24px;">🚑</div>
    <div class="topbar-info">
      <h1>الإدارة العامة</h1>
      <p><span class="status-dot"></span><span id="currentUser">جاري التحميل...</span></p>
    </div>
    <button class="icon-btn" onclick="manualRefresh()">🔄</button>
    <button class="icon-btn danger" onclick="confirmLogout()">🚪</button>
  </div>

  <div class="tabs-bar">
    <div class="tabs-scroll">
      <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 لوحة القيادة</button>
      <button class="tab-btn" data-tab="supervisors" onclick="switchTab('supervisors')">👨‍💼 المشرفون</button>
      <button class="tab-btn" data-tab="paramedics" onclick="switchTab('paramedics')">👨‍🚒 المسعفون</button>
      <button class="tab-btn" data-tab="vehicles" onclick="switchTab('vehicles')">🚑 المركبات</button>
      <button class="tab-btn" data-tab="broadcasts" onclick="switchTab('broadcasts')">📢 التعاميم</button>
    </div>
  </div>

  <div class="page active" id="page-dashboard">
    <div class="stats-grid four">
      <div class="stat-mini blue"><span class="stat-icon">👨‍💼</span><div class="num" id="dashSups">0</div><div class="lbl">المشرفون</div></div>
      <div class="stat-mini green"><span class="stat-icon">👨‍🚒</span><div class="num" id="dashParams">0</div><div class="lbl">المسعفون</div></div>
      <div class="stat-mini amber"><span class="stat-icon">🚑</span><div class="num" id="dashVehicles">0</div><div class="lbl">المركبات</div></div>
      <div class="stat-mini red"><span class="stat-icon">🚩</span><div class="num" id="dashIssues">0</div><div class="lbl">الإشكالات</div></div>
    </div>
  </div>

  <div class="page" id="page-supervisors">
    <div class="card">
      <div class="card-title">➕ إضافة / تعديل مشرف</div>
      <label>الاسم *</label><input type="text" id="supName">
      <label>القطاع</label><select id="supSector"><option>قطاع A</option><option>قطاع B</option></select>
      <label>الهاتف</label><input type="tel" id="supPhone">
      <label>الكود (تلقائي)</label><input type="text" id="supCode" readonly style="text-align:center;font-weight:bold;color:var(--gold-light);">
      <button class="btn block" onclick="saveSupervisor()" id="btnSaveSup">💾 حفظ وإنشاء حساب</button>
    </div>
    <div class="card">
      <div class="card-title">📋 المشرفون <span style="margin-right:auto;background:var(--gold);color:var(--teal-deep);padding:2px 10px;border-radius:12px;font-size:11px;font-weight:900;" id="supervisorsCount">0</span></div>
      <div id="supervisorsList"><div class="empty"><span class="icon">👨‍💼</span>جاري التحميل...</div></div>
    </div>
  </div>

  <div class="page" id="page-paramedics">
    <div class="card">
      <div class="card-title">➕ إضافة مسعف</div>
      <label>الاسم *</label><input type="text" id="pmName">
      <label>المركز</label><select id="pmCenter"></select>
      <label>الرتبة</label><input type="text" id="pmRank">
      <button class="btn block" onclick="saveParamedic()">💾 حفظ</button>
    </div>
    <div class="card"><div class="card-title">📋 المسعفون</div><div id="paramedicsList"></div></div>
  </div>

  <div class="page" id="page-vehicles">
    <div class="card">
      <div class="card-title">➕ إضافة مركبة</div>
      <label>اللوحة *</label><input type="text" id="vPlate">
      <label>النوع</label><input type="text" id="vType">
      <label>المركز</label><select id="vCenter"></select>
      <button class="btn block" onclick="saveVehicle()">💾 حفظ</button>
    </div>
    <div class="card"><div class="card-title">📋 المركبات</div><div id="vehiclesList"></div></div>
  </div>

  <div class="page" id="page-broadcasts">
    <div class="card">
      <div class="card-title">📢 إرسال تعميم</div>
      <label>العنوان</label><input type="text" id="bTitle">
      <label>النص</label><textarea id="bDesc" rows="3"></textarea>
      <button class="btn block" onclick="sendBroadcast()">📤 إرسال</button>
    </div>
    <div class="card"><div class="card-title">📜 التعاميم السابقة</div><div id="broadcastsList"></div></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet"><h3 id="modalTitle">تفاصيل</h3><div id="modalBody"></div></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyC3m9o6Qx7m6r1b08DZIkyttArIihZL8n8", authDomain: "ems-supervisor.firebaseapp.com", projectId: "ems-supervisor", storageBucket: "ems-supervisor.firebasestorage.app", messagingSenderId: "230655268524", appId: "1:230655268524:web:5043a458af3d79989ff109" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const INTERNAL_SECRET = "EMS_SECRET_PASSWORD_2026!";
    const CENTERS_LIST = ["مركز إسعاف دارسيت","مركز إسعاف بوشر","مركز إسعاف العامرات","مركز إسعاف قريات","مركز إسعاف الخوض 1","مركز إسعاف الخوض 2","مركز إسعاف العذيبة","مركز إسعاف الرسيل"];

    let adminUser = null;
    let allSupervisors = [], allParameds = [], allVehicles = [], allIssues = [], allPraises = [], allBroadcasts = [];
    let currentTab = "dashboard";

    function esc(s) { if (s === null || s === undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
    function showToast(msg, type="success") { const c = document.getElementById("toastContainer"); const t = document.createElement("div"); t.className = "toast " + type; t.textContent = (type==="success"?"✅ ":type==="danger"?"⚠️ ":"ℹ️ ") + msg; c.appendChild(t); setTimeout(() => t.remove(), 2800); }
    function generateCode() { return "SUP-" + Math.floor(1000 + Math.random() * 9000); }
    async function fsList(colName) { const snapshot = await getDocs(collection(db, colName)); return snapshot.docs.map(d => ({ _id: d.id, ...d.data() })); }

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "./index.html"; return; }
        const code = user.email.split('@')[0].toUpperCase();
        if (!code.startsWith("ADM")) { await signOut(auth); window.location.href = "./index.html"; return; }

        adminUser = { code, email: user.email };
        document.getElementById("currentUser").textContent = "المدير العام (" + code + ")";
        document.getElementById("supCode").value = generateCode();
        ["pmCenter", "vCenter"].forEach(id => { const sel = document.getElementById(id); if (sel) sel.innerHTML = CENTERS_LIST.map(c => `<option>${c}</option>`).join(""); });
        document.getElementById("loadingOverlay").style.display = "none";
        document.getElementById("mainApp").classList.add("ready");
        syncAll();
    });

    async function syncAll() {
        try {
            allSupervisors = await fsList("access_code").then(l => l.filter(u => u.type === "supervisor"));
            allParameds = await fsList("paramedics").catch(() => []);
            allVehicles = await fsList("vehicles").catch(() => []);
            allIssues = await fsList("issues").catch(() => []);
            allPraises = await fsList("praises").catch(() => []);
            allBroadcasts = await fsList("broadcasts").catch(() => []);
            renderCurrentTab();
        } catch(e) { showToast("فشل تحديث البيانات. تحقق من القواعد (Rules)", "danger"); }
    }

    window.switchTab = function(id) {
        currentTab = id;
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.getElementById("page-" + id).classList.add("active");
        document.querySelector(`.tab-btn[data-tab="${id}"]`).classList.add("active");
        window.scrollTo({top:0,behavior:"smooth"}); renderCurrentTab();
    };

    function renderCurrentTab() {
        if (currentTab === "dashboard") {
            document.getElementById("dashSups").textContent = allSupervisors.length;
            document.getElementById("dashParams").textContent = allParameds.length;
            document.getElementById("dashVehicles").textContent = allVehicles.length;
            document.getElementById("dashIssues").textContent = allIssues.length;
        }
        else if (currentTab === "supervisors") {
            document.getElementById("supervisorsCount").textContent = allSupervisors.length;
            document.getElementById("supervisorsList").innerHTML = allSupervisors.map(u => `<div class="item-card blue"><div class="item-info"><h4>👨‍💼 ${esc(u.name)}</h4><p>🏢 ${esc(u.sector)} | 🔑 ${esc(u.code)}</p></div><div class="item-actions"><button class="icon-btn-sm delete" onclick="deleteSup('${esc(u._id)}')">🗑️</button></div></div>`).join("") || '<div class="empty">لا يوجد مشرفون</div>';
        }
        else if (currentTab === "paramedics") { document.getElementById("paramedicsList").innerHTML = allParameds.map(p => `<div class="item-card green"><div class="item-info"><h4>👨‍🚒 ${esc(p.name)}</h4><p>🏥 ${esc(p.centerName)}</p></div><button class="icon-btn-sm delete" onclick="deleteParamedic('${esc(p._id)}')">🗑️</button></div>`).join(""); }
        else if (currentTab === "vehicles") { document.getElementById("vehiclesList").innerHTML = allVehicles.map(v => `<div class="item-card amber"><div class="item-info"><h4>🚑 ${esc(v.plateNumber)}</h4><p>🏥 ${esc(v.centerName)}</p></div><button class="icon-btn-sm delete" onclick="deleteVehicle('${esc(v._id)}')">🗑️</button></div>`).join(""); }
        else if (currentTab === "broadcasts") { document.getElementById("broadcastsList").innerHTML = allBroadcasts.map(b => `<div class="item-card blue"><div class="item-info"><h4>📢 ${esc(b.title)}</h4><p>${esc(b.description)}</p></div></div>`).join(""); }
    }

    window.saveSupervisor = async function() {
        const name = document.getElementById("supName").value.trim();
        const code = document.getElementById("supCode").value.trim();
        const btn = document.getElementById("btnSaveSup");
        if (!name) return showToast("أدخل الاسم", "danger");
        btn.innerHTML = "⏳ جاري الإنشاء..."; btn.disabled = true;
        try {
            await createUserWithEmailAndPassword(auth, `${code.toLowerCase()}@ems-system.local`, INTERNAL_SECRET);
            await addDoc(collection(db, "access_code"), { name, sector: document.getElementById("supSector").value, phone: document.getElementById("supPhone").value, code, type: "supervisor", active: true, createdAt: new Date().toISOString() });
            document.getElementById("supName").value = ""; document.getElementById("supPhone").value = ""; document.getElementById("supCode").value = generateCode();
            showToast("تم إنشاء الحساب وحفظ المشرف"); syncAll();
        } catch (error) { showToast("خطأ: " + error.message, "danger"); }
        finally { btn.innerHTML = "💾 حفظ وإنشاء حساب"; btn.disabled = false; }
    };

    window.saveParamedic = async function() { const name = document.getElementById("pmName").value.trim(); if (!name) return showToast("أدخل الاسم", "danger"); await addDoc(collection(db, "paramedics"), { name, centerName: document.getElementById("pmCenter").value, rank: document.getElementById("pmRank").value }); document.getElementById("pmName").value = ""; showToast("تم الحفظ"); syncAll(); };
    window.saveVehicle = async function() { const plate = document.getElementById("vPlate").value.trim(); if (!plate) return showToast("أدخل اللوحة", "danger"); await addDoc(collection(db, "vehicles"), { plateNumber: plate, type: document.getElementById("vType").value, centerName: document.getElementById("vCenter").value }); document.getElementById("vPlate").value = ""; showToast("تم الحفظ"); syncAll(); };
    window.sendBroadcast = async function() { const title = document.getElementById("bTitle").value.trim(), desc = document.getElementById("bDesc").value.trim(); if (!title || !desc) return showToast("أكمل البيانات", "danger"); await addDoc(collection(db, "broadcasts"), { title, description: desc, sender: "الإدارة", timestamp: new Date().toISOString() }); document.getElementById("bTitle").value = ""; document.getElementById("bDesc").value = ""; showToast("تم الإرسال"); syncAll(); };
    
    window.deleteSup = async function(id) { if (confirm("حذف؟")) { await deleteDoc(doc(db, "access_code", id)); syncAll(); } };
    window.deleteParamedic = async function(id) { if (confirm("حذف؟")) { await deleteDoc(doc(db, "paramedics", id)); syncAll(); } };
    window.deleteVehicle = async function(id) { if (confirm("حذف؟")) { await deleteDoc(doc(db, "vehicles", id)); syncAll(); } };

    window.manualRefresh = function() { showToast("تحديث..."); syncAll(); };
    window.confirmLogout = async function() { if (confirm("خروج؟")) { await signOut(auth); window.location.href = "./index.html"; } };
    window.closeModal = function() { document.getElementById("modalOverlay").classList.remove("show"); };
</script>
</body>
</html>
