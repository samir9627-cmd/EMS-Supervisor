<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>نظام الإسعاف الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    body { margin:0; padding:0; background:#041814; color:#fff; font-family:'Cairo', sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
    .box { background:rgba(13,74,66,0.6); border:2px solid #978d5b; padding:30px; border-radius:20px; width:90%; max-width:400px; text-align:center; }
    h1 { color:#d4c896; margin-bottom:10px; font-size:24px; }
    p { color:#ccc; margin-bottom:20px; font-size:14px; }
    input { width:100%; padding:15px; border-radius:10px; border:1px solid #978d5b; background:#041814; color:#fff; font-size:18px; text-align:center; letter-spacing:2px; text-transform:uppercase; box-sizing:border-box; margin-bottom:15px; font-family:monospace; }
    button { width:100%; padding:15px; border-radius:10px; border:none; background:linear-gradient(135deg, #978d5b, #d4c896); color:#041814; font-size:16px; font-weight:900; cursor:pointer; font-family:'Cairo'; }
    #msg { margin-top:15px; font-size:14px; color:#ff5252; min-height:20px; font-weight:bold; }
</style>
</head>
<body>

<div class="box">
    <h1>🚑 الإسعاف الذكي</h1>
    <p>بوابة الدخول الموحدة</p>
    <input type="text" id="codeInput" placeholder="أدخل الكود" autocomplete="off">
    <button id="loginBtn" onclick="login()">دخول</button>
    <div id="msg"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3m9o6Qx7m6r1b08DZIkyttArIihZL8n8",
      authDomain: "ems-supervisor.firebaseapp.com",
      projectId: "ems-supervisor",
      storageBucket: "ems-supervisor.firebasestorage.app",
      messagingSenderId: "230655268524",
      appId: "1:230655268524:web:5043a458af3d79989ff109"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const SECRET = "EMS_SECRET_PASSWORD_2026!";

    window.login = async function() {
        const code = document.getElementById("codeInput").value.trim().toUpperCase();
        const msg = document.getElementById("msg");
        const btn = document.getElementById("loginBtn");
        
        if (!code) { msg.textContent = "أدخل الكود أولاً"; return; }
        
        btn.textContent = "جاري التحقق...";
        btn.disabled = true;
        msg.textContent = "";
        msg.style.color = "#ff5252";

        try {
            // تحويل الكود إلى إيميل وهمي
            const email = `${code.toLowerCase().replace(/\s+/g, '')}@ems-system.local`;
            await signInWithEmailAndPassword(auth, email, SECRET);
            
            msg.style.color = "#69f0ae";
            msg.textContent = "✅ تم الدخول بنجاح، جاري التحويل...";
            
            // التوجيه
            setTimeout(() => {
                if (code.startsWith("ADM")) window.location.href = "./admin.html";
                else if (code.startsWith("OPS")) window.location.href = "./ops.html";
                else window.location.href = "./app.html";
            }, 1000);

        } catch (error) {
            console.error(error);
            msg.textContent = "❌ خطأ: " + error.message; // إظهار الخطأ الحقيقي
            btn.textContent = "دخول";
            btn.disabled = false;
        }
    };

    // الدخول التلقائي لو كان مسجلاً مسبقاً
    onAuthStateChanged(auth, (user) => {
        if (user) {
            const code = user.email.split('@')[0].toUpperCase();
            if (code.startsWith("ADM")) window.location.href = "./admin.html";
            else if (code.startsWith("OPS")) window.location.href = "./ops.html";
            else window.location.href = "./app.html";
        }
    });
</script>
</body>
</html>
