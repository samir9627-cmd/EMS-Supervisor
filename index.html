<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>نظام الإسعاف الذكي — البوابة</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal',sans-serif; }
:root { --gold:#978d5b; --gold-light:#d4c896; --gold-bright:#b89c4d; --teal:#0d4a42; --teal-dark:#082b26; --teal-deep:#041814; --bg-white:#ffffff; --bg-light:#f8f9fa; --text-dark:#1e293b; --text-muted:#64748b; --border-gold:rgba(151,141,91,0.3); --red:#e53935; --green:#43a047; --safe-top:env(safe-area-inset-top, 0px); --safe-bottom:env(safe-area-inset-bottom, 0px); }
html, body { background:var(--bg-white); color:var(--text-dark); font-weight:600; overflow-x:hidden; min-height:100vh; }
body { display:flex; flex-direction:column; align-items:center; padding:20px; position:relative; }
body::before { content:''; position:fixed; inset:0; z-index:-2; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.1) 0%, transparent 40%), radial-gradient(circle at 85% 90%, rgba(151,141,91,0.05) 0%, transparent 50%), linear-gradient(180deg, #ffffff 0%, #f8f9fa 50%, #ffffff 100%); }
body::after { content:''; position:fixed; inset:0; z-index:-1; background-image: linear-gradient(rgba(151,141,91,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(151,141,91,0.05) 1px, transparent 1px); background-size: 40px 40px; animation: gridMove 20s linear infinite; pointer-events: none; }
@keyframes gridMove { from { background-position: 0 0; } to { background-position: 40px 40px; } }
.stars { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
.star { position:absolute; width:2px; height:2px; background:var(--gold); border-radius:50%; opacity:0.2; animation:twinkle 4s infinite; }
@keyframes twinkle { 0%,100%{opacity:0.1; transform:scale(0.8);} 50%{opacity:0.5; transform:scale(1.5);} }
#loadingScreen { position:fixed; inset:0; z-index:9999; background:#ffffff; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.6s; }
.loading-logo { width:180px; height:180px; object-fit:contain; border-radius:32px; padding:10px; filter:drop-shadow(0 0 30px rgba(151,141,91,0.4)); animation:logoPulse 2s infinite; }
@keyframes logoPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
.loading-text { color:var(--gold); font-size:18px; font-weight:900; margin-top:24px; letter-spacing:1px; }
.loading-bar { width:240px; height:4px; background:rgba(151,141,91,0.2); border-radius:4px; margin-top:15px; overflow:hidden; }
.loading-bar::after { content:''; display:block; width:50%; height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-light)); animation:loadMove 1.5s infinite; box-shadow:0 0 20px rgba(151,141,91,0.6); }
@keyframes loadMove { 0%{transform:translateX(-100%);} 100%{transform:translateX(200%);} }
.header { text-align:center; margin-top:30px; margin-bottom:25px; animation:fadeInDown 0.8s cubic-bezier(0.4,0,0.2,1); }
@keyframes fadeInDown { from{opacity:0; transform:translateY(-30px);} to{opacity:1; transform:translateY(0);} }
.logo-wrap { position:relative; display:inline-block; margin-bottom:16px; }
.logo-wrap::before { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:280px; height:280px; background:radial-gradient(circle, rgba(151,141,91,0.25) 0%, transparent 70%); border-radius:50%; animation:glowPulse 3s infinite; z-index:-1; }
@keyframes glowPulse { 0%,100%{transform:translate(-50%,-50%) scale(1); opacity:0.5;} 50%{transform:translate(-50%,-50%) scale(1.15); opacity:1;} }
.logo { width:220px; height:220px; object-fit:contain; border-radius:44px; padding:10px; border:3px solid rgba(151,141,91,0.4); background:#ffffff; filter:drop-shadow(0 15px 40px rgba(151,141,91,0.3)); animation:logoFloat 4s ease-in-out infinite; }
@keyframes logoFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
.title { font-size:26px; color:var(--gold-bright); font-weight:900; margin-bottom:8px; }
.subtitle { font-size:15px; color:var(--teal-dark); font-weight:700; letter-spacing:1px; }
.brand { font-size:13px; color:var(--text-muted); margin-top:10px; font-weight:600; }
.login-box { width:100%; max-width:420px; background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); padding:28px 24px; border-radius:28px; border:1px solid rgba(151,141,91,0.3); box-shadow:0 20px 40px rgba(0,0,0,0.05), 0 0 40px rgba(151,141,91,0.1); z-index:1; margin-bottom:24px; animation:fadeInUp 0.8s 0.2s both cubic-bezier(0.4,0,0.2,1); position:relative; overflow:hidden; }
@keyframes fadeInUp { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }
.login-title { color:var(--gold); text-align:center; margin-bottom:22px; font-size:16px; font-weight:900; display:flex; justify-content:center; align-items:center; gap:8px; }
.input-group { position:relative; margin-bottom:16px; z-index:1; }
input[type="text"] { width:100%; padding:20px; background:var(--bg-light); border:2px solid rgba(151,141,91,0.2); border-radius:18px; color:var(--teal-dark); font-size:20px; font-weight:900; text-align:center; letter-spacing:3px; text-transform:uppercase; outline:none; transition:0.3s; font-family:'Courier New', monospace; }
input[type="text"]:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(151,141,91,0.1); background:#ffffff; }
input[type="text"]::placeholder { font-size:14px; letter-spacing:1px; font-family:'Cairo'; font-weight:600; color:#94a3b8; }
.btn-login { width:100%; padding:18px; border-radius:18px; border:none; font-size:17px; font-weight:900; cursor:pointer; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:#ffffff; display:flex; justify-content:center; align-items:center; gap:10px; transition:0.25s; box-shadow:0 10px 20px rgba(151,141,91,0.3); position:relative; z-index:1; }
.btn-login:active { transform:scale(0.97); box-shadow:0 5px 15px rgba(151,141,91,0.2); }
.msg { text-align:center; font-size:13px; font-weight:700; margin-top:16px; min-height:22px; color:var(--red); position:relative; z-index:1; }
.footer { text-align:center; font-size:11px; color:var(--text-muted); padding-bottom:30px; z-index:1; line-height:1.8; letter-spacing:0.5px; }
</style>
</head>
<body>

<div id="loadingScreen">
  <img src="IMG_2828.png" class="loading-logo" alt="شعار">
  <div class="loading-text">جاري التحميل...</div>
  <div class="loading-bar"></div>
</div>

<div class="stars" id="starsContainer"></div>

<div class="header">
  <div class="logo-wrap"><img src="IMG_2828.png" class="logo" alt="شعار الإدارة العامة"></div>
  <h1 class="title">نظام الإسعاف الذكي</h1>
  <div class="subtitle">المشرف الطبي الميداني</div>
  <div class="brand">🏆 أيزو 9001:2015</div>
</div>

<div class="login-box">
  <div class="login-title">🔐 بوابة الدخول</div>
  <div class="input-group">
    <input type="text" id="codeInput" placeholder="أدخل الكود الخاص بك" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <button class="btn-login" id="loginBtn">
    <span>🔓</span> <span>دخول النظام</span>
  </button>
  <div id="msgBox" class="msg"></div>
</div>

<div class="footer">هيئة الدفاع المدني والإسعاف — جميع الحقوق محفوظة &copy; 2026</div>

<script type="module">
    // استيراد دوال Firebase مباشرة من السيرفر (بدون ملف خارجي)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3m9o6Qx7m6r1b08DZIkyttArIihZL8n8",
      authDomain: "ems-supervisor.firebaseapp.com",
      projectId: "ems-supervisor",
      storageBucket: "ems-supervisor.firebasestorage.app",
      messagingSenderId: "230655268524",
      appId: "1:230655268524:web:5043a458af3d79989ff109"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const INTERNAL_SECRET = "EMS_SECRET_PASSWORD_2026!";

    function codeToEmail(code) { return `${code.trim().toLowerCase().replace(/\s+/g, '')}@ems-system.local`; }

    // إخفاء شاشة التحميل
    window.addEventListener('load', () => {
        setTimeout(() => {
            const ls = document.getElementById("loadingScreen");
            if (ls) { ls.style.opacity = "0"; setTimeout(() => ls.remove(), 500); }
            document.getElementById("codeInput").focus();
        }, 1000);
    });

    // نجوم الخلفية
    const starsContainer = document.getElementById("starsContainer");
    for (let i = 0; i < 30; i++) {
        let s = document.createElement("div"); s.className = "star";
        s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%";
        s.style.animationDelay = (Math.random() * 4) + "s"; starsContainer.appendChild(s);
    }

    async function loginWithCodeUI() {
        const codeInput = document.getElementById("codeInput");
        const msg = document.getElementById("msgBox");
        const btn = document.getElementById("loginBtn");
        const code = codeInput.value.trim().toUpperCase();
        if (!code) { msg.innerHTML = "⚠️ الرجاء إدخال الكود"; return; }

        btn.innerHTML = "⏳ جاري التحقق..."; btn.disabled = true; msg.innerHTML = "";

        try {
            await signInWithEmailAndPassword(auth, codeToEmail(code), INTERNAL_SECRET);
            msg.style.color = "#43a047"; msg.innerHTML = "✅ تم الدخول بنجاح";
            setTimeout(() => {
                if (code.startsWith("ADM")) window.location.href = "admin.html";
                else if (code.startsWith("OPS")) window.location.href = "ops.html";
                else window.location.href = "app.html";
            }, 800);
        } catch (error) {
            msg.style.color = "#ff5252"; msg.innerHTML = "❌ الكود غير صحيح أو غير مفعل";
            btn.innerHTML = "<span>🔓</span> <span>دخول النظام</span>"; btn.disabled = false;
        }
    }

    document.getElementById("loginBtn").addEventListener("click", loginWithCodeUI);
    document.getElementById("codeInput").addEventListener("keypress", e => { if (e.key === "Enter") loginWithCodeUI(); });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            const code = user.email.split('@')[0].toUpperCase();
            if (code.startsWith("ADM")) window.location.href = "admin.html";
            else if (code.startsWith("OPS")) window.location.href = "ops.html";
            else window.location.href = "app.html";
        }
    });
</script>
</body>
</html>
