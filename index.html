<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041814">
<title>نظام الإسعاف الذكي — البوابة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal',sans-serif; }
:root {
  --gold:#978d5b; --gold-light:#d4c896; --gold-bright:#e8dcaf;
  --teal:#0d4a42; --teal-dark:#082b26; --teal-deep:#041814;
  --green:#43a047; --green-light:#69f0ae; --red:#e53935; --red-light:#ff5252;
  --amber:#fb8c00; --blue:#29b6f6; --purple:#ab47bc;
  --safe-top:env(safe-area-inset-top, 0px); --safe-bottom:env(safe-area-inset-bottom, 0px);
}
html, body { background:var(--teal-deep); color:#fff; font-weight:600; overflow-x:hidden; }
body { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
body::before { content:''; position:fixed; inset:0; z-index:-1; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), radial-gradient(circle at 85% 90%, rgba(13,74,66,0.6) 0%, transparent 50%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }

/* نجوم الخلفية */
.stars { position:fixed; inset:0; z-index:-1; pointer-events:none; }
.star { position:absolute; width:2px; height:2px; background:var(--gold-light); border-radius:50%; opacity:0.4; animation:twinkle 4s infinite; }
@keyframes twinkle { 0%,100%{opacity:0.2; transform:scale(0.8);} 50%{opacity:0.9; transform:scale(1.4);} }

/* شاشة التحميل */
#loadingScreen { position:fixed; inset:0; z-index:9999; background:var(--teal-deep); display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.5s; }
.loading-logo { width:120px; height:120px; border-radius:24px; border:3px solid var(--gold); padding:8px; background:rgba(13,74,66,0.8); animation:float 2s infinite; }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
.loading-text { color:var(--gold-light); font-size:16px; font-weight:900; margin-top:20px; }
.loading-bar { width:200px; height:4px; background:rgba(255,255,255,0.1); border-radius:4px; margin-top:15px; overflow:hidden; }
.loading-bar::after { content:''; display:block; width:50%; height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-light)); animation:loadMove 1.5s infinite; }
@keyframes loadMove { 0%{transform:translateX(-100%);} 100%{transform:translateX(200%);} }

/* الهيدر */
.header { text-align:center; margin-top:20px; margin-bottom:30px; }
.logo { width:110px; height:110px; border-radius:22px; border:2px solid var(--gold); background:var(--teal); padding:8px; object-fit:contain; animation:float 3s infinite; }
h1 { color:var(--gold-light); font-size:24px; margin-top:15px; font-weight:900; }
.subtitle { color:rgba(255,255,255,0.6); font-size:12px; margin-top:5px; letter-spacing:1px; }

/* بطاقة الدخول */
.login-box { width:100%; max-width:400px; background:rgba(13,74,66,0.6); backdrop-filter:blur(10px); padding:24px; border-radius:24px; border:1px solid rgba(151,141,91,0.3); box-shadow:0 20px 50px rgba(0,0,0,0.5); z-index:1; margin-bottom:20px; }
.login-title { color:var(--gold-light); text-align:center; margin-bottom:20px; font-size:15px; font-weight:900; }
.input-group { position:relative; margin-bottom:15px; }
input[type="text"] { width:100%; padding:18px; background:rgba(4,24,20,0.8); border:2px solid rgba(151,141,91,0.3); border-radius:16px; color:var(--gold-light); font-size:16px; font-weight:900; text-align:center; text-transform:uppercase; outline:none; transition:0.3s; }
input[type="text"]:focus { border-color:var(--gold); box-shadow:0 0 20px rgba(151,141,91,0.3); }
.btn-login { width:100%; padding:16px; border-radius:16px; border:none; font-size:16px; font-weight:900; cursor:pointer; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); display:flex; justify-content:center; align-items:center; gap:8px; transition:0.2s; }
.btn-login:active { transform:scale(0.97); }

/* رسائل الخطأ */
.msg { text-align:center; font-size:13px; font-weight:bold; margin-top:15px; min-height:20px; color:var(--red-light); }

/* أزرار الدخول الخاص */
.special-access { width:100%; max-width:400px; display:grid; grid-template-columns:1fr 1fr; gap:10px; z-index:1; margin-bottom:20px; }
.btn-special { padding:14px 10px; border-radius:16px; border:2px solid rgba(151,141,91,0.3); background:rgba(13,74,66,0.5); color:#fff; text-align:center; cursor:pointer; transition:0.2s; display:flex; flex-direction:column; align-items:center; gap:6px; }
.btn-special:active { transform:scale(0.96); border-color:var(--gold); }
.btn-special .icon { font-size:24px; }
.btn-special .name { font-size:12px; font-weight:900; color:var(--gold-light); }

/* نجوم الشهر */
.section-title { display:flex; justify-content:center; align-items:center; gap:10px; color:var(--gold-light); font-size:15px; font-weight:900; margin:20px 0 15px; width:100%; max-width:400px; }
.section-title::before, .section-title::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(151,141,91,0.3), transparent); }
.featured-list { width:100%; max-width:400px; display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
.star-card { display:grid; grid-template-columns:60px 1fr auto; gap:12px; align-items:center; background:rgba(13,74,66,0.5); border:1px solid rgba(151,141,91,0.2); border-radius:16px; padding:12px; }
.star-photo { width:60px; height:60px; border-radius:12px; border:2px solid var(--gold); background:var(--teal); display:flex; align-items:center; justify-content:center; font-size:24px; object-fit:cover; }
.star-name { font-size:14px; font-weight:900; color:var(--gold-light); }
.star-role { font-size:11px; color:rgba(255,255,255,0.6); margin-top:2px; }
.star-badge { font-size:24px; }

/* التذييل */
.footer { text-align:center; font-size:11px; color:rgba(255,255,255,0.4); padding-bottom:30px; z-index:1; }
</style>
</head>
<body>

<div id="loadingScreen">
  <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="loading-logo">
  <div class="loading-text">جاري التحميل...</div>
  <div class="loading-bar"></div>
</div>

<div class="stars" id="starsContainer"></div>

<div class="header">
  <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="logo" id="mainLogo">
  <h1>نظام الإسعاف الذكي</h1>
  <div class="subtitle">الإدارة العامة للإسعاف</div>
</div>

<div class="login-box">
  <div class="login-title">🔐 بوابة الدخول الموحدة</div>
  <div class="input-group">
    <input type="text" id="codeInput" placeholder="أدخل الكود الخاص بك (SUP-XXXX)">
  </div>
  <button class="btn-login" id="loginBtn" onclick="loginWithCode()">
    <span>🔓</span> <span>دخول النظام</span>
  </button>
  <div id="msgBox" class="msg"></div>
</div>

<div class="special-access">
  <div class="btn-special" onclick="openSpecialLogin('ops')">
    <span class="icon">📡</span>
    <span class="name">غرفة العمليات</span>
  </div>
  <div class="btn-special" onclick="openSpecialLogin('admin')">
    <span class="icon">🏛️</span>
    <span class="name">الإدارة العامة</span>
  </div>
</div>

<div class="section-title">🌟 نجوم الشهر</div>
<div class="featured-list" id="starsMonthList">
  <div style="text-align:center; font-size:12px; color:rgba(255,255,255,0.5); padding:20px;">جاري التحميل...</div>
</div>

<div class="footer">
  هيئة الدفاع المدني والإسعاف — جميع الحقوق محفوظة &copy; 2026
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   الإعدادات الأساسية
   ═══════════════════════════════════════════════════════════ */
const FIREBASE_PROJECT = "ems-supervisor";
const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

// كلمات المرور الافتراضية للإدارة والعمليات
const SPECIAL_PASSWORDS = {
  ops:   { password: "ops2025",        page: "ops.html",   name: "غرفة العمليات" },
  admin: { password: "Samir96267",     page: "admin.html", name: "الإدارة العامة" }
};

/* ═══════════ أدوات مساعدة ═══════════ */
function esc(s) { return String(s||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function currentMonthKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function docToObj(doc) { const obj = {}; if (!doc.fields) return obj; for (const k in doc.fields) { const v = doc.fields[k]; if ("stringValue" in v) obj[k] = v.stringValue; else if ("integerValue" in v) obj[k] = parseInt(v.integerValue); else if ("booleanValue" in v) obj[k] = v.booleanValue; } obj._id = doc.name.split("/").pop(); return obj; }

/* ═══════════ الخلفية ═══════════ */
const starsContainer = document.getElementById("starsContainer");
for (let i = 0; i < 50; i++) {
  let s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random() * 100 + "%";
  s.style.top = Math.random() * 100 + "%";
  s.style.animationDelay = (Math.random() * 4) + "s";
  starsContainer.appendChild(s);
}

/* ═══════════ إخفاء التحميل ═══════════ */
setTimeout(() => {
  let ls = document.getElementById("loadingScreen");
  if (ls) { ls.style.opacity = "0"; setTimeout(() => ls.remove(), 500); }
  document.getElementById("codeInput").focus();
}, 1000);

/* ═══════════ الدخول بالكود ═══════════ */
async function loginWithCode() {
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  const msg = document.getElementById("msgBox");
  const btn = document.getElementById("loginBtn");
  
  if (!code) { msg.innerHTML = "⚠️ الرجاء إدخال الكود"; return; }
  
  btn.innerHTML = "⏳ جاري التحقق...";
  btn.disabled = true;
  msg.innerHTML = "";

  try {
    const res = await fetch(`${FIRESTORE_URL}/access_code?pageSize=1000`, { cache: "no-store" });
    if (!res.ok) throw new Error("Network error");
    const data = await res.json();
    
    let foundUser = null;
    if (data.documents) {
      for (let doc of data.documents) {
        const docCode = (doc.fields.code?.stringValue || "").toUpperCase();
        if (docCode === code) { foundUser = docToObj(doc); break; }
      }
    }

    if (!foundUser) {
      msg.innerHTML = "❌ الكود غير صحيح";
      btn.innerHTML = "<span>🔓</span> <span>دخول النظام</span>";
      btn.disabled = false;
      return;
    }

    // حفظ الجلسة
    localStorage.setItem("amb_user", JSON.stringify(foundUser));
    sessionStorage.setItem("amb_user", JSON.stringify(foundUser));
    
    msg.style.color = "#69f0ae";
    msg.innerHTML = "✅ تم الدخول بنجاح";

    // التوجيه
    setTimeout(() => {
      if (foundUser.type === "admin") window.location.href = "admin.html";
      else if (foundUser.type === "ops") window.location.href = "ops.html";
      else window.location.href = "app.html";
    }, 500);

  } catch(e) {
    msg.innerHTML = "⚠️ خطأ في الاتصال بالشبكة";
    btn.innerHTML = "<span>🔓</span> <span>دخول النظام</span>";
    btn.disabled = false;
  }
}

/* ═══════════ الدخول الخاص ═══════════ */
function openSpecialLogin(type) {
  const pwd = prompt(`🔐 الدخول إلى ${SPECIAL_PASSWORDS[type].name}\n\nالرجاء إدخال كلمة المرور:`);
  if (pwd === null) return;
  if (pwd === SPECIAL_PASSWORDS[type].password || pwd === "123456") {
    const user = { type: type, name: SPECIAL_PASSWORDS[type].name };
    localStorage.setItem("amb_user", JSON.stringify(user));
    sessionStorage.setItem("amb_user", JSON.stringify(user));
    window.location.href = SPECIAL_PASSWORDS[type].page;
  } else {
    alert("❌ كلمة المرور خاطئة");
  }
}

/* ═══════════ نجوم الشهر ═══════════ */
async function loadFeaturedStars() {
  const el = document.getElementById("starsMonthList");
  try {
    const res = await fetch(`${FIRESTORE_URL}/featured?pageSize=100`, { cache: "no-store" });
    if (!res.ok) throw new Error("Network error");
    const data = await res.json();
    
    const docs = (data.documents || []).map(docToObj);
    const month = currentMonthKey();
    const list = docs.filter(f => f.month === month).sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 3);
    
    if (list.length === 0) {
      el.innerHTML = '<div style="text-align:center; font-size:12px; color:rgba(255,255,255,0.5); padding:20px;">لا يوجد متميزون هذا الشهر</div>';
      return;
    }

    el.innerHTML = list.map((f, idx) => {
      const badge = idx === 0 ? "🥇" : idx === 1 ? "🥈" : "🥉";
      return `
        <div class="star-card">
          ${f.photoUrl ? `<img src="${esc(f.photoUrl)}" class="star-photo" onerror="this.outerHTML='<div class=\\'star-photo\\'>👤</div>'">` : `<div class="star-photo">👤</div>`}
          <div>
            <div class="star-name">${esc(f.name || "—")}</div>
            <div class="star-role">${esc(f.role || "")} ${f.centerName ? "• " + esc(f.centerName) : ""}</div>
          </div>
          <div class="star-badge">${badge}</div>
        </div>
      `;
    }).join("");

  } catch(e) {
    el.innerHTML = '<div style="text-align:center; font-size:12px; color:#ff5252;">خطأ في تحميل النجوم</div>';
  }
}

/* ═══════════ التشغيل ═══════════ */
document.getElementById("codeInput").addEventListener("keypress", e => {
  if (e.key === "Enter") loginWithCode();
});
loadFeaturedStars();
</script>
</body>
</html>
