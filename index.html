<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041814">
<title>نظام الإسعاف الذكي — البوابة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal',sans-serif; }
:root { --gold:#978d5b; --gold-light:#d4c896; --teal:#0d4a42; --teal-dark:#082b26; --teal-deep:#041814; --red:#e53935; --green:#43a047; }
html, body { background:var(--teal-deep); color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
body::before { content:''; position:fixed; inset:0; z-index:-1; background: radial-gradient(circle at 15% 10%, rgba(151,141,91,0.15) 0%, transparent 40%), radial-gradient(circle at 85% 90%, rgba(13,74,66,0.6) 0%, transparent 50%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }
.login-box { background: linear-gradient(145deg, rgba(13,74,66,0.65), rgba(4,24,20,0.95)); border: 2px solid rgba(151,141,91,0.4); border-radius: 28px; padding: 34px 24px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 70px rgba(0,0,0,0.7); }
.logo { width: 120px; height: 120px; object-fit: contain; margin-bottom: 20px; animation: float 3s infinite; filter: drop-shadow(0 0 20px rgba(151,141,91,0.6)); }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
h1 { color: var(--gold-light); font-size: 22px; margin-bottom: 8px; }
p { color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 26px; }
input { width: 100%; padding: 18px; background: rgba(4,24,20,0.85); border: 2px solid rgba(151,141,91,0.3); border-radius: 16px; color: var(--gold-light); font-size: 24px; font-weight: 900; text-align: center; letter-spacing: 6px; outline: none; text-transform: uppercase; margin-bottom: 16px; }
input:focus { border-color: var(--gold); }
button { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--teal-deep); font-size: 17px; font-weight: 900; cursor: pointer; }
button:active { transform: scale(0.97); }
#msg { margin-top: 16px; font-size: 13px; font-weight: 700; min-height: 20px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="login-box">
  <img src="https://cdn.imagetourls.com/uploads/tyImg/1bKdWZfuw.png" class="logo" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/National_emblem_of_Oman.svg/200px-National_emblem_of_Oman.svg.png'">
  <h1>نظام الإسعاف الذكي</h1>
  <p>بوابة الدخول الموحدة</p>
  <input type="text" id="codeInput" placeholder="أدخل الكود" autocomplete="off" maxlength="10">
  <button id="loginBtn" onclick="login()">🔓 دخول النظام</button>
  <div id="msg"></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyC3m9o6Qx7m6r1b08DZIkyttArIihZL8n8",
      authDomain: "ems-supervisor.firebaseapp.com",
      projectId: "ems-supervisor",
      storageBucket: "ems-supervisor.firebasestorage.app",
      messagingSenderId: "230655268524",
      appId: "1:230655268524:web:5043a458af3d79989ff109"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function login() {
        const code = document.getElementById("codeInput").value.trim().toUpperCase();
        const msg = document.getElementById("msg");
        const btn = document.getElementById("loginBtn");
        
        if (!code) { msg.style.color = "#ff5252"; msg.textContent = "⚠️ أدخل الكود"; return; }
        
        btn.textContent = "⏳ جاري التحقق...";
        btn.disabled = true;
        msg.textContent = "";

        try {
            // 1. التحقق من المدير
            if (code === "ADM-0001") {
                const user = { name: "المدير العام", type: "admin", code: code };
                localStorage.setItem("ems_session", JSON.stringify(user));
                window.location.href = "./admin.html";
                return;
            }

            // 2. التحقق من غرفة العمليات
            if (code === "OPS-0001") {
                const user = { name: "غرفة العمليات", type: "ops", code: code };
                localStorage.setItem("ems_session", JSON.stringify(user));
                window.location.href = "./ops.html";
                return;
            }

            // 3. التحقق من المشرفين (Firestore)
            const snapshot = await db.collection("access_code").where("code", "==", code).get();
            
            if (snapshot.empty) {
                msg.style.color = "#ff5252"; 
                msg.textContent = "❌ الكود غير صحيح أو غير مفعل";
                btn.textContent = "🔓 دخول النظام";
                btn.disabled = false;
                return;
            }

            const data = snapshot.docs[0].data();
            const user = { name: data.name, code: code, type: data.type || "supervisor", sector: data.sector || "" };
            localStorage.setItem("ems_session", JSON.stringify(user));
            window.location.href = "./app.html";

        } catch (e) {
            console.error(e);
            msg.style.color = "#ff5252";
            msg.textContent = "⚠️ خطأ في الاتصال بالشبكة";
            btn.textContent = "🔓 دخول النظام";
            btn.disabled = false;
        }
    }

    document.getElementById("codeInput").addEventListener("keypress", e => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
