<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#041814">
<title>غرفة العمليات — الشاشة المباشرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
    :root { --gold:#c9a227; --green:#0d4a42; --bg:#041814; --red:#e53935; --blue:#29b6f6; --purple:#ab47bc; }
    body { background:var(--bg); color:#fff; min-height:100vh; padding-bottom:20px; }
    
    /* الشريط العلوي */
    .topbar { background:linear-gradient(135deg, var(--purple), #4a148c); padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--gold); position:sticky; top:0; z-index:100; box-shadow:0 4px 15px rgba(0,0,0,0.5); }
    .topbar h2 { font-size:15px; color:#fff; display:flex; align-items:center; gap:8px; }
    .btn-logout { background:var(--red); color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; cursor:pointer; transition:0.2s; }
    .btn-logout:active { transform:scale(0.95); }
    
    .content { padding:15px; max-width:800px; margin:0 auto; }
    
    /* المؤشرات السريعة */
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .stat-box { background:linear-gradient(145deg, rgba(13,74,66,0.6), rgba(4,24,20,0.9)); border:1px solid rgba(201,162,39,0.3); border-radius:12px; padding:15px; text-align:center; }
    .stat-box .num { font-size:28px; font-weight:900; color:var(--gold); }
    .stat-box .lbl { font-size:11px; color:rgba(255,255,255,0.6); margin-top:4px; }
    .stat-box.issue { border-color:rgba(229,57,53,0.4); }
    .stat-box.issue .num { color:var(--red); }
    .stat-box.visit { border-color:rgba(41,182,246,0.4); }
    .stat-box.visit .num { color:var(--blue); }

    /* قائمة الأحداث */
    .card { background:rgba(255,255,255,0.03); border:1px solid rgba(201,162,39,0.2); border-radius:16px; padding:15px; margin-bottom:15px; }
    .card h3 { color:var(--gold); margin-bottom:15px; font-size:15px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(201,162,39,0.2); padding-bottom:10px; }
    
    .activity-item { background:rgba(255,255,255,0.05); border-right:4px solid var(--gold); border-radius:8px; padding:12px; margin-bottom:10px; animation:fadeIn 0.4s; }
    .activity-item.issue { border-right-color:var(--red); background:linear-gradient(90deg, rgba(229,57,53,0.1), transparent); }
    .activity-item.visit { border-right-color:var(--blue); background:linear-gradient(90deg, rgba(41,182,246,0.1), transparent); }
    
    @keyframes fadeIn { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:translateX(0); } }
    
    .act-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .act-title { font-weight:900; font-size:14px; }
    .activity-item.issue .act-title { color:#ff8a80; }
    .activity-item.visit .act-title { color:#81d4fa; }
    
    .act-date { font-size:10px; color:rgba(255,255,255,0.6); font-family:monospace; }
    .act-supervisor { font-size:12px; color:var(--gold); margin-bottom:6px; display:flex; align-items:center; gap:5px; }
    .act-desc { font-size:12px; color:rgba(255,255,255,0.9); line-height:1.5; background:rgba(0,0,0,0.2); padding:8px; border-radius:6px; }
    
    .refresh-btn { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:12px 30px; border-radius:30px; background:linear-gradient(135deg, var(--gold), #e5c158); color:var(--bg); border:none; font-weight:900; font-size:13px; box-shadow:0 5px 20px rgba(201,162,39,0.5); cursor:pointer; transition:0.2s; display:flex; align-items:center; gap:8px; }
    .refresh-btn:active { transform:translateX(-50%) scale(0.95); }
    .refresh-btn .spinner { display:none; width:14px; height:14px; border:2px solid var(--bg); border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; }
    .refresh-btn.loading .spinner { display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
    <h2>📡 غرفة العمليات — الشاشة المباشرة</h2>
    <button class="btn-logout" onclick="logout()">خروج</button>
</div>

<div class="content">
    <!-- المؤشرات -->
    <div class="stats-grid">
        <div class="stat-box issue">
            <div class="num" id="statIssues">0</div>
            <div class="lbl">إشكالية ميدانية</div>
        </div>
        <div class="stat-box visit">
            <div class="num" id="statVisits">0</div>
            <div class="lbl">تقرير زيارة</div>
        </div>
    </div>

    <!-- سجل العمليات المباشر -->
    <div class="card">
        <h3>📊 آخر النشاطات (مباشر)</h3>
        <div id="liveFeed">
            <p style="text-align:center; font-size:12px; color:#ccc;">جاري جلب البيانات...</p>
        </div>
    </div>
</div>

<button class="refresh-btn" id="refreshBtn" onclick="loadOpsData()">
    <span>🔄 تحديث البيانات</span>
    <span class="spinner"></span>
</button>

<script>
    const FIREBASE_PROJECT = "ems-supervisor";
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

    // حماية الصفحة
    const sessionStr = localStorage.getItem("amb_session");
    if (!sessionStr) window.location.href = "index.html";
    const currentUser = JSON.parse(sessionStr || "{}");
    if (currentUser.type !== "ops") window.location.href = "index.html";

    function logout() { localStorage.removeItem("amb_session"); window.location.href = "index.html"; }

    function getString(field) { return (field && field.stringValue) ? field.stringValue : ""; }
    function docToObj(doc) {
        const obj = {}; if (!doc.fields) return obj;
        for (const k in doc.fields) obj[k] = getString(doc.fields[k]);
        obj._id = doc.name.split("/").pop(); return obj;
    }

    async function loadOpsData() {
        const feedDiv = document.getElementById("liveFeed");
        const btn = document.getElementById("refreshBtn");
        
        btn.classList.add("loading");
        feedDiv.innerHTML = "<p style='text-align:center; font-size:12px; color:#e5c158;'>⏳ جاري التحديث...</p>";

        try {
            const res = await fetch(`${FIRESTORE_URL}/activities?pageSize=1000`, { cache: "no-store" });
            const data = await res.json();

            if (!data.documents || data.documents.length === 0) {
                feedDiv.innerHTML = "<p style='text-align:center; font-size:12px; color:#ccc;'>لا توجد نشاطات في النظام.</p>";
                document.getElementById("statIssues").innerText = 0;
                document.getElementById("statVisits").innerText = 0;
                btn.classList.remove("loading");
                return;
            }

            // تحويل وترتيب
            let allActs = data.documents.map(docToObj).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

            // حساب الإحصائيات
            let issuesCount = allActs.filter(a => a.type === 'issue').length;
            let visitsCount = allActs.filter(a => a.type === 'visit').length;
            
            document.getElementById("statIssues").innerText = issuesCount;
            document.getElementById("statVisits").innerText = visitsCount;

            // عرض آخر 50 نشاط
            feedDiv.innerHTML = allActs.slice(0, 50).map(a => {
                const dateObj = new Date(a.timestamp);
                const timeStr = dateObj.toLocaleTimeString('ar-OM', { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString('ar-OM');
                
                if (a.type === 'issue') {
                    return `
                        <div class="activity-item issue">
                            <div class="act-header">
                                <span class="act-title">🚩 إشكالية: ${a.issueType}</span>
                                <span class="act-date">${dateStr} - ${timeStr}</span>
                            </div>
                            <div class="act-supervisor">👤 المشرف: ${a.supervisor}</div>
                            <div class="act-desc">${a.description}</div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="activity-item visit">
                            <div class="act-header">
                                <span class="act-title">📋 زيارة (تقييم: ${a.score}%)</span>
                                <span class="act-date">${dateStr} - ${timeStr}</span>
                            </div>
                            <div class="act-supervisor">👤 المشرف: ${a.supervisor}</div>
                            <div class="act-desc">${a.notes || 'لا توجد ملاحظات.'}</div>
                        </div>
                    `;
                }
            }).join("");

        } catch(e) {
            feedDiv.innerHTML = "<p style='text-align:center; font-size:12px; color:#ff5252;'>خطأ في الاتصال بالشبكة.</p>";
        } finally {
            btn.classList.remove("loading");
        }
    }

    // تحديث تلقائي كل 30 ثانية
    window.onload = function() { 
        loadOpsData(); 
        setInterval(loadOpsData, 30000); 
    };
</script>
</body>
</html>
